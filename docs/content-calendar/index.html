<title>Daily Bible Pause Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,300;7..72,400&family=Inter:wght@400;500;600;700&display=swap"
/>
<style>
  /* Layout (Figma option A3): the month as a stack of weeks. Each week = a row of day headers + three channel lanes
     (YouTube EN, YouTube RU, Facebook + Instagram), each lane with its own tint. In a day cell: long forms as a
     thumbnail + working name, a divider, then Shorts/reels three in a row labelled by type. Dark only, by choice. */
  :root {
    --ground: #15100e;
    --line: #2f2420;
    --ink: #f6ece2;
    --soft: #d9cbbf;
    --muted: #9c8a7f;
    --hover: #2a201c;
    --flame: #e2583a;
    --gold: #efd08a;
    --red: #ff4d4d;
    --en: #221614;
    --en-lab: #1b1210;
    --en-div: #3a2622;
    --ru: #211b13;
    --ru-lab: #1a150f;
    --ru-div: #382d20;
    --meta: #161a20;
    --meta-lab: #11151a;
    --meta-div: #262c36;
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --sans:
      "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color-scheme: dark;
  }
  html,
  body {
    background: var(--ground);
    color: var(--ink);
  }
  body {
    font-family: var(--sans);
    padding-inline: 16px;
    padding-block: 20px 40px;
  }
  .wrap {
    max-width: 1440px;
    margin: 0 auto;
    display: grid;
    gap: 18px;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mark {
    width: 32px;
    height: 32px;
    flex: none;
  }
  .month {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(24px, 3vw, 34px);
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1;
  }
  .month span {
    color: var(--muted);
  }
  .spacer {
    flex: 1;
  }
  .ghost {
    appearance: none;
    background: transparent;
    border: 0;
    color: var(--muted);
    border-radius: 8px;
    height: 34px;
    min-width: 34px;
    display: inline-grid;
    place-items: center;
    cursor: pointer;
    font: 500 18px/1 var(--sans);
    padding: 0 6px;
    position: relative;
    text-decoration: none;
  }
  .ghost:hover {
    background: var(--hover);
    color: var(--ink);
  }
  .ghost svg {
    width: 20px;
    height: 20px;
  }
  button:focus-visible,
  a:focus-visible,
  .tile:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .nav,
  .filters {
    display: flex;
    gap: 2px;
    align-items: center;
  }
  .divider {
    width: 1px;
    height: 20px;
    background: var(--line);
    margin: 0 6px;
  }

  /* Filters: icons only. Click one lane to see only it; click again to see all. */
  .fchip {
    appearance: none;
    border: 0;
    background: transparent;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: inline-grid;
    place-items: center;
    cursor: pointer;
    position: relative;
  }
  .fchip:hover,
  .fchip[aria-pressed="true"] {
    background: var(--hover);
  }
  .fchip svg {
    width: 20px;
    height: 20px;
  }
  .filters.picked .fchip[aria-pressed="false"] {
    opacity: 0.3;
  }
  .fchip[aria-pressed="true"]::after {
    content: "";
    position: absolute;
    bottom: 2px;
    left: 50%;
    width: 4px;
    height: 4px;
    margin-left: -2px;
    border-radius: 50%;
    background: var(--ink);
  }
  .fchip .pair {
    display: flex;
    gap: 2px;
  }
  .fchip .pair svg {
    width: 16px;
    height: 16px;
  }
  .tag {
    position: absolute;
    right: 2px;
    bottom: 5px;
    font: 700 7px/1 var(--sans);
    color: #fff;
    border-radius: 2px;
    padding: 1px 2px;
    background: #5a4a42;
  }
  .tag.ru {
    background: var(--flame);
  }

  /* Weeks */
  .weeks {
    display: grid;
    gap: 14px;
  }
  .week {
    display: grid;
    grid-template-columns: 64px repeat(7, minmax(0, 1fr));
    gap: 1px;
    background: var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .dh {
    background: var(--ground);
    color: var(--muted);
    font: 600 11px/1 var(--sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 12px;
    font-variant-numeric: tabular-nums;
  }
  .dh.off {
    opacity: 0.35;
  }
  .dh.today b {
    background: var(--gold);
    color: var(--ground);
    border-radius: 999px;
    padding: 2px 7px;
    font-weight: 700;
  }
  .lab {
    display: grid;
    justify-items: center;
    align-content: start;
    gap: 4px;
    padding-top: 14px;
  }
  .lab svg {
    width: 28px;
    height: 28px;
  }
  .lab .t {
    font: 700 10px/1 var(--sans);
    color: #fff;
    border-radius: 3px;
    padding: 2px 3px;
    background: #5a4a42;
  }
  .lab .t.ru {
    background: var(--flame);
  }
  .cell {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding-block: 15px;
    min-width: 0;
    min-height: 56px;
  }
  .cell.off {
    opacity: 0.35;
  }
  .yt-en {
    background: var(--en);
  }
  .yt-en.lab {
    background: var(--en-lab);
  }
  .yt-ru {
    background: var(--ru);
  }
  .yt-ru.lab {
    background: var(--ru-lab);
  }
  .meta {
    background: var(--meta);
  }
  .meta.lab {
    background: var(--meta-lab);
  }
  .cell hr {
    border: 0;
    height: 1px;
    margin: 0;
  }
  .yt-en hr {
    background: var(--en-div);
  }
  .yt-ru hr {
    background: var(--ru-div);
  }
  .meta hr {
    background: var(--meta-div);
  }
  .longs {
    display: grid;
    gap: 10px;
    padding-inline: 12px;
  }
  .shorts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 6px;
    padding-inline: 12px;
  }

  /* Tiles */
  .tile {
    appearance: none;
    border: 0;
    padding: 0;
    background: none;
    color: inherit;
    cursor: pointer;
    text-align: left;
    font: inherit;
  }
  .tile .pic {
    outline: 0.5px solid rgba(255, 255, 255, 0.07);
    outline-offset: -0.5px;
    position: relative;
    display: block;
    border-radius: 4px;
    overflow: hidden;
    background: #2a201c;
    transition: transform 0.15s ease;
  }
  .tile .pic img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .tile:hover .pic {
    transform: scale(1.05);
  }
  .long {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .long .pic {
    flex: none;
    width: 96px;
    aspect-ratio: 16 / 9;
  }
  .long .nm {
    font-size: 11px;
    line-height: 1.25;
    color: var(--soft);
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .short {
    display: grid;
    justify-items: center;
    gap: 3px;
    width: 44px;
  }
  .short .pic {
    width: 44px;
    aspect-ratio: 9 / 16;
  }
  .short .ct {
    font: 500 9px/1.2 var(--sans);
    color: var(--muted);
    white-space: nowrap;
  }
  /* States */
  .tile.scheduled .pic img {
    opacity: 0.6;
  }
  .tile.scheduled .pic::after,
  .tile.planned .pic::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 4px;
    border: 1.5px dashed var(--flame);
  }
  .tile.scheduled .pic::before {
    content: "";
    position: absolute;
    z-index: 1;
    top: 3px;
    right: 3px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--flame);
    box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.5);
  }
  .tile.planned .pic {
    background: repeating-linear-gradient(
      135deg,
      #1f1714 0 5px,
      #261c18 5px 10px
    );
  }
  .tile.planned .pic img {
    opacity: 0.25;
  }
  .tile.planned .pic::after {
    border-color: var(--muted);
    opacity: 0.7;
  }
  .tile.paid .pic {
    box-shadow: 0 0 0 1.5px var(--gold);
  }

  #tip {
    position: fixed;
    z-index: 50;
    max-width: 260px;
    background: #0b0807;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    font: 400 12px/1.35 var(--sans);
    pointer-events: none;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
  }
  #tip b {
    display: block;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 13px;
    margin-bottom: 2px;
  }
  #tip span {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Overlay */
  #ov {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(8, 5, 4, 0.82);
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  .ov-card {
    display: flex;
    gap: 22px;
    align-items: center;
    max-width: 100%;
  }
  .ov-side {
    display: grid;
    gap: 10px;
    width: 230px;
    min-width: 0;
  }
  .ov-side h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 18px;
    line-height: 1.3;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .ov-meta {
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
  }
  .pbtn {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 14px;
    border-radius: 10px;
    background: #261d19;
    border: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    font: 600 14px/1 var(--sans);
  }
  .pbtn svg {
    width: 22px;
    height: 22px;
    flex: none;
  }
  .pbtn small {
    margin-left: auto;
    color: var(--muted);
    font-weight: 500;
    font-size: 11px;
  }
  a.pbtn:hover {
    background: #33261f;
    border-color: var(--muted);
  }
  .pbtn.off {
    opacity: 0.45;
    cursor: default;
  }
  .ov-thumb {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
    flex: none;
  }
  .ov-thumb.tall {
    height: min(78vh, 640px);
    aspect-ratio: 9 / 16;
  }
  .ov-thumb.wide {
    width: min(62vw, 760px);
    aspect-ratio: 16 / 9;
  }
  .ov-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .ov-x {
    position: absolute;
    top: 14px;
    right: 16px;
  }

  .status {
    color: var(--muted);
    font-size: 12px;
    min-height: 1em;
  }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 28px 0;
    text-align: center;
  }

  /* Phone: one day per block, the three lanes stacked inside it. */
  .agenda {
    display: none;
    gap: 14px;
  }
  .aday {
    display: grid;
    gap: 1px;
    background: var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .aday h3 {
    margin: 0;
    background: var(--ground);
    font: 600 12px var(--sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 12px;
  }
  .aday h3.today {
    color: var(--gold);
  }
  .arow {
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 1px;
  }
  .arow .lab svg {
    width: 24px;
    height: 24px;
  }
  @media (max-width: 860px) {
    .weeks {
      display: none;
    }
    .agenda {
      display: grid;
    }
    .ov-card {
      flex-direction: column-reverse;
      gap: 14px;
    }
    .ov-side {
      width: min(320px, 100%);
    }
    .ov-thumb.tall {
      height: 52vh;
    }
    .ov-thumb.wide {
      width: min(92vw, 520px);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile .pic {
      transition: none;
    }
    .tile:hover .pic {
      transform: none;
    }
  }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <svg
        class="mark"
        viewBox="0 0 100 100"
        aria-label="Daily Bible Pause"
        role="img"
      >
        <circle cx="50" cy="50" r="50" fill="#e2583a" />
        <path
          d="M27 30 L42 33 L42 67 L27 70 Z M73 30 L58 33 L58 67 L73 70 Z"
          fill="none"
          stroke="#fff6f0"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </svg>
      <h1 class="month" id="month"></h1>
    </div>
    <div class="nav">
      <button class="ghost" id="prev" aria-label="Previous week">‹</button>
      <button class="ghost" id="todayBtn" aria-label="This week">•</button>
      <button class="ghost" id="next" aria-label="Next week">›</button>
    </div>
    <div class="spacer"></div>
    <div
      class="filters"
      id="filters"
      role="group"
      aria-label="Show only one channel"
    ></div>
    <span class="divider" aria-hidden="true"></span>
    <a
      class="ghost"
      href="https://claude.ai/artifact/T3QFpYWsVKKk1Px4k1QhNS"
      target="_blank"
      rel="noopener"
      title="Analytics dashboard"
      aria-label="Analytics dashboard"
      ><svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg
    ></a>
  </header>
  <div class="weeks" id="weeks"></div>
  <div class="agenda" id="agenda"></div>
  <div class="status" id="status"></div>
</div>
<div id="tip" hidden></div>
<div id="ov" hidden role="dialog" aria-modal="true" aria-label="Post"></div>

<script>
  const ICON = {
    yt: '<svg viewBox="0 0 24 24"><rect x="1" y="4.5" width="22" height="15" rx="4.5" fill="#ff0033"/><path d="M9.8 8.6v6.8l5.9-3.4z" fill="#fff"/></svg>',
    fb: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#0866ff"/><path d="M13.3 23v-8.2h2.6l.4-3h-3v-1.9c0-.9.3-1.5 1.5-1.5h1.6V5.7c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.6v3h2.6V23z" fill="#fff"/></svg>',
    ig: '<svg viewBox="0 0 24 24"><defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".6" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="url(#igg)"/><rect x="6" y="6" width="12" height="12" rx="3.6" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.3" cy="7.7" r="1" fill="#fff"/></svg>',
  }
  // Platforms on a row: any of yt-en, yt-ru, fb, ig. Lanes: yt-en, yt-ru, meta (fb + ig).
  const PLATS = [
    { key: "yt-en", icon: "yt", label: "YouTube" },
    { key: "yt-ru", icon: "yt", ru: true, label: "YouTube RU" },
    { key: "fb", icon: "fb", label: "Facebook" },
    { key: "ig", icon: "ig", label: "Instagram" },
  ]
  const LANES = [
    { key: "yt-en", label: "YouTube EN", plats: ["yt-en"] },
    { key: "yt-ru", label: "YouTube RU", plats: ["yt-ru"] },
    { key: "meta", label: "Facebook + Instagram", plats: ["fb", "ig"] },
  ]
  const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
  const MONTHS = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December",
  ]

  const store = (k, v) => {
    try {
      if (v === undefined) return JSON.parse(localStorage.getItem(k))
      localStorage.setItem(k, JSON.stringify(v))
    } catch (e) {
      return null
    }
  }
  let posts = []
  let items = []
  let only = store("dbp-cal-lane") || null
  const now = new Date()
  let week = null // first Monday shown; set below once weekStart exists
  const pad = (n) => String(n).padStart(2, "0")
  const ymd = (d) =>
    d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
  const todayKey = ymd(now)
  const esc = (s) =>
    String(s ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    )

  const isLong = (p) => p.kind === "long"
  const isPlanned = (p) => p.status === "planned"
  const isFuture = (p) =>
    p.status === "scheduled" &&
    new Date(p.date + "T" + (p.time || "23:59")) > new Date()
  // "martha-short-history-yt-en" -> story "martha", cut "history". Planned rows: "plan-a-short-intro-en".
  function parseId(p) {
    const id = String(p.id || "")
      .replace(/^plan-/, "")
      .replace(/-(yt-en|yt-ru|meta|fb|ig|en|ru)$/, "")
    const m = id.match(/^(.*?)-(short|reel|post|story)-(.+)$/)
    return m ? { story: m[1], cut: m[3] } : { story: id, cut: "" }
  }
  const cutKey = (p) =>
    p.group || parseId(p).story + "|" + (p.cut || parseId(p).cut)
  // Short label under a vertical tile: intro / verse / insight / refl. / teaser.
  function cutLabel(p) {
    const c = String(p.cut || parseId(p).cut).toLowerCase()
    if (/refl/.test(c)) return "refl."
    if (/insight|history|language|vox|word/.test(c)) return "insight"
    if (/verse|scene/.test(c)) return "verse"
    if (/intro/.test(c)) return "intro"
    if (/teaser/.test(c)) return "teaser"
    if (/carousel|post/.test(c) || p.kind === "post") return "post"
    if (/long/.test(c)) return "full"
    return c.split("-")[0].slice(0, 8)
  }
  // Working name of a long form: the story, plus LUMO for the LUMO cut.
  function workName(p) {
    const s = p.story || parseId(p).story
    const name = s.replace(/-/g, " ").replace(/\b\w/g, (x) => x.toUpperCase())
    return /lumo/i.test(p.id) ? name + " LUMO" : name
  }
  function urlFor(p, k) {
    if (p.links && p.links[k]) return p.links[k]
    const l = p.link || ""
    if (k === "fb") return /facebook\.com/.test(l) ? l : ""
    if (k === "ig") return /instagram\.com/.test(l) ? l : ""
    return /youtu/.test(l) ? l : ""
  }

  // One tile per (date, lane, cut). The overlay of a tile lists every platform the same cut went to that day.
  function build() {
    const live = posts.filter((p) => p.date && !p.campaign)
    const tiles = new Map()
    for (const p of live) {
      for (const lane of LANES) {
        const plats = (p.platforms || []).filter((k) => lane.plats.includes(k))
        if (!plats.length) continue
        const key =
          p.date +
          "|" +
          lane.key +
          "|" +
          (isLong(p) ? "long|" + p.id : cutKey(p)) +
          (isPlanned(p) ? "|planned" : "")
        if (!tiles.has(key))
          tiles.set(key, {
            date: p.date,
            lane: lane.key,
            long: isLong(p),
            rows: [],
            plats: new Set(),
          })
        const t = tiles.get(key)
        t.rows.push(p)
        plats.forEach((k) => t.plats.add(k))
      }
    }
    items = [...tiles.values()].map((t) => {
      const lead = t.rows[0]
      // Siblings: the same cut on the same day in other lanes, so the overlay shows all its platforms.
      const sib = t.long
        ? t.rows
        : live.filter(
            (q) =>
              q.date === t.date &&
              !isLong(q) &&
              cutKey(q) === cutKey(lead) &&
              isPlanned(q) === isPlanned(lead),
          )
      const platforms = PLATS.map((x) => x.key).filter((k) =>
        sib.some((q) => (q.platforms || []).includes(k)),
      )
      const links = {}
      platforms.forEach((k) => {
        const m = sib.find((q) => (q.platforms || []).includes(k))
        links[k] = {
          url: urlFor(m, k),
          scheduled: isFuture(m),
          planned: isPlanned(m),
          time: m.time || "",
        }
      })
      const times = t.rows
        .map((q) => q.time)
        .filter(Boolean)
        .sort()
      return {
        date: t.date,
        lane: t.lane,
        long: t.long,
        tall: !t.long,
        kind: lead.kind,
        time: times[0] || "",
        title: lead.title || "",
        label: t.long ? workName(lead) : cutLabel(lead),
        thumb: (t.rows.find((q) => q.thumb) || {}).thumb || "",
        duration: (t.rows.find((q) => q.duration) || {}).duration || "",
        note: t.rows
          .map((q) => q.note)
          .filter(Boolean)
          .join(" · "),
        paid: t.rows.some((q) => q.paid),
        scheduled: t.rows.every(isFuture),
        planned: t.rows.every(isPlanned),
        platforms,
        links,
      }
    })
  }

  function tile(it) {
    const i = items.indexOf(it)
    const cls = [
      "tile",
      it.long ? "long" : "short",
      it.scheduled ? "scheduled" : "",
      it.planned ? "planned" : "",
      it.paid ? "paid" : "",
    ].join(" ")
    const pic =
      '<span class="pic">' +
      (it.thumb
        ? '<img src="' + esc(it.thumb) + '" alt="" loading="lazy">'
        : "") +
      "</span>"
    return (
      '<button type="button" class="' +
      cls +
      '" data-i="' +
      i +
      '" aria-label="' +
      esc(it.title || it.label) +
      '">' +
      pic +
      (it.long
        ? '<span class="nm">' + esc(it.label) + "</span>"
        : '<span class="ct">' + esc(it.label) + "</span>") +
      "</button>"
    )
  }
  const byTime = (a, b) => (a.time || "99").localeCompare(b.time || "99")
  function cellInner(list) {
    const longs = list.filter((it) => it.long).sort(byTime)
    const shorts = list.filter((it) => !it.long).sort(byTime)
    return (
      (longs.length
        ? '<div class="longs">' + longs.map(tile).join("") + "</div>"
        : "") +
      (longs.length && shorts.length ? "<hr>" : "") +
      (shorts.length
        ? '<div class="shorts">' + shorts.map(tile).join("") + "</div>"
        : "")
    )
  }
  function laneMark(lane) {
    if (lane.key === "meta") return ICON.fb + ICON.ig
    return (
      ICON.yt +
      '<span class="t' +
      (lane.key === "yt-ru" ? " ru" : "") +
      '">' +
      (lane.key === "yt-ru" ? "RU" : "EN") +
      "</span>"
    )
  }

  // The page shows one week (Mon–Sun). The title is the month of that week's Thursday.
  function weekStart(d) {
    const s = new Date(d.getFullYear(), d.getMonth(), d.getDate())
    s.setDate(s.getDate() - ((s.getDay() + 6) % 7))
    return s
  }
  function render() {
    const days = [...Array(7)].map((_, i) => {
      const d = new Date(week)
      d.setDate(week.getDate() + i)
      return d
    })
    const th = days[3]
    document.getElementById("month").innerHTML =
      MONTHS[th.getMonth()] + " <span>" + th.getFullYear() + "</span>"
    const lanes = LANES.filter((l) => !only || l.key === only)
    const idx = {}
    items.forEach((it) => {
      ;(idx[it.date + "|" + it.lane] = idx[it.date + "|" + it.lane] || []).push(
        it,
      )
    })
    let html =
      '<section class="week"><div class="dh"></div>' +
      days
        .map((d) => {
          const k = ymd(d)
          return (
            '<div class="dh' +
            (k === todayKey ? " today" : "") +
            '">' +
            DOW[(d.getDay() + 6) % 7] +
            " <b>" +
            d.getDate() +
            "</b>" +
            (d.getDate() === 1 ? " " + MONTHS[d.getMonth()].slice(0, 3) : "") +
            "</div>"
          )
        })
        .join("")
    for (const lane of lanes) {
      html +=
        '<div class="' +
        lane.key +
        ' lab" title="' +
        lane.label +
        '">' +
        laneMark(lane) +
        "</div>"
      html += days
        .map(
          (d) =>
            '<div class="cell ' +
            lane.key +
            '">' +
            cellInner(idx[ymd(d) + "|" + lane.key] || []) +
            "</div>",
        )
        .join("")
    }
    html += "</section>"
    document.getElementById("weeks").innerHTML = html

    // Phone: the same week as a list of days that have posts.
    const keys = days
      .map(ymd)
      .filter((k) => lanes.some((l) => idx[k + "|" + l.key]))
    document.getElementById("agenda").innerHTML = keys.length
      ? keys
          .map((k) => {
            const d = new Date(k + "T12:00")
            return (
              '<section class="aday"><h3 class="' +
              (k === todayKey ? "today" : "") +
              '">' +
              DOW[(d.getDay() + 6) % 7] +
              " " +
              d.getDate() +
              "</h3>" +
              lanes
                .filter((l) => idx[k + "|" + l.key])
                .map(
                  (l) =>
                    '<div class="arow"><div class="' +
                    l.key +
                    ' lab">' +
                    laneMark(l) +
                    '</div><div class="cell ' +
                    l.key +
                    '">' +
                    cellInner(idx[k + "|" + l.key]) +
                    "</div></div>",
                )
                .join("") +
              "</section>"
            )
          })
          .join("")
      : '<div class="empty">Nothing this week yet.</div>'
  }

  function renderFilters() {
    const box = document.getElementById("filters")
    box.classList.toggle("picked", !!only)
    box.innerHTML = LANES.map(
      (l) =>
        '<button class="fchip" data-k="' +
        l.key +
        '" aria-pressed="' +
        (only === l.key) +
        '" title="Show only ' +
        l.label +
        '" aria-label="Show only ' +
        l.label +
        '">' +
        (l.key === "meta"
          ? '<span class="pair">' + ICON.fb + ICON.ig + "</span>"
          : ICON.yt +
            '<span class="tag' +
            (l.key === "yt-ru" ? " ru" : "") +
            '">' +
            (l.key === "yt-ru" ? "RU" : "EN") +
            "</span>") +
        "</button>",
    ).join("")
  }
  document.getElementById("filters").addEventListener("click", (e) => {
    const b = e.target.closest(".fchip")
    if (!b) return
    only = only === b.dataset.k ? null : b.dataset.k
    store("dbp-cal-lane", only)
    renderFilters()
    render()
  })
  const step = (n) => {
    week.setDate(week.getDate() + 7 * n)
    render()
  }
  document.getElementById("prev").onclick = () => step(-1)
  document.getElementById("next").onclick = () => step(1)
  document.getElementById("todayBtn").onclick = () => {
    week = weekStart(new Date())
    render()
  }
  // Arrow keys and a horizontal swipe also move a week.
  addEventListener("keydown", (e) => {
    if (!document.getElementById("ov").hidden) return
    if (e.key === "ArrowLeft") step(-1)
    if (e.key === "ArrowRight") step(1)
  })
  let tx = null
  addEventListener(
    "touchstart",
    (e) => {
      tx = e.touches[0].clientX
    },
    { passive: true },
  )
  addEventListener("touchend", (e) => {
    if (tx === null) return
    const dx = e.changedTouches[0].clientX - tx
    tx = null
    if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1)
  })

  // Overlay: big thumbnail + one button per platform the cut went to.
  const ov = document.getElementById("ov")
  let lastFocus = null
  function openOverlay(it) {
    lastFocus = document.activeElement
    const d = new Date(it.date + "T12:00")
    const when =
      DOW[(d.getDay() + 6) % 7] +
      " " +
      d.getDate() +
      " " +
      MONTHS[d.getMonth()] +
      (it.time ? ", " + it.time : "") +
      (it.duration ? " · " + it.duration : "")
    const btns = it.platforms
      .map((k) => {
        const p = PLATS.find((x) => x.key === k)
        const l = it.links[k] || {}
        const label =
          k === "yt-en" || k === "yt-ru"
            ? (it.kind === "long" ? "YouTube" : "YouTube Shorts") +
              (p.ru ? " RU" : "")
            : p.label
        const note = l.planned
          ? "Planned " + (l.time || "")
          : l.scheduled
            ? "Scheduled " + (l.time || "") + (l.url ? " ↗" : "")
            : l.url
              ? "Open ↗"
              : "No link yet"
        return l.url
          ? '<a class="pbtn" href="' +
              esc(l.url) +
              '" target="_blank" rel="noopener">' +
              ICON[p.icon] +
              label +
              "<small>" +
              note +
              "</small></a>"
          : '<span class="pbtn off">' +
              ICON[p.icon] +
              label +
              "<small>" +
              esc(note) +
              "</small></span>"
      })
      .join("")
    ov.innerHTML =
      '<button class="ghost ov-x" id="ovx" aria-label="Close">✕</button><div class="ov-card">' +
      '<div class="ov-side"><h2>' +
      esc(it.title || it.label) +
      '</h2><div class="ov-meta">' +
      esc(when + (it.note ? " · " + it.note : "")) +
      "</div>" +
      btns +
      "</div>" +
      '<div class="ov-thumb ' +
      (it.tall ? "tall" : "wide") +
      '">' +
      (it.thumb ? '<img src="' + esc(it.thumb) + '" alt="">' : "") +
      "</div></div>"
    ov.hidden = false
    hideTip()
    document.getElementById("ovx").focus()
  }
  function closeOverlay() {
    ov.hidden = true
    ov.innerHTML = ""
    if (lastFocus) lastFocus.focus()
  }
  ov.addEventListener("click", (e) => {
    if (e.target === ov || e.target.closest("#ovx")) closeOverlay()
  })
  addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !ov.hidden) closeOverlay()
  })
  document.addEventListener("click", (e) => {
    const t = e.target.closest(".tile")
    if (t) openOverlay(items[+t.dataset.i])
  })

  // Hover: title in a floating tip.
  const tip = document.getElementById("tip")
  function showTip(el) {
    const it = items[+el.dataset.i]
    if (!it) return
    const when = it.planned
      ? "Planned" + (it.time ? " " + it.time : "")
      : it.time
        ? (it.scheduled ? "Scheduled " : "") + it.time
        : ""
    const sub = [when, it.note].filter(Boolean).join(" · ")
    tip.innerHTML =
      "<b>" +
      esc(it.title || it.label) +
      "</b>" +
      (sub ? "<span>" + esc(sub) + "</span>" : "")
    tip.hidden = false
    const r = el.getBoundingClientRect()
    const tw = tip.offsetWidth,
      th = tip.offsetHeight
    tip.style.left =
      Math.min(
        Math.max(8, r.left + r.width / 2 - tw / 2),
        innerWidth - tw - 8,
      ) + "px"
    let y = r.top - th - 8
    if (y < 8) y = r.bottom + 8
    tip.style.top = y + "px"
  }
  const hideTip = () => (tip.hidden = true)
  document.addEventListener("mouseover", (e) => {
    const t = e.target.closest(".tile")
    t && ov.hidden ? showTip(t) : hideTip()
  })
  addEventListener("scroll", hideTip, { passive: true })

  week = weekStart(now)
  renderFilters()
  render()
  document.getElementById("status").textContent = "Loading posts…"
  ;(async () => {
    const db = await window.claude?.use?.("db")
    const status = document.getElementById("status")
    if (!db) {
      status.textContent = "Open this page in Claude to see the posts."
      return
    }
    db.collection("posts").onSnapshot(
      (snap) => {
        posts = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
        build()
        status.textContent = posts.length
          ? ""
          : "No posts yet. The Calendar session adds them as they go live or get scheduled."
        render()
      },
      (err) => {
        status.textContent =
          "Could not load posts (" + err.code + "). Reload the page."
      },
    )
  })()
  // Scheduled tiles turn into posted ones once their time passes.
  setInterval(() => {
    build()
    render()
  }, 60000)
</script>
