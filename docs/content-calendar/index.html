<title>Daily Bible Pause Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Inter:wght@400;500;600&display=swap"
/>
<style>
  /* Layout: a month wall of days, each day a stack of thumbnail tiles; agenda list at phone width. Dark only, by choice. */
  :root {
    --ground: #15100e; /* warm near-black, red bias */
    --cell: #1d1613;
    --cell-off: #181210;
    --line: #2f2420;
    --ink: #f6ece2;
    --muted: #9c8a7f;
    --flame: #e2583a; /* the Daily Bible Pause mark */
    --gold: #efd08a; /* today */
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --sans:
      "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color-scheme: dark;
  }
  html,
  body {
    background: var(--ground);
    color: var(--ink);
  }
  body {
    font-family: var(--sans);
    padding-inline: 16px;
    padding-block: 20px 40px;
  }
  .wrap {
    max-width: 1440px;
    margin: 0 auto;
    display: grid;
    gap: 18px;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 24px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mark {
    width: 34px;
    height: 34px;
    flex: none;
  }
  .month {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(26px, 3.4vw, 38px);
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1;
  }
  .month b {
    font-weight: 600;
  }
  .month span {
    color: var(--muted);
  }
  .nav {
    display: flex;
    gap: 6px;
  }
  .nav button,
  .chip {
    appearance: none;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    height: 34px;
    min-width: 34px;
    display: inline-grid;
    place-items: center;
    cursor: pointer;
    font: 500 13px var(--sans);
    padding: 0 10px;
  }
  .nav button:hover,
  .chip:hover {
    border-color: var(--muted);
  }
  button:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .spacer {
    flex: 1;
  }
  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip {
    gap: 6px;
    padding: 0 10px 0 8px;
  }
  .chip[aria-pressed="false"] {
    opacity: 0.35;
  }
  .chip svg {
    width: 18px;
    height: 18px;
  }
  .tally {
    display: flex;
    gap: 14px;
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .tally i {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: 1px;
  }
  .dot-pub {
    background: var(--ink);
  }
  .dot-sch {
    border: 1.5px dashed var(--flame);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .dow {
    background: var(--ground);
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 8px 10px;
  }
  .day {
    background: var(--cell);
    min-height: 132px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .day.off {
    background: var(--cell-off);
  }
  .day.off .num {
    opacity: 0.35;
  }
  .num {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .day.today .num b {
    background: var(--gold);
    color: var(--ground);
    border-radius: 999px;
    padding: 1px 7px;
  }
  .day.past .tile {
    filter: saturate(0.8);
  }

  .tile {
    position: relative;
    display: block;
    border-radius: 6px;
    overflow: hidden;
    aspect-ratio: 16 / 10;
    max-width: 100%;
    background: #000;
    color: var(--ink);
    text-decoration: none;
    isolation: isolate;
    transition: transform 0.15s ease;
  }
  .tile:hover {
    transform: translateY(-1px);
  }
  .tile img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    z-index: -2;
  }
  .tile::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.45) 0%,
      rgba(0, 0, 0, 0) 34%,
      rgba(0, 0, 0, 0) 40%,
      rgba(0, 0, 0, 0.88) 100%
    );
  }
  .tile.scheduled {
    outline: 1.5px dashed var(--flame);
    outline-offset: -1.5px;
  }
  .tile .time {
    position: absolute;
    top: 5px;
    left: 6px;
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    gap: 4px;
    text-shadow: 0 1px 2px #000;
  }
  .tile.scheduled .time::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1.5px solid var(--flame);
  }
  .tile .plats {
    position: absolute;
    top: 4px;
    right: 4px;
    display: flex;
    gap: 3px;
  }
  .plat {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.55);
    display: grid;
    place-items: center;
    position: relative;
  }
  .plat svg {
    width: 13px;
    height: 13px;
  }
  .plat .lang {
    position: absolute;
    bottom: -4px;
    right: -4px;
    font: 700 7px/1 var(--sans);
    background: var(--ink);
    color: var(--ground);
    border-radius: 3px;
    padding: 1px 2px;
    letter-spacing: 0.02em;
  }
  .tile .ttl {
    position: absolute;
    left: 6px;
    right: 6px;
    bottom: 5px;
    font-family: var(--serif);
    font-size: 12px;
    line-height: 1.2;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-shadow: 0 1px 3px #000;
  }
  .tile .paid {
    position: absolute;
    bottom: 5px;
    right: 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
  }
  .tile.noimg {
    background: linear-gradient(135deg, #3a1d16, #1d1613);
  }

  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 28px 0;
    text-align: center;
  }
  .status {
    color: var(--muted);
    font-size: 12px;
    min-height: 1em;
  }

  /* Agenda at phone width */
  .agenda {
    display: none;
    gap: 14px;
  }
  .agenda .aday {
    display: grid;
    gap: 8px;
  }
  .agenda h3 {
    margin: 0;
    font: 600 12px var(--sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .agenda h3.today {
    color: var(--gold);
  }
  .agenda .row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  @media (max-width: 760px) {
    .grid {
      display: none;
    }
    .agenda {
      display: grid;
    }
    .tile .ttl {
      font-size: 13px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile {
      transition: none;
    }
    .tile:hover {
      transform: none;
    }
  }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <svg
        class="mark"
        viewBox="0 0 100 100"
        aria-label="Daily Bible Pause"
        role="img"
      >
        <circle cx="50" cy="50" r="50" fill="#e2583a" />
        <path
          d="M27 30 L42 33 L42 67 L27 70 Z M73 30 L58 33 L58 67 L73 70 Z"
          fill="none"
          stroke="#fff6f0"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </svg>
      <h1 class="month" id="month"></h1>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Previous month">‹</button>
      <button id="todayBtn" aria-label="This month">•</button>
      <button id="next" aria-label="Next month">›</button>
    </div>
    <div class="spacer"></div>
    <div class="tally" id="tally"></div>
    <div class="filters" id="filters"></div>
  </header>
  <div class="grid" id="grid"></div>
  <div class="agenda" id="agenda"></div>
  <div class="status" id="status"></div>
</div>

<script>
  const ICON = {
    yt: '<svg viewBox="0 0 24 24"><rect x="1.5" y="5" width="21" height="14" rx="4" fill="#ff0033"/><path d="M10 9v6l5.2-3z" fill="#fff"/></svg>',
    shorts:
      '<svg viewBox="0 0 24 24"><path d="M15.6 2.6c1.9-1 4.2-.3 5.2 1.6 1 1.9.3 4.2-1.6 5.2l-1.6.9c1.4.1 2.7.9 3.3 2.2 1 1.9.3 4.2-1.6 5.2l-7.9 4.2c-1.9 1-4.2.3-5.2-1.6-1-1.9-.3-4.2 1.6-5.2l1.6-.9c-1.4-.1-2.7-.9-3.3-2.2-1-1.9-.3-4.2 1.6-5.2z" fill="#ff0033"/><path d="M10 9v6l5.2-3z" fill="#fff"/></svg>',
    fb: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#0866ff"/><path d="M13.3 23v-8.2h2.6l.4-3h-3v-1.9c0-.9.3-1.5 1.5-1.5h1.6V5.7c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.6v3h2.6V23z" fill="#fff"/></svg>',
    ig: '<svg viewBox="0 0 24 24"><defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".6" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="url(#igg)"/><rect x="6" y="6" width="12" height="12" rx="3.6" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.3" cy="7.7" r="1" fill="#fff"/></svg>',
  }
  // Filter channels. A post's platforms are any of: yt-en, yt-ru, fb, ig.
  const CHANNELS = [
    { key: "yt-en", icon: "yt", lang: "EN", label: "YouTube English" },
    { key: "yt-ru", icon: "yt", lang: "RU", label: "YouTube Russian" },
    { key: "fb", icon: "fb", label: "Facebook" },
    { key: "ig", icon: "ig", label: "Instagram" },
  ]
  const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
  const MONTHS = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December",
  ]

  const store = (k, v) => {
    try {
      if (v === undefined) return JSON.parse(localStorage.getItem(k))
      localStorage.setItem(k, JSON.stringify(v))
    } catch (e) {
      return null
    }
  }
  let posts = []
  let on = store("dbp-cal-filters") || {
    "yt-en": true,
    "yt-ru": true,
    fb: true,
    ig: true,
  }
  const now = new Date()
  let view = { y: now.getFullYear(), m: now.getMonth() }
  const pad = (n) => String(n).padStart(2, "0")
  const ymd = (d) =>
    d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
  const todayKey = ymd(now)
  const esc = (s) =>
    String(s ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    )

  function platIcons(p) {
    return (p.platforms || [])
      .map((k) => {
        const ch = CHANNELS.find((c) => c.key === k)
        if (!ch) return ""
        const icon =
          ch.icon === "yt" && p.kind === "short" ? ICON.shorts : ICON[ch.icon]
        return (
          '<span class="plat" title="' +
          ch.label +
          '">' +
          icon +
          (k === "yt-ru" ? '<span class="lang">RU</span>' : "") +
          "</span>"
        )
      })
      .join("")
  }
  function isScheduled(p) {
    if (p.status !== "scheduled") return false
    const t = new Date(p.date + "T" + (p.time || "23:59"))
    return t > new Date()
  }
  function tile(p) {
    const sch = isScheduled(p)
    const short = String(p.title || "")
      .split("|")[0]
      .trim()
    const img = p.thumb
      ? '<img src="' + esc(p.thumb) + '" alt="" loading="lazy">'
      : ""
    const tag = p.link ? "a" : "div"
    const href = p.link
      ? ' href="' + esc(p.link) + '" target="_blank" rel="noopener"'
      : ""
    return (
      "<" +
      tag +
      href +
      ' class="tile' +
      (sch ? " scheduled" : "") +
      (p.thumb ? "" : " noimg") +
      '" title="' +
      esc(p.title) +
      '">' +
      img +
      (p.time
        ? '<span class="time">' + esc(p.time) + "</span>"
        : sch
          ? '<span class="time"></span>'
          : "") +
      '<span class="plats">' +
      platIcons(p) +
      "</span>" +
      '<span class="ttl">' +
      esc(short) +
      "</span>" +
      (p.paid ? '<span class="paid" title="Paid ad"></span>' : "") +
      "</" +
      tag +
      ">"
    )
  }
  function visible(p) {
    return (p.platforms || []).some((k) => on[k])
  }
  function byTime(a, b) {
    return (a.time || "99").localeCompare(b.time || "99")
  }

  function render() {
    document.getElementById("month").innerHTML =
      "<b>" + MONTHS[view.m] + "</b> <span>" + view.y + "</span>"
    const first = new Date(view.y, view.m, 1)
    const start = new Date(first)
    start.setDate(1 - ((first.getDay() + 6) % 7))
    const last = new Date(view.y, view.m + 1, 0)
    const end = new Date(last)
    end.setDate(last.getDate() + (6 - ((last.getDay() + 6) % 7)))
    const byDay = {}
    posts.filter(visible).forEach((p) => {
      ;(byDay[p.date] = byDay[p.date] || []).push(p)
    })
    Object.values(byDay).forEach((a) => a.sort(byTime))

    let html = DOW.map((d) => '<div class="dow">' + d + "</div>").join("")
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const k = ymd(d)
      const cls = [
        "day",
        d.getMonth() !== view.m ? "off" : "",
        k === todayKey ? "today" : "",
        k < todayKey ? "past" : "",
      ].join(" ")
      html +=
        '<div class="' +
        cls +
        '"><div class="num"><b>' +
        d.getDate() +
        "</b></div>" +
        (byDay[k] || []).map(tile).join("") +
        "</div>"
    }
    document.getElementById("grid").innerHTML = html

    const monthKey = view.y + "-" + pad(view.m + 1)
    const days = Object.keys(byDay)
      .filter((k) => k.startsWith(monthKey))
      .sort()
    document.getElementById("agenda").innerHTML = days.length
      ? days
          .map((k) => {
            const d = new Date(k + "T12:00")
            return (
              '<section class="aday"><h3 class="' +
              (k === todayKey ? "today" : "") +
              '">' +
              DOW[(d.getDay() + 6) % 7] +
              " " +
              d.getDate() +
              '</h3><div class="row">' +
              byDay[k].map(tile).join("") +
              "</div></section>"
            )
          })
          .join("")
      : '<div class="empty">Nothing this month yet.</div>'

    const inMonth = posts.filter(
      (p) => visible(p) && p.date && p.date.startsWith(monthKey),
    )
    const sch = inMonth.filter(isScheduled).length
    document.getElementById("tally").innerHTML =
      '<span title="Posted"><i class="dot-pub"></i>' +
      (inMonth.length - sch) +
      "</span>" +
      '<span title="Scheduled"><i class="dot-sch"></i>' +
      sch +
      "</span>"
  }

  function renderFilters() {
    document.getElementById("filters").innerHTML = CHANNELS.map(
      (c) =>
        '<button class="chip" data-k="' +
        c.key +
        '" aria-pressed="' +
        !!on[c.key] +
        '" aria-label="' +
        c.label +
        '" title="' +
        c.label +
        '">' +
        ICON[c.icon] +
        (c.lang ? "<span>" + c.lang + "</span>" : "") +
        "</button>",
    ).join("")
  }
  document.getElementById("filters").addEventListener("click", (e) => {
    const b = e.target.closest(".chip")
    if (!b) return
    on[b.dataset.k] = !on[b.dataset.k]
    store("dbp-cal-filters", on)
    renderFilters()
    render()
  })
  document.getElementById("prev").onclick = () => {
    view.m--
    if (view.m < 0) {
      view.m = 11
      view.y--
    }
    render()
  }
  document.getElementById("next").onclick = () => {
    view.m++
    if (view.m > 11) {
      view.m = 0
      view.y++
    }
    render()
  }
  document.getElementById("todayBtn").onclick = () => {
    view = { y: now.getFullYear(), m: now.getMonth() }
    render()
  }

  renderFilters()
  render()
  document.getElementById("status").textContent = "Loading posts…"

  ;(async () => {
    const db = await window.claude?.use?.("db")
    const status = document.getElementById("status")
    if (!db) {
      status.textContent = "Open this page in Claude to see the posts."
      return
    }
    db.collection("posts").onSnapshot(
      (snap) => {
        posts = snap.docs
          .map((d) => ({ id: d.id, ...d.data() }))
          .filter((p) => p.date)
        status.textContent = posts.length
          ? ""
          : "No posts yet. A Claude session adds them as they go live or get scheduled."
        render()
      },
      (err) => {
        status.textContent =
          "Could not load posts (" + err.code + "). Reload the page."
      },
    )
  })()
  // Re-check scheduled → posted once a minute.
  setInterval(render, 60000)
</script>
