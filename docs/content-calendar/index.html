<title>Daily Bible Pause Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,300;7..72,400&family=Inter:wght@400;500;600;700&display=swap"
/>
<style>
  /* Layout: a month wall of days. Per day: each long video on its own 16:9 row, then one strip of vertical posts.
     The same cut posted on several platforms the same day is ONE stacked tile with one icon per platform.
     Click any tile: an overlay with the big thumbnail and one button per platform. Dark only, by choice. */
  :root {
    --ground: #15100e;
    --cell: #1d1613;
    --cell-off: #181210;
    --line: #2f2420;
    --ink: #f6ece2;
    --muted: #9c8a7f;
    --hover: #2a201c;
    --flame: #e2583a;
    --gold: #efd08a;
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --sans:
      "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color-scheme: dark;
  }
  html,
  body {
    background: var(--ground);
    color: var(--ink);
  }
  body {
    font-family: var(--sans);
    padding-inline: 16px;
    padding-block: 20px 40px;
  }
  .wrap {
    max-width: 1440px;
    margin: 0 auto;
    display: grid;
    gap: 18px;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mark {
    width: 32px;
    height: 32px;
    flex: none;
  }
  .month {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(24px, 3vw, 34px);
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1;
  }
  .month span {
    color: var(--muted);
  }
  .spacer {
    flex: 1;
  }
  .ghost {
    appearance: none;
    background: transparent;
    border: 0;
    color: var(--muted);
    border-radius: 8px;
    height: 34px;
    min-width: 34px;
    display: inline-grid;
    place-items: center;
    cursor: pointer;
    font: 500 18px/1 var(--sans);
    padding: 0 6px;
    position: relative;
  }
  .ghost:hover {
    background: var(--hover);
    color: var(--ink);
  }
  button:focus-visible,
  a:focus-visible,
  .tile:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .nav {
    display: flex;
    gap: 2px;
  }

  /* Filters: click one platform to see only its posts; click it again (or "All") to see everything. */
  .filters {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .fchip {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    border-radius: 999px;
    height: 34px;
    padding: 0 12px 0 8px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    font: 500 13px/1 var(--sans);
  }
  .fchip:hover {
    background: var(--hover);
  }
  .fchip svg {
    width: 18px;
    height: 18px;
    flex: none;
  }
  .fchip[aria-pressed="true"] {
    background: var(--ink);
    color: var(--ground);
    border-color: var(--ink);
  }
  .fchip.all {
    padding: 0 12px;
  }
  .fchip .ru {
    font: 700 9px/1 var(--sans);
    background: var(--flame);
    color: #fff;
    border-radius: 3px;
    padding: 2px 3px;
    margin-left: -3px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .dow {
    background: var(--ground);
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 8px 10px;
  }
  .day {
    background: var(--cell);
    min-height: 120px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .day.off {
    background: var(--cell-off);
  }
  .day.off .num {
    opacity: 0.35;
  }
  .num {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .day.today .num b {
    background: var(--gold);
    color: var(--ground);
    border-radius: 999px;
    padding: 1px 7px;
  }

  /* Tiles */
  .tile {
    position: relative;
    display: block;
    border-radius: 6px;
    background: #000;
    max-width: 100%;
    cursor: pointer;
    transition: transform 0.15s ease;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6);
    appearance: none;
    border: 0;
    padding: 0;
  }
  .tile .face {
    position: absolute;
    inset: 0;
    border-radius: 6px;
    overflow: hidden;
    background: #000;
  }
  .tile.wide {
    aspect-ratio: 16 / 9;
    width: 100%;
  }
  .tile.tall {
    aspect-ratio: 9 / 16;
    flex: 0 0 46%;
  }
  .tile img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .tile.noimg .face {
    background: linear-gradient(135deg, #3a1d16, #1d1613);
  }
  /* Scheduled: real, queued on the platform. Dimmed picture, orange dashed frame, orange clock. */
  .tile.scheduled img {
    opacity: 0.6;
  }
  .tile.scheduled .face::after,
  .tile.planned .face::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 6px;
    border: 2px dashed var(--flame);
  }
  /* Planned: only in the plan, not uploaded yet. No picture, muted dashed frame, story and cut written in. */
  .tile.planned .face {
    background: repeating-linear-gradient(
      135deg,
      #1f1714 0 6px,
      #241b17 6px 12px
    );
  }
  .tile.planned .face::after {
    border: 1.5px dashed var(--muted);
    opacity: 0.6;
  }
  .tile.planned img {
    opacity: 0.25;
  }
  .plabel {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 3px;
    text-align: center;
    padding: 4px;
    color: var(--muted);
  }
  .plabel b {
    font: 400 15px/1.1 var(--serif);
    color: var(--ink);
  }
  .plabel i {
    font: 600 8px/1 var(--sans);
    font-style: normal;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  /* Stack: the same video on 2+ platforms gets cards fanned out behind it. */
  .tile.stack::before,
  .tile.stack::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 6px;
    background: #3a2c26;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6);
  }
  .tile.stack::before {
    transform: translate(5px, -5px);
    opacity: 0.55;
  }
  .tile.stack::after {
    transform: translate(2.5px, -2.5px);
    opacity: 0.85;
  }
  .tile.stack.three::before {
    transform: translate(6px, -6px);
  }
  .tile .face {
    z-index: 1;
  }
  .plats {
    position: absolute;
    z-index: 2;
    top: 4px;
    left: 4px;
    display: flex;
    gap: 3px;
  }
  .badge {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    background: rgba(0, 0, 0, 0.6);
    display: grid;
    place-items: center;
    position: relative;
  }
  .badge svg {
    width: 14px;
    height: 14px;
  }
  .badge .ru {
    position: absolute;
    right: -4px;
    bottom: -4px;
    font: 700 7px/1 var(--sans);
    background: var(--flame);
    color: #fff;
    border-radius: 2px;
    padding: 1px 2px;
  }
  .tile .clock {
    position: absolute;
    z-index: 2;
    top: 4px;
    right: 4px;
    width: 18px;
    height: 18px;
    color: #fff;
    filter: drop-shadow(0 1px 2px #000);
  }
  .tile .dur {
    position: absolute;
    z-index: 2;
    right: 4px;
    bottom: 4px;
    font: 600 10px/1 var(--sans);
    font-variant-numeric: tabular-nums;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    border-radius: 3px;
    padding: 2px 3px;
  }
  .tile .paid {
    position: absolute;
    z-index: 2;
    left: 5px;
    bottom: 5px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.6);
  }
  .tile:hover {
    transform: translateY(-2px) scale(1.04);
    z-index: 5;
  }

  .strip {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 10px 8%;
    padding-top: 6px;
  }

  #tip {
    position: fixed;
    z-index: 50;
    max-width: 260px;
    background: #0b0807;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    font: 400 12px/1.35 var(--sans);
    pointer-events: none;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
  }
  #tip b {
    display: block;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 13px;
    margin-bottom: 2px;
  }
  #tip span {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Overlay */
  #ov {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(8, 5, 4, 0.82);
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  .ov-card {
    display: flex;
    gap: 22px;
    align-items: center;
    max-width: 100%;
  }
  .ov-side {
    display: grid;
    gap: 10px;
    width: 230px;
    min-width: 0;
  }
  .ov-side h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 18px;
    line-height: 1.3;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .ov-meta {
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
  }
  .pbtn {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 14px;
    border-radius: 10px;
    background: #261d19;
    border: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    font: 600 14px/1 var(--sans);
  }
  .pbtn svg {
    width: 22px;
    height: 22px;
    flex: none;
  }
  .pbtn small {
    margin-left: auto;
    color: var(--muted);
    font-weight: 500;
    font-size: 11px;
  }
  a.pbtn:hover {
    background: #33261f;
    border-color: var(--muted);
  }
  .pbtn.off {
    opacity: 0.45;
    cursor: default;
  }
  .ov-thumb {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
    flex: none;
  }
  .ov-thumb.tall {
    height: min(78vh, 640px);
    aspect-ratio: 9 / 16;
  }
  .ov-thumb.wide {
    width: min(62vw, 760px);
    aspect-ratio: 16 / 9;
  }
  .ov-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .ov-x {
    position: absolute;
    top: 14px;
    right: 16px;
  }
  @media (max-width: 760px) {
    .ov-card {
      flex-direction: column-reverse;
      gap: 14px;
    }
    .ov-side {
      width: min(320px, 100%);
    }
    .ov-thumb.tall {
      height: 52vh;
    }
    .ov-thumb.wide {
      width: min(92vw, 520px);
    }
  }

  .status {
    color: var(--muted);
    font-size: 12px;
    min-height: 1em;
  }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 28px 0;
    text-align: center;
  }

  .agenda {
    display: none;
    gap: 16px;
  }
  .agenda .aday {
    display: grid;
    gap: 8px;
  }
  .agenda h3 {
    margin: 0;
    font: 600 12px var(--sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .agenda h3.today {
    color: var(--gold);
  }
  .agenda .stack-list {
    display: grid;
    gap: 8px;
    max-width: 360px;
  }
  @media (max-width: 760px) {
    .grid {
      display: none;
    }
    .agenda {
      display: grid;
    }
    .filters .lbl {
      display: none;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile {
      transition: none;
    }
    .tile:hover {
      transform: none;
    }
  }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <svg
        class="mark"
        viewBox="0 0 100 100"
        aria-label="Daily Bible Pause"
        role="img"
      >
        <circle cx="50" cy="50" r="50" fill="#e2583a" />
        <path
          d="M27 30 L42 33 L42 67 L27 70 Z M73 30 L58 33 L58 67 L73 70 Z"
          fill="none"
          stroke="#fff6f0"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </svg>
      <h1 class="month" id="month"></h1>
    </div>
    <div class="nav">
      <button class="ghost" id="prev" aria-label="Previous month">‹</button>
      <button class="ghost" id="todayBtn" aria-label="This month">•</button>
      <button class="ghost" id="next" aria-label="Next month">›</button>
    </div>
    <div class="spacer"></div>
    <div
      class="filters"
      id="filters"
      role="group"
      aria-label="Show only one platform"
    ></div>
  </header>
  <div class="grid" id="grid"></div>
  <div class="agenda" id="agenda"></div>
  <div class="status" id="status"></div>
</div>
<div id="tip" hidden></div>
<div id="ov" hidden role="dialog" aria-modal="true" aria-label="Post"></div>

<script>
  const ICON = {
    yt: '<svg viewBox="0 0 24 24"><rect x="1" y="4.5" width="22" height="15" rx="4.5" fill="#ff0033"/><path d="M9.8 8.6v6.8l5.9-3.4z" fill="#fff"/></svg>',
    fb: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#0866ff"/><path d="M13.3 23v-8.2h2.6l.4-3h-3v-1.9c0-.9.3-1.5 1.5-1.5h1.6V5.7c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.6v3h2.6V23z" fill="#fff"/></svg>',
    ig: '<svg viewBox="0 0 24 24"><defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".6" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="url(#igg)"/><rect x="6" y="6" width="12" height="12" rx="3.6" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.3" cy="7.7" r="1" fill="#fff"/></svg>',
    clock:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10" fill="#e2583a" stroke="none"/><path d="M12 7v5l3 2"/></svg>',
  }
  // A post's platforms: any of yt-en, yt-ru, fb, ig. Shown in this order.
  const PLATS = [
    { key: "yt-en", icon: "yt", label: "YouTube" },
    { key: "yt-ru", icon: "yt", ru: true, label: "YouTube RU" },
    { key: "fb", icon: "fb", label: "Facebook" },
    { key: "ig", icon: "ig", label: "Instagram" },
  ]
  const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
  const MONTHS = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December",
  ]

  const store = (k, v) => {
    try {
      if (v === undefined) return JSON.parse(localStorage.getItem(k))
      localStorage.setItem(k, JSON.stringify(v))
    } catch (e) {
      return null
    }
  }
  let posts = []
  let items = [] // grouped tiles
  let only = store("dbp-cal-only") || null // null = all platforms
  const now = new Date()
  let view = { y: now.getFullYear(), m: now.getMonth() }
  const pad = (n) => String(n).padStart(2, "0")
  const ymd = (d) =>
    d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
  const todayKey = ymd(now)
  const esc = (s) =>
    String(s ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    )

  const isTall = (p) => p.kind !== "long"
  function isFuture(p) {
    return (
      p.status === "scheduled" &&
      new Date(p.date + "T" + (p.time || "23:59")) > new Date()
    )
  }
  const isPlanned = (p) => p.status === "planned"
  // "martha-short-history-yt-en" and "martha-reel-history-meta" are the same cut: key "martha|history".
  function cutKey(p) {
    if (p.group) return p.group
    const id = String(p.id || "").replace(/-(yt-en|yt-ru|meta|fb|ig)$/, "")
    const m = id.match(/^(.*?)-(short|reel|post|story)-(.+)$/)
    return m ? m[1] + "|" + m[3] : id
  }
  // The URL for one platform of one row: links[k] first, else `link` when it belongs to that platform.
  function urlFor(p, k) {
    if (p.links && p.links[k]) return p.links[k]
    if (!p.link) return ""
    const host = p.link
    if (k === "fb") return /facebook\.com/.test(host) ? host : ""
    if (k === "ig") return /instagram\.com/.test(host) ? host : ""
    if (k === "yt-en" || k === "yt-ru") return /youtu/.test(host) ? host : ""
    return ""
  }

  // Merge rows into tiles: same day + same cut + vertical + no shared platform = one stacked tile.
  function build() {
    const live = posts.filter((p) => p.date && !p.campaign)
    const out = []
    const byKey = {}
    live.forEach((p) => {
      if (!isTall(p)) {
        out.push({ members: [p] })
        return
      }
      const key = p.date + "|" + cutKey(p)
      const g = byKey[key]
      const pl = p.platforms || []
      if (g && !pl.some((k) => g.platforms.has(k))) {
        g.members.push(p)
        pl.forEach((k) => g.platforms.add(k))
      } else {
        const ng = { members: [p], platforms: new Set(pl) }
        byKey[key] = ng
        out.push(ng)
      }
    })
    items = out.map((g) => {
      const ms = g.members
      const yt = ms.find((p) =>
        (p.platforms || []).some((k) => k.startsWith("yt")),
      )
      const lead = yt || ms[0]
      const platforms = PLATS.map((x) => x.key).filter((k) =>
        ms.some((p) => (p.platforms || []).includes(k)),
      )
      const links = {}
      platforms.forEach((k) => {
        const m = ms.find((p) => (p.platforms || []).includes(k))
        links[k] = {
          url: urlFor(m, k),
          scheduled: isFuture(m),
          planned: isPlanned(m),
          time: m.time || "",
        }
      })
      const times = ms
        .map((p) => p.time)
        .filter(Boolean)
        .sort()
      return {
        date: lead.date,
        time: times[0] || "",
        kind: lead.kind,
        tall: isTall(lead),
        title: lead.title,
        thumb: lead.thumb || (ms.find((p) => p.thumb) || {}).thumb || "",
        duration:
          lead.duration || (ms.find((p) => p.duration) || {}).duration || "",
        paid: ms.some((p) => p.paid),
        scheduled: ms.every(isFuture),
        planned: ms.every(isPlanned),
        story: lead.story || "",
        cut: lead.cut || (lead.kind === "long" ? "long form" : ""),
        platforms,
        links,
      }
    })
  }

  function badges(it) {
    return (
      '<span class="plats">' +
      it.platforms
        .map((k) => {
          const d = PLATS.find((x) => x.key === k)
          return (
            '<span class="badge" title="' +
            d.label +
            '">' +
            ICON[d.icon] +
            (d.ru ? '<span class="ru">RU</span>' : "") +
            "</span>"
          )
        })
        .join("") +
      "</span>"
    )
  }
  function tile(it) {
    const i = items.indexOf(it)
    const n = it.platforms.length
    const cls = [
      "tile",
      it.tall ? "tall" : "wide",
      n > 1 ? "stack" : "",
      n > 2 ? "three" : "",
      it.scheduled ? "scheduled" : "",
      it.planned ? "planned" : "",
      it.thumb ? "" : "noimg",
    ].join(" ")
    return (
      '<button type="button" data-i="' +
      i +
      '" class="' +
      cls +
      '" aria-label="' +
      esc(it.title) +
      '">' +
      '<span class="face">' +
      (it.thumb
        ? '<img src="' + esc(it.thumb) + '" alt="" loading="lazy">'
        : "") +
      (it.planned
        ? '<span class="plabel"><b>' +
          esc(it.story) +
          "</b><i>" +
          esc(it.cut) +
          "</i></span>"
        : "") +
      "</span>" +
      badges(it) +
      (it.scheduled ? '<span class="clock">' + ICON.clock + "</span>" : "") +
      (it.duration ? '<span class="dur">' + esc(it.duration) + "</span>" : "") +
      (it.paid ? '<span class="paid" title="Promoted"></span>' : "") +
      "</button>"
    )
  }
  function dayContent(list) {
    const byTime = (a, b) => (a.time || "99").localeCompare(b.time || "99")
    const longs = list.filter((it) => !it.tall).sort(byTime)
    const talls = list.filter((it) => it.tall).sort(byTime)
    return (
      longs.map(tile).join("") +
      (talls.length
        ? '<div class="strip">' + talls.map(tile).join("") + "</div>"
        : "")
    )
  }
  const visible = (it) => !only || it.platforms.includes(only)

  function render() {
    document.getElementById("month").innerHTML =
      MONTHS[view.m] + " <span>" + view.y + "</span>"
    const first = new Date(view.y, view.m, 1)
    const start = new Date(first)
    start.setDate(1 - ((first.getDay() + 6) % 7))
    const last = new Date(view.y, view.m + 1, 0)
    const end = new Date(last)
    end.setDate(last.getDate() + (6 - ((last.getDay() + 6) % 7)))
    const byDay = {}
    items
      .filter(visible)
      .forEach((it) => (byDay[it.date] = byDay[it.date] || []).push(it))

    let html = DOW.map((d) => '<div class="dow">' + d + "</div>").join("")
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const k = ymd(d)
      const cls = [
        "day",
        d.getMonth() !== view.m ? "off" : "",
        k === todayKey ? "today" : "",
      ].join(" ")
      html +=
        '<div class="' +
        cls +
        '"><div class="num"><b>' +
        d.getDate() +
        "</b></div>" +
        (byDay[k] ? dayContent(byDay[k]) : "") +
        "</div>"
    }
    document.getElementById("grid").innerHTML = html

    const monthKey = view.y + "-" + pad(view.m + 1)
    const days = Object.keys(byDay)
      .filter((k) => k.startsWith(monthKey))
      .sort()
    document.getElementById("agenda").innerHTML = days.length
      ? days
          .map((k) => {
            const d = new Date(k + "T12:00")
            return (
              '<section class="aday"><h3 class="' +
              (k === todayKey ? "today" : "") +
              '">' +
              DOW[(d.getDay() + 6) % 7] +
              " " +
              d.getDate() +
              '</h3><div class="stack-list">' +
              dayContent(byDay[k]) +
              "</div></section>"
            )
          })
          .join("")
      : '<div class="empty">Nothing this month yet.</div>'
  }

  function renderFilters() {
    document.getElementById("filters").innerHTML =
      '<button class="fchip all" data-k="" aria-pressed="' +
      !only +
      '">All</button>' +
      PLATS.map(
        (c) =>
          '<button class="fchip" data-k="' +
          c.key +
          '" aria-pressed="' +
          (only === c.key) +
          '" title="Show only ' +
          c.label +
          '">' +
          ICON[c.icon] +
          (c.ru ? '<span class="ru">RU</span>' : "") +
          '<span class="lbl">' +
          c.label.replace(" RU", "") +
          "</span></button>",
      ).join("")
  }
  document.getElementById("filters").addEventListener("click", (e) => {
    const b = e.target.closest(".fchip")
    if (!b) return
    const k = b.dataset.k || null
    only = only === k ? null : k
    store("dbp-cal-only", only)
    renderFilters()
    render()
  })
  document.getElementById("prev").onclick = () => {
    view.m--
    if (view.m < 0) {
      view.m = 11
      view.y--
    }
    render()
  }
  document.getElementById("next").onclick = () => {
    view.m++
    if (view.m > 11) {
      view.m = 0
      view.y++
    }
    render()
  }
  document.getElementById("todayBtn").onclick = () => {
    view = { y: now.getFullYear(), m: now.getMonth() }
    render()
  }

  // Overlay: big thumbnail + one button per platform, each with its own link.
  const ov = document.getElementById("ov")
  let lastFocus = null
  function openOverlay(it) {
    lastFocus = document.activeElement
    const d = new Date(it.date + "T12:00")
    const when =
      DOW[(d.getDay() + 6) % 7] +
      " " +
      d.getDate() +
      " " +
      MONTHS[d.getMonth()] +
      (it.time ? ", " + it.time : "") +
      (it.duration ? " · " + it.duration : "")
    const btns = it.platforms
      .map((k) => {
        const p = PLATS.find((x) => x.key === k)
        const l = it.links[k] || {}
        const label =
          k === "yt-en" || k === "yt-ru"
            ? (it.kind === "short" ? "YouTube Shorts" : "YouTube") +
              (p.ru ? " RU" : "")
            : p.label
        const note = l.planned
          ? "Planned " + (l.time || "")
          : l.scheduled
            ? "Scheduled " + (l.time || "") + (l.url ? " ↗" : "")
            : l.url
              ? "Open ↗"
              : "No link yet"
        return l.url
          ? '<a class="pbtn" href="' +
              esc(l.url) +
              '" target="_blank" rel="noopener">' +
              ICON[p.icon] +
              label +
              "<small>" +
              note +
              "</small></a>"
          : '<span class="pbtn off">' +
              ICON[p.icon] +
              label +
              "<small>" +
              esc(note) +
              "</small></span>"
      })
      .join("")
    ov.innerHTML =
      '<button class="ghost ov-x" id="ovx" aria-label="Close">✕</button><div class="ov-card">' +
      '<div class="ov-side"><h2>' +
      esc(it.title) +
      '</h2><div class="ov-meta">' +
      esc(when) +
      "</div>" +
      btns +
      "</div>" +
      '<div class="ov-thumb ' +
      (it.tall ? "tall" : "wide") +
      '">' +
      (it.thumb ? '<img src="' + esc(it.thumb) + '" alt="">' : "") +
      "</div></div>"
    ov.hidden = false
    hideTip()
    document.getElementById("ovx").focus()
  }
  function closeOverlay() {
    ov.hidden = true
    ov.innerHTML = ""
    if (lastFocus) lastFocus.focus()
  }
  ov.addEventListener("click", (e) => {
    if (e.target === ov || e.target.closest("#ovx")) closeOverlay()
  })
  addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !ov.hidden) closeOverlay()
  })
  document.addEventListener("click", (e) => {
    const t = e.target.closest(".tile")
    if (t) openOverlay(items[+t.dataset.i])
  })

  // Hover: title in a floating tip.
  const tip = document.getElementById("tip")
  function showTip(el) {
    const it = items[+el.dataset.i]
    if (!it) return
    const when = it.planned
      ? "Planned" + (it.time ? " " + it.time : "")
      : it.time
        ? (it.scheduled ? "Scheduled " : "") + it.time
        : ""
    tip.innerHTML =
      "<b>" +
      esc(it.title) +
      "</b>" +
      (when ? "<span>" + esc(when) + "</span>" : "")
    tip.hidden = false
    const r = el.getBoundingClientRect()
    const tw = tip.offsetWidth,
      th = tip.offsetHeight
    tip.style.left =
      Math.min(
        Math.max(8, r.left + r.width / 2 - tw / 2),
        innerWidth - tw - 8,
      ) + "px"
    let y = r.top - th - 8
    if (y < 8) y = r.bottom + 8
    tip.style.top = y + "px"
  }
  const hideTip = () => (tip.hidden = true)
  document.addEventListener("mouseover", (e) => {
    const t = e.target.closest(".tile")
    t && ov.hidden ? showTip(t) : hideTip()
  })
  addEventListener("scroll", hideTip, { passive: true })

  renderFilters()
  render()
  document.getElementById("status").textContent = "Loading posts…"
  ;(async () => {
    const db = await window.claude?.use?.("db")
    const status = document.getElementById("status")
    if (!db) {
      status.textContent = "Open this page in Claude to see the posts."
      return
    }
    db.collection("posts").onSnapshot(
      (snap) => {
        posts = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
        build()
        status.textContent = posts.length
          ? ""
          : "No posts yet. A Claude session adds them as they go live or get scheduled."
        render()
      },
      (err) => {
        status.textContent =
          "Could not load posts (" + err.code + "). Reload the page."
      },
    )
  })()
  // Scheduled tiles turn into posted ones once their time passes.
  setInterval(() => {
    build()
    render()
  }, 60000)
</script>
