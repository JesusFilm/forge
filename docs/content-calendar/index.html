<title>Daily Bible Pause Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,300;7..72,400&family=Inter:wght@400;500;600&display=swap"
/>
<style>
  /* Layout: a month wall of days. Per day: each long video on its own 16:9 row, then one row per channel of vertical shorts/reels (overlapping when more than two). Dark only, by choice. */
  :root {
    --ground: #15100e; /* warm near-black, red bias */
    --cell: #1d1613;
    --cell-off: #181210;
    --line: #2f2420;
    --ink: #f6ece2;
    --muted: #9c8a7f;
    --hover: #2a201c;
    --flame: #e2583a; /* the Daily Bible Pause mark */
    --gold: #efd08a; /* today */
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --sans:
      "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color-scheme: dark;
  }
  html,
  body {
    background: var(--ground);
    color: var(--ink);
  }
  body {
    font-family: var(--sans);
    padding-inline: 16px;
    padding-block: 20px 40px;
  }
  .wrap {
    max-width: 1440px;
    margin: 0 auto;
    display: grid;
    gap: 18px;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mark {
    width: 32px;
    height: 32px;
    flex: none;
  }
  .month {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(24px, 3vw, 34px);
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1;
  }
  .month span {
    color: var(--muted);
  }
  .spacer {
    flex: 1;
  }
  .ghost {
    appearance: none;
    background: transparent;
    border: 0;
    color: var(--muted);
    border-radius: 8px;
    height: 32px;
    min-width: 32px;
    display: inline-grid;
    place-items: center;
    cursor: pointer;
    font: 500 18px/1 var(--sans);
    padding: 0 6px;
    position: relative;
  }
  .ghost:hover {
    background: var(--hover);
    color: var(--ink);
  }
  button:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .nav,
  .filters {
    display: flex;
    gap: 2px;
  }
  .chip svg {
    width: 20px;
    height: 20px;
  }
  .chip[aria-pressed="false"] {
    opacity: 0.3;
  }
  .lang {
    position: absolute;
    right: 2px;
    bottom: 3px;
    font: 700 7px/1 var(--sans);
    letter-spacing: 0.03em;
    background: var(--ink);
    color: var(--ground);
    border-radius: 2px;
    padding: 1px 2px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .dow {
    background: var(--ground);
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 8px 10px;
  }
  .day {
    background: var(--cell);
    min-height: 120px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .day.off {
    background: var(--cell-off);
  }
  .day.off .num {
    opacity: 0.35;
  }
  .num {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .day.today .num b {
    background: var(--gold);
    color: var(--ground);
    border-radius: 999px;
    padding: 1px 7px;
  }

  /* Tiles: thumbnail only. */
  .tile {
    position: relative;
    display: block;
    border-radius: 5px;
    overflow: hidden;
    background: #000;
    max-width: 100%;
    transition:
      transform 0.15s ease,
      box-shadow 0.15s ease;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6);
  }
  .tile.wide {
    aspect-ratio: 16 / 9;
    width: 100%;
  }
  .tile.tall {
    aspect-ratio: 9 / 16;
    flex: 0 0 48%;
  }
  .tile img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .tile.noimg {
    background: linear-gradient(135deg, #3a1d16, #1d1613);
  }
  .tile.scheduled img {
    opacity: 0.4;
  }
  .tile.scheduled {
    background: #0d0a09;
  }
  .tile .plat {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.55);
    display: grid;
    place-items: center;
  }
  .tile .plat svg {
    width: 12px;
    height: 12px;
  }
  .tile .plat .lang {
    right: -3px;
    bottom: -3px;
    font-size: 6px;
  }
  .tile .clock {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 16px;
    height: 16px;
    color: var(--ink);
    filter: drop-shadow(0 1px 2px #000);
  }
  .tile .dur {
    position: absolute;
    right: 3px;
    bottom: 3px;
    font: 600 10px/1 var(--sans);
    font-variant-numeric: tabular-nums;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    border-radius: 3px;
    padding: 2px 3px;
  }
  .tile .paid {
    position: absolute;
    left: 4px;
    bottom: 4px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.6);
  }
  .tile:hover,
  .tile:focus-visible {
    transform: translateY(-2px) scale(1.04);
    z-index: 5;
    box-shadow:
      0 6px 18px rgba(0, 0, 0, 0.7),
      0 0 0 1px var(--muted);
  }
  .tile.scheduled:hover img {
    opacity: 0.75;
  }

  .strip {
    display: flex;
    align-items: flex-start;
  }
  .strip .tile + .tile {
    margin-left: var(--step, 4%);
  }

  #tip {
    position: fixed;
    z-index: 50;
    max-width: 260px;
    background: #0b0807;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    font: 400 12px/1.35 var(--sans);
    pointer-events: none;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
  }
  #tip b {
    display: block;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 13px;
    margin-bottom: 2px;
  }
  #tip span {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .status {
    color: var(--muted);
    font-size: 12px;
    min-height: 1em;
  }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 28px 0;
    text-align: center;
  }

  /* Agenda at phone width */
  .agenda {
    display: none;
    gap: 16px;
  }
  .agenda .aday {
    display: grid;
    gap: 8px;
  }
  .agenda h3 {
    margin: 0;
    font: 600 12px var(--sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .agenda h3.today {
    color: var(--gold);
  }
  .agenda .stack {
    display: grid;
    gap: 8px;
    max-width: 360px;
  }
  @media (max-width: 760px) {
    .grid {
      display: none;
    }
    .agenda {
      display: grid;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile {
      transition: none;
    }
    .tile:hover {
      transform: none;
    }
  }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <svg
        class="mark"
        viewBox="0 0 100 100"
        aria-label="Daily Bible Pause"
        role="img"
      >
        <circle cx="50" cy="50" r="50" fill="#e2583a" />
        <path
          d="M27 30 L42 33 L42 67 L27 70 Z M73 30 L58 33 L58 67 L73 70 Z"
          fill="none"
          stroke="#fff6f0"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </svg>
      <h1 class="month" id="month"></h1>
    </div>
    <div class="nav">
      <button class="ghost" id="prev" aria-label="Previous month">‹</button>
      <button class="ghost" id="todayBtn" aria-label="This month">•</button>
      <button class="ghost" id="next" aria-label="Next month">›</button>
    </div>
    <div class="spacer"></div>
    <div class="filters" id="filters"></div>
  </header>
  <div class="grid" id="grid"></div>
  <div class="agenda" id="agenda"></div>
  <div class="status" id="status"></div>
</div>
<div id="tip" hidden></div>

<script>
  const ICON = {
    yt: '<svg viewBox="0 0 24 24"><rect x="1.5" y="5" width="21" height="14" rx="4" fill="#ff0033"/><path d="M10 9v6l5.2-3z" fill="#fff"/></svg>',
    shorts:
      '<svg viewBox="0 0 24 24"><path d="M15.6 2.6c1.9-1 4.2-.3 5.2 1.6 1 1.9.3 4.2-1.6 5.2l-1.6.9c1.4.1 2.7.9 3.3 2.2 1 1.9.3 4.2-1.6 5.2l-7.9 4.2c-1.9 1-4.2.3-5.2-1.6-1-1.9-.3-4.2 1.6-5.2l1.6-.9c-1.4-.1-2.7-.9-3.3-2.2-1-1.9-.3-4.2 1.6-5.2z" fill="#ff0033"/><path d="M10 9v6l5.2-3z" fill="#fff"/></svg>',
    fb: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#0866ff"/><path d="M13.3 23v-8.2h2.6l.4-3h-3v-1.9c0-.9.3-1.5 1.5-1.5h1.6V5.7c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.6v3h2.6V23z" fill="#fff"/></svg>',
    ig: '<svg viewBox="0 0 24 24"><defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".6" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="url(#igg)"/><rect x="6" y="6" width="12" height="12" rx="3.6" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.3" cy="7.7" r="1" fill="#fff"/></svg>',
    meta: '<svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="7" fill="#0866ff"/><rect x="11" y="5" width="12" height="14" rx="4" fill="#d62976"/><circle cx="17" cy="12" r="2.6" fill="none" stroke="#fff" stroke-width="1.6"/></svg>',
    clock:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9" fill="rgba(0,0,0,.55)"/><path d="M12 7v5l3 2"/></svg>',
  }
  // A post's platforms: any of yt-en, yt-ru, fb, ig.
  const CHANNELS = [
    { key: "yt-en", icon: "yt", lang: "EN", label: "YouTube English" },
    { key: "yt-ru", icon: "yt", lang: "RU", label: "YouTube Russian" },
    { key: "fb", icon: "fb", label: "Facebook" },
    { key: "ig", icon: "ig", label: "Instagram" },
  ]
  const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
  const MONTHS = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December",
  ]

  const store = (k, v) => {
    try {
      if (v === undefined) return JSON.parse(localStorage.getItem(k))
      localStorage.setItem(k, JSON.stringify(v))
    } catch (e) {
      return null
    }
  }
  let posts = []
  let on = store("dbp-cal-filters") || {
    "yt-en": true,
    "yt-ru": true,
    fb: true,
    ig: true,
  }
  const now = new Date()
  let view = { y: now.getFullYear(), m: now.getMonth() }
  const pad = (n) => String(n).padStart(2, "0")
  const ymd = (d) =>
    d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
  const todayKey = ymd(now)
  const esc = (s) =>
    String(s ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    )

  const isTall = (p) => p.kind !== "long"
  const channelOf = (p) => {
    const pl = p.platforms || []
    if (pl.includes("yt-en")) return "yt-en"
    if (pl.includes("yt-ru")) return "yt-ru"
    return pl.length > 1 ? "meta" : pl[0] || "other"
  }
  function isScheduled(p) {
    if (p.status !== "scheduled") return false
    return new Date(p.date + "T" + (p.time || "23:59")) > new Date()
  }
  // Meta reels often have no own link yet: open the same cut on YouTube.
  function linkOf(p) {
    if (p.link) return p.link
    const twin = posts.find((q) => q.link && q.thumb && q.thumb === p.thumb)
    return twin ? twin.link : ""
  }
  function platBadge(p) {
    const ch = channelOf(p)
    let icon =
      ch === "meta"
        ? ICON.meta
        : ch === "fb"
          ? ICON.fb
          : ch === "ig"
            ? ICON.ig
            : p.kind === "short"
              ? ICON.shorts
              : ICON.yt
    return (
      '<span class="plat">' +
      icon +
      (ch === "yt-ru" ? '<span class="lang">RU</span>' : "") +
      "</span>"
    )
  }
  function tile(p, i) {
    const sch = isScheduled(p)
    const href = linkOf(p)
    const tag = href ? "a" : "div"
    const attrs = href
      ? ' href="' + esc(href) + '" target="_blank" rel="noopener"'
      : ' tabindex="0"'
    return (
      "<" +
      tag +
      attrs +
      ' data-i="' +
      i +
      '" class="tile ' +
      (isTall(p) ? "tall" : "wide") +
      (sch ? " scheduled" : "") +
      (p.thumb ? "" : " noimg") +
      '" aria-label="' +
      esc(p.title) +
      '">' +
      (p.thumb
        ? '<img src="' + esc(p.thumb) + '" alt="" loading="lazy">'
        : "") +
      platBadge(p) +
      (sch ? '<span class="clock">' + ICON.clock + "</span>" : "") +
      (p.duration ? '<span class="dur">' + esc(p.duration) + "</span>" : "") +
      (p.paid ? '<span class="paid"></span>' : "") +
      "</" +
      tag +
      ">"
    )
  }
  function strip(list) {
    const n = list.length
    // Two fit side by side; more overlap so one channel never takes more than one row.
    const step =
      n > 2 ? "calc((100% - " + n + " * 48%) / " + (n - 1) + ")" : "4%"
    return (
      '<div class="strip" style="--step:' +
      step +
      '">' +
      list.map((p) => tile(p, posts.indexOf(p))).join("") +
      "</div>"
    )
  }
  const CH_ORDER = ["yt-en", "yt-ru", "meta", "fb", "ig", "other"]
  function dayContent(list) {
    const byTime = (a, b) => (a.time || "99").localeCompare(b.time || "99")
    const longs = list.filter((p) => !isTall(p)).sort(byTime)
    const groups = {}
    list
      .filter(isTall)
      .sort(byTime)
      .forEach((p) =>
        (groups[channelOf(p)] = groups[channelOf(p)] || []).push(p),
      )
    return (
      longs.map((p) => tile(p, posts.indexOf(p))).join("") +
      CH_ORDER.filter((k) => groups[k])
        .map((k) => strip(groups[k]))
        .join("")
    )
  }
  const visible = (p) => (p.platforms || []).some((k) => on[k])

  function render() {
    document.getElementById("month").innerHTML =
      MONTHS[view.m] + " <span>" + view.y + "</span>"
    const first = new Date(view.y, view.m, 1)
    const start = new Date(first)
    start.setDate(1 - ((first.getDay() + 6) % 7))
    const last = new Date(view.y, view.m + 1, 0)
    const end = new Date(last)
    end.setDate(last.getDate() + (6 - ((last.getDay() + 6) % 7)))
    const byDay = {}
    posts
      .filter(visible)
      .forEach((p) => (byDay[p.date] = byDay[p.date] || []).push(p))

    let html = DOW.map((d) => '<div class="dow">' + d + "</div>").join("")
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const k = ymd(d)
      const cls = [
        "day",
        d.getMonth() !== view.m ? "off" : "",
        k === todayKey ? "today" : "",
      ].join(" ")
      html +=
        '<div class="' +
        cls +
        '"><div class="num"><b>' +
        d.getDate() +
        "</b></div>" +
        (byDay[k] ? dayContent(byDay[k]) : "") +
        "</div>"
    }
    document.getElementById("grid").innerHTML = html

    const monthKey = view.y + "-" + pad(view.m + 1)
    const days = Object.keys(byDay)
      .filter((k) => k.startsWith(monthKey))
      .sort()
    document.getElementById("agenda").innerHTML = days.length
      ? days
          .map((k) => {
            const d = new Date(k + "T12:00")
            return (
              '<section class="aday"><h3 class="' +
              (k === todayKey ? "today" : "") +
              '">' +
              DOW[(d.getDay() + 6) % 7] +
              " " +
              d.getDate() +
              '</h3><div class="stack">' +
              dayContent(byDay[k]) +
              "</div></section>"
            )
          })
          .join("")
      : '<div class="empty">Nothing this month yet.</div>'
  }

  function renderFilters() {
    document.getElementById("filters").innerHTML = CHANNELS.map(
      (c) =>
        '<button class="ghost chip" data-k="' +
        c.key +
        '" aria-pressed="' +
        !!on[c.key] +
        '" aria-label="' +
        c.label +
        '" title="' +
        c.label +
        '">' +
        ICON[c.icon] +
        (c.lang ? '<span class="lang">' + c.lang + "</span>" : "") +
        "</button>",
    ).join("")
  }
  document.getElementById("filters").addEventListener("click", (e) => {
    const b = e.target.closest(".chip")
    if (!b) return
    on[b.dataset.k] = !on[b.dataset.k]
    store("dbp-cal-filters", on)
    renderFilters()
    render()
  })
  document.getElementById("prev").onclick = () => {
    view.m--
    if (view.m < 0) {
      view.m = 11
      view.y--
    }
    render()
  }
  document.getElementById("next").onclick = () => {
    view.m++
    if (view.m > 11) {
      view.m = 0
      view.y++
    }
    render()
  }
  document.getElementById("todayBtn").onclick = () => {
    view = { y: now.getFullYear(), m: now.getMonth() }
    render()
  }

  // Hover / focus: title (and time, if scheduled) in a floating tip.
  const tip = document.getElementById("tip")
  function showTip(el) {
    const p = posts[+el.dataset.i]
    if (!p) return
    const when = p.time ? (isScheduled(p) ? "Scheduled " : "") + p.time : ""
    tip.innerHTML =
      "<b>" +
      esc(p.title) +
      "</b>" +
      (when ? "<span>" + esc(when) + "</span>" : "")
    tip.hidden = false
    const r = el.getBoundingClientRect()
    const tw = tip.offsetWidth,
      th = tip.offsetHeight
    let x = Math.min(
      Math.max(8, r.left + r.width / 2 - tw / 2),
      innerWidth - tw - 8,
    )
    let y = r.top - th - 8
    if (y < 8) y = r.bottom + 8
    tip.style.left = x + "px"
    tip.style.top = y + "px"
  }
  const hideTip = () => (tip.hidden = true)
  document.addEventListener("mouseover", (e) => {
    const t = e.target.closest(".tile")
    t ? showTip(t) : hideTip()
  })
  document.addEventListener("focusin", (e) => {
    const t = e.target.closest(".tile")
    t ? showTip(t) : hideTip()
  })
  addEventListener("scroll", hideTip, { passive: true })

  renderFilters()
  render()
  document.getElementById("status").textContent = "Loading posts…"

  ;(async () => {
    const db = await window.claude?.use?.("db")
    const status = document.getElementById("status")
    if (!db) {
      status.textContent = "Open this page in Claude to see the posts."
      return
    }
    db.collection("posts").onSnapshot(
      (snap) => {
        posts = snap.docs
          .map((d) => ({ id: d.id, ...d.data() }))
          .filter((p) => p.date)
        status.textContent = posts.length
          ? ""
          : "No posts yet. A Claude session adds them as they go live or get scheduled."
        render()
      },
      (err) => {
        status.textContent =
          "Could not load posts (" + err.code + "). Reload the page."
      },
    )
  })()
  // Scheduled tiles turn into posted ones once their time passes.
  setInterval(render, 60000)
</script>
