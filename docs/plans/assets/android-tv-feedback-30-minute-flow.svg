<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1660" viewBox="0 0 1600 1660"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7c8a9b" stroke-width="2"/></marker></defs><rect width="1600" height="1660" fill="#f4f6fa"/><g font-family="Arial,Helvetica,sans-serif"><text x="65" y="66" font-size="20" font-weight="700" letter-spacing="3" fill="#456586">WATCH TV • PROPOSED ANTI-SPAM FLOW</text><text x="65" y="124" font-size="43" font-weight="700" fill="#13233b">Verified QR → 30-minute feedback session</text><text x="65" y="162" font-size="23" fill="#52647a">One accepted report per installation per UTC day • One use per reference</text><rect x="65" y="202" width="1030" height="118" rx="18" fill="white" stroke="#d6deea" stroke-width="2"/><circle cx="110" cy="244" r="23" fill="#24496e"/><text x="110" y="251" text-anchor="middle" font-size="19" font-weight="700" fill="white">01</text><text x="153" y="245" font-size="26" font-weight="700" fill="#152c46">OPEN FEEDBACK ON ANDROID TV</text><text x="95" y="289" font-size="23" fill="#4b5f75">App requests a server challenge and Play Integrity proof.</text><path d="M580 322 V342" stroke="#7c8a9b" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="347" width="1030" height="118" rx="18" fill="white" stroke="#d6deea" stroke-width="2"/><circle cx="110" cy="389" r="23" fill="#24496e"/><text x="110" y="396" text-anchor="middle" font-size="19" font-weight="700" fill="white">02</text><text x="153" y="390" font-size="26" font-weight="700" fill="#152c46">SERVER VERIFIES THE APP</text><text x="95" y="434" font-size="23" fill="#4b5f75">Check package, signing certificate, build and integrity verdicts.</text><path d="M580 467 V487" stroke="#7c8a9b" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="492" width="1030" height="118" rx="18" fill="white" stroke="#d6deea" stroke-width="2"/><circle cx="110" cy="534" r="23" fill="#24496e"/><text x="110" y="541" text-anchor="middle" font-size="19" font-weight="700" fill="white">03</text><text x="153" y="535" font-size="26" font-weight="700" fill="#152c46">SERVER ISSUES A DAILY QR</text><text x="95" y="579" font-size="23" fill="#4b5f75">Return a random secret URL, reference code and expiry time.</text><path d="M580 612 V632" stroke="#7c8a9b" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="637" width="1030" height="118" rx="18" fill="white" stroke="#d6deea" stroke-width="2"/><circle cx="110" cy="679" r="23" fill="#24496e"/><text x="110" y="686" text-anchor="middle" font-size="19" font-weight="700" fill="white">04</text><text x="153" y="680" font-size="26" font-weight="700" fill="#152c46">USER SCANS WITH A PHONE</text><text x="95" y="724" font-size="23" fill="#4b5f75">Opening the link does not start the timer or use the code.</text><path d="M580 757 V777" stroke="#7c8a9b" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="782" width="1030" height="118" rx="18" fill="#fff1ed" stroke="#ec6545" stroke-width="3"/><circle cx="110" cy="824" r="23" fill="#de4d30"/><text x="110" y="831" text-anchor="middle" font-size="19" font-weight="700" fill="white">05</text><text x="153" y="825" font-size="26" font-weight="700" fill="#152c46">USER TAPS “START FEEDBACK”</text><text x="95" y="869" font-size="23" fill="#4b5f75">Bind one phone session. Start the server-controlled countdown.</text><path d="M580 902 V922" stroke="#7c8a9b" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="927" width="1030" height="118" rx="18" fill="white" stroke="#d6deea" stroke-width="2"/><circle cx="110" cy="969" r="23" fill="#24496e"/><text x="110" y="976" text-anchor="middle" font-size="19" font-weight="700" fill="white">06</text><text x="153" y="970" font-size="26" font-weight="700" fill="#152c46">ADD PHOTO / VIDEO AND DRAW</text><text x="95" y="1014" font-size="23" fill="#4b5f75">Check authorization before uploads. Validate private files.</text><path d="M580 1047 V1067" stroke="#7c8a9b" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="1072" width="1030" height="118" rx="18" fill="white" stroke="#d6deea" stroke-width="2"/><circle cx="110" cy="1114" r="23" fill="#24496e"/><text x="110" y="1121" text-anchor="middle" font-size="19" font-weight="700" fill="white">07</text><text x="153" y="1115" font-size="26" font-weight="700" fill="#152c46">USER TAPS “SEND FEEDBACK”</text><text x="95" y="1159" font-size="23" fill="#4b5f75">Check time, code, session and files. Save + consume atomically.</text><path d="M580 1192 V1212" stroke="#7c8a9b" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="1217" width="1030" height="118" rx="18" fill="white" stroke="#d6deea" stroke-width="2"/><circle cx="110" cy="1259" r="23" fill="#24496e"/><text x="110" y="1266" text-anchor="middle" font-size="19" font-weight="700" fill="white">08</text><text x="153" y="1260" font-size="26" font-weight="700" fill="#152c46">DELIVER THE ACCEPTED REPORT</text><text x="95" y="1304" font-size="23" fill="#4b5f75">Queue Linear delivery. Retries return the same report receipt.</text><rect x="1130" y="202" width="405" height="208" rx="18" fill="white" stroke="#d6deea" stroke-width="2"/><rect x="1130" y="202" width="6" height="208" rx="3" fill="#b23b35"/><text x="1154" y="240" font-size="23" font-weight="700" fill="#b23b35">IF VERIFICATION FAILS</text><text x="1154" y="278" font-size="21" fill="#4b5f75">No QR is issued.</text><text x="1154" y="310" font-size="21" fill="#4b5f75">No upload is accepted.</text><text x="1154" y="342" font-size="21" fill="#4b5f75">Do not fall back to a</text><text x="1154" y="374" font-size="21" fill="#4b5f75">static public feedback URL.</text><rect x="1130" y="438" width="405" height="242" rx="18" fill="white" stroke="#d6deea" stroke-width="2"/><rect x="1130" y="438" width="6" height="242" rx="3" fill="#de4d30"/><text x="1154" y="476" font-size="23" font-weight="700" fill="#de4d30">TWO EXPIRY RULES</text><text x="1154" y="514" font-size="21" fill="#4b5f75">Unclaimed QR: daily expiry.</text><text x="1154" y="546" font-size="21" fill="#4b5f75">Claimed session: up to 30 min.</text><text x="1154" y="578" font-size="21" fill="#4b5f75">Deadline is the earlier of:</text><text x="1154" y="610" font-size="21" fill="#4b5f75">start + 30 min, or QR expiry.</text><text x="1154" y="642" font-size="21" fill="#4b5f75">Refresh never resets it.</text><rect x="1130" y="708" width="405" height="243" rx="18" fill="white" stroke="#d6deea" stroke-width="2"/><rect x="1130" y="708" width="6" height="243" rx="3" fill="#b23b35"/><text x="1154" y="746" font-size="23" font-weight="700" fill="#b23b35">IF TIME RUNS OUT</text><text x="1154" y="784" font-size="21" fill="#4b5f75">Stop new uploads and sends.</text><text x="1154" y="816" font-size="21" fill="#4b5f75">Keep the local photo and note</text><text x="1154" y="848" font-size="21" fill="#4b5f75">while the page stays open.</text><text x="1154" y="880" font-size="21" fill="#4b5f75">Return to TV for a new code.</text><text x="1154" y="912" font-size="21" fill="#4b5f75">Replacement limits still apply.</text><rect x="1130" y="978" width="405" height="345" rx="18" fill="white" stroke="#d6deea" stroke-width="2"/><rect x="1130" y="978" width="6" height="345" rx="3" fill="#24496e"/><text x="1154" y="1016" font-size="23" font-weight="700" fill="#24496e">UPLOAD ABUSE CONTROLS</text><text x="1154" y="1054" font-size="21" fill="#4b5f75">Cap attempts and total bytes.</text><text x="1154" y="1086" font-size="21" fill="#4b5f75">Deleting files gives no refund.</text><text x="1154" y="1118" font-size="21" fill="#4b5f75">Replacement QR keeps the</text><text x="1154" y="1150" font-size="21" fill="#4b5f75">installation/day upload budget.</text><text x="1154" y="1182" font-size="21" fill="#4b5f75">Cap concurrent processing</text><text x="1154" y="1214" font-size="21" fill="#4b5f75">and total service volume.</text><text x="1154" y="1246" font-size="21" fill="#4b5f75">Limit QR issuance per install.</text><text x="1154" y="1278" font-size="21" fill="#4b5f75">Clean up expired draft files.</text><rect x="65" y="1400" width="1470" height="197" rx="18" fill="#132b46"/><text x="95" y="1443" font-size="25" font-weight="700" fill="white">AFTER ACCEPTANCE</text><text x="95" y="1481" font-size="23" fill="#dce8f7">The code is consumed immediately. Linear delivery may finish after the session expires.</text><text x="95" y="1517" font-size="23" fill="#dce8f7">A failed delivery does not restore the code or create a new report.</text><text x="95" y="1564" font-size="20" fill="#b4c8df">Limits apply to an installation, not a verified person. Play Integrity is not a TV-only form-factor proof.</text></g></svg>
