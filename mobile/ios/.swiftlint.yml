# SwiftLint configuration for Forge iOS app
# https://github.com/realm/SwiftLint

excluded:
  # Generated Swift client (per AGENTS.md - read-only artifacts)
  - ${PWD}/../../packages/clients/swift-ios
  # Build outputs
  - .build
  - DerivedData
  - Package.resolved

# Enabled rules
opt_in_rules:
  - empty_count
  - empty_string
  - force_unwrapping
  - implicitly_unwrapped_optional

# Rule configurations
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 50
  error: 100

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - i
    - x
    - y

# Disabled rules
disabled_rules:
  - trailing_whitespace
  - todo
