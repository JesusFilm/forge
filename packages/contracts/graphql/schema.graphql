# Forge GraphQL Contract (authoritative schema file)

# --- Experience (watch page) ---
# Section discriminator: __typename (MediaCollectionSection | PromoBannerSection | InfoBlocksSection | CTASection)

type Video {
  id: ID!
  title: String!
  slug: String!
  imageUrl: String
}

type MediaCollectionItem {
  video: Video
  imageOverride: String
  titleOverride: String
  subtitleOverride: String
}

enum MediaCollectionVariant {
  carousel
  grid
  collection
  hero
  player
}

type MediaCollectionSection {
  categoryLabel: String
  variant: MediaCollectionVariant!
  title: String
  subtitle: String
  description: String
  ctaLink: String
  showItemNumbers: Boolean
  items: [MediaCollectionItem!]
}

type PromoBannerSection {
  intro: String
  heading: String!
  description: String!
  ctaLink: String!
}

type InfoBlock {
  icon: String!
  title: String!
  description: String!
}

type InfoBlocksSection {
  intro: String
  heading: String
  description: String
  blocks: [InfoBlock!]
}

type CTASection {
  heading: String!
  body: String!
  buttonLabel: String!
  buttonLink: String!
}

union ExperienceSection =
  | MediaCollectionSection
  | PromoBannerSection
  | InfoBlocksSection
  | CTASection

type Experience {
  id: ID!
  slug: String!
  locale: String!
  isHomepage: Boolean!
  sections: [ExperienceSection!]
}

# --- Content (legacy) ---

enum ContentWorkflowState {
  AUTHOR_DRAFT
  AI_PROCESSING
  AI_DRAFT_READY
  IN_REVIEW
  APPROVED
  PUBLISHED
  CHANGES_REQUESTED
}

enum ModerationState {
  PENDING
  FLAGGED
  PASSED
}

type AiProvenance {
  promptTemplateId: ID!
  promptTemplateVersion: String!
  policyVersion: String!
  provider: String!
  model: String!
  confidenceScore: Float
  ragContextIds: [String!]!
}

type ContentVariant {
  id: ID!
  contentItemId: ID!
  locale: String!
  state: ContentWorkflowState!
  body: String!
  moderationState: ModerationState!
  provenance: AiProvenance
}

type ContentItem {
  id: ID!
  slug: String!
  locale: String!
  state: ContentWorkflowState!
  title: String!
  body: String!
  latestVariant: ContentVariant
}

type Query {
  experience(slug: String!, locale: String!): Experience
  homepageExperience(locale: String!): Experience
  contentItem(slug: String!, locale: String!): ContentItem
  contentItems(locale: String!): [ContentItem!]!
}
