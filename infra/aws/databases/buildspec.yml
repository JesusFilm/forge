version: 0.2

env:
  shell: bash

phases:
  install:
    commands:
      - curl -sL https://releases.hashicorp.com/terraform/1.11.0/terraform_1.11.0_linux_amd64.zip -o /tmp/tf.zip
      - unzip -o /tmp/tf.zip -d /usr/local/bin/
      - terraform version

  pre_build:
    commands:
      - |
        SECRET_JSON=$(aws secretsmanager get-secret-value \
          --secret-id "${RDS_SECRET_ARN}" \
          --query SecretString --output text)
        export TF_VAR_pg_admin_password=$(echo "$SECRET_JSON" | jq -r '.password')
      - export TF_VAR_environment="${ENVIRONMENT}"
      - export TF_VAR_pg_host="${RDS_ENDPOINT}"
      - export TF_VAR_ssm_kms_key_arn="${SSM_KMS_KEY_ARN}"
      - |
        terraform init \
          -backend-config="bucket=${STATE_BUCKET}" \
          -backend-config="key=infra/aws/databases/${ENVIRONMENT}/terraform.tfstate" \
          -backend-config="region=us-east-2" \
          -backend-config="dynamodb_table=${LOCK_TABLE}" \
          -backend-config="encrypt=true" \
          -input=false

  build:
    commands:
      - terraform apply -auto-approve -input=false
