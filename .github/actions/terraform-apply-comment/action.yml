name: Terraform apply comment
description: Post commit comment with apply result (stack, status, change summary, log).
inputs:
  stack:
    description: Stack name (aws, vercel, github).
    required: true
  exit_code:
    description: Apply step exit code (e.g. steps.apply_aws.outputs.exit_code).
    required: true
  env:
    description: Deploy environment (e.g. prod, stage, production).
    required: true
  output_file:
    description: Path to apply log file from repo root (e.g. infra/aws/apply-aws.txt).
    required: true
runs:
  using: composite
  steps:
    - name: Comment commit with apply result
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require("fs");
          const path = require("path");
          const stack = "${{ inputs.stack }}";
          const exitCode = Number("${{ inputs.exit_code }}" || "1");
          const env = "${{ inputs.env }}";
          const outputPath = path.join(process.env.GITHUB_WORKSPACE || ".", "${{ inputs.output_file }}");
          const status = exitCode === 0 ? "Applied" : "Apply failed";
          const icon = exitCode === 0 ? "✅" : "❌";
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          let applyOutput = "";
          try {
            applyOutput = fs.readFileSync(outputPath, "utf8");
          } catch (e) {
            applyOutput = `Unable to read apply output: ${e.message}`;
          }
          const summaryMatch = applyOutput.match(/Apply complete!\s+Resources:\s+(\d+)\s+added,\s+(\d+)\s+changed,\s+(\d+)\s+destroyed\./);
          const changeSummary = summaryMatch
            ? `+${summaryMatch[1]} ~${summaryMatch[2]} -${summaryMatch[3]}`
            : "n/a";
          const now = new Date();
          const fmt = (tz, label) => `${label}: ${now.toLocaleString("en-CA", { timeZone: tz, dateStyle: "short", timeStyle: "medium" })}`;
          const timestamps = [fmt("UTC", "UTC"), fmt("Pacific/Auckland", "NZ"), fmt("America/Los_Angeles", "PT"), fmt("America/New_York", "ET")].join(" | ");
          const maxLen = 45000;
          if (applyOutput.length > maxLen) {
            applyOutput = `${applyOutput.slice(0, maxLen)}\n\n... (truncated)`;
          }
          const body = [
            `<!-- terraform-apply-${stack}:${env} -->`,
            `## ${icon} Terraform apply (${stack}/${env}) — ${status}`,
            `**Changes:** ${changeSummary}`,
            `**Time:** ${timestamps}`,
            "",
            `Run: ${runUrl}`,
            "",
            "```",
            applyOutput,
            "```",
          ].join("\n");
          await github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body,
          });
