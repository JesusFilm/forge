name: Terraform apply comment
description: Post commit comment with apply result (stack, status, change summary, log).
inputs:
  stack:
    description: Stack name (aws, vercel, github).
    required: true
  exit_code:
    description: Apply step exit code (e.g. steps.apply_aws.outputs.exit_code).
    required: true
  env:
    description: Deploy environment (e.g. prod, stage, production).
    required: true
  output_file:
    description: Path to apply log file from repo root (e.g. infra/aws/apply-aws.txt).
    required: true
runs:
  using: composite
  steps:
    - name: Comment commit with apply result
      uses: actions/github-script@v8
      with:
        script: |
          const path = require('path');
          const fs = require('fs');
          const run = require(path.join(process.env.GITHUB_ACTION_PATH, 'comment.js'));
          try {
            await run({ github, context, core, fs, path });
          } catch (err) {
            core.setFailed(err);
            throw err;
          }
      env:
        INPUT_STACK: ${{ inputs.stack }}
        INPUT_EXIT_CODE: ${{ inputs.exit_code }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_OUTPUT_FILE: ${{ inputs.output_file }}
