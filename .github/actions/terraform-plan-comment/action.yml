name: Terraform plan comment
description: Post or update PR comment with plan result (stack, env, status, change summary, plan output).
inputs:
  stack:
    description: Stack name (aws, vercel, github).
    required: true
  env:
    description: Environment name (e.g. stage, prod, preview). Use empty for single-env stacks like vercel.
    required: false
    default: ""
  exit_code:
    description: Plan step exit code (e.g. steps.plan.outputs.exit_code).
    required: true
  output_file:
    description: Path to plan log file from repo root (e.g. infra/aws/plan-stage.txt).
    required: true
runs:
  using: composite
  steps:
    - name: Comment PR with plan result
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require("fs");
          if (context.payload.pull_request?.head?.repo?.fork) {
            core.info("Skipping PR comment for forked repository context.");
            return;
          }
          const stack = "${{ inputs.stack }}";
          const env = "${{ inputs.env }}".trim();
          const exitCode = Number("${{ inputs.exit_code }}" || "1");
          const outputPath = "${{ inputs.output_file }}";
          const marker = env
            ? `<!-- terraform-plan-${stack}:${env} -->`
            : `<!-- terraform-plan-${stack} -->`;
          const envLabel = env ? `/${env}` : "";

          let plan = "";
          try {
            plan = fs.readFileSync(outputPath, "utf8");
          } catch (e) {
            plan = `Unable to read ${outputPath}: ${e.message}`;
          }

          const summaryMatch = plan.match(/Plan:\s+(\d+)\s+to add,\s+(\d+)\s+to change,\s+(\d+)\s+to destroy\./);
          const addCount = summaryMatch ? Number(summaryMatch[1]) : 0;
          const changeCount = summaryMatch ? Number(summaryMatch[2]) : 0;
          const destroyCount = summaryMatch ? Number(summaryMatch[3]) : 0;
          const totalChanges = addCount + changeCount + destroyCount;
          const status =
            exitCode === 1 ? "Plan failed" :
            summaryMatch ? (totalChanges > 0 ? "Changes detected" : "No changes") :
            (exitCode === 2 ? "Changes detected" : "No changes");
          const icon =
            exitCode === 1 ? "❌" :
            summaryMatch ? (totalChanges > 0 ? "🟨" : "✅") :
            (exitCode === 2 ? "🟨" : "✅");
          const changeSummary = summaryMatch
            ? `+${addCount} ~${changeCount} -${destroyCount}`
            : "n/a";

          const maxLen = 45000;
          if (plan.length > maxLen) {
            plan = `${plan.slice(0, maxLen)}\n\n... (truncated)`;
          }

          const body = `${marker}
          ## ${icon} Terraform plan (${stack}${envLabel}) — ${status}
          **Changes:** ${changeSummary}

          \`\`\`
          ${plan}
          \`\`\`
          `;

          try {
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((c) =>
              c.user?.type === "Bot" && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
          } catch (error) {
            if (error.status === 403) {
              core.warning("Skipping PR plan comment: token has no write access in this context.");
              return;
            }
            throw error;
          }
