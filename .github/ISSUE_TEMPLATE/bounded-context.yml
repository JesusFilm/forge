name: Bounded Context Work Item
description: One issue equals one bounded context.
title: "type(scope): "
labels:
  - scoped
body:
  - type: dropdown
    id: type
    attributes:
      label: Issue type
      description: Use in title prefix.
      options:
        - feat
        - fix
        - chore
        - docs
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Bounded context (scope)
      description: Single context only (web, cms, ai-orchestrator, contracts, infra, mobile-ios, mobile-android). Use "tooling" if outside project work. Replace type(scope) in title with these values.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Clear, testable outcome.
    validations:
      required: true
  - type: textarea
    id: impacted_folders
    attributes:
      label: Impacted folders
      description: Explicit paths to be changed.
      placeholder: |
        - apps/cms
        - packages/contracts
    validations:
      required: true
  - type: checkboxes
    id: contracts
    attributes:
      label: Contract impact
      options:
        - label: Contracts will change
        - label: Contracts unchanged
