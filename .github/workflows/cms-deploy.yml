name: cms-deploy

permissions:
  contents: read

concurrency:
  group: cms-deploy-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - stage
      - main
  workflow_dispatch:

jobs:
  affected:
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      cms: ${{ steps.affected.outputs.cms }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: affected
        name: Detect affected CMS package
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi

          if [ -z "$BASE" ]; then
            echo "cms=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TURBO_STDERR=$(mktemp)
          if ! TURBO_OUT=$(TURBO_SCM_BASE="$BASE" pnpm turbo run lint --affected --dry-run=json 2>"$TURBO_STDERR"); then
            cat "$TURBO_STDERR" >&2
            echo "$TURBO_OUT" >&2
            rm -f "$TURBO_STDERR"
            echo "Affected detection failed; forcing deploy to avoid false negative." >&2
            echo "cms=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CMS_AFFECTED=$(echo "$TURBO_OUT" | jq -r 'try ([.tasks[]?.package] | any(. == "@forge/cms")) catch "true"' 2>/dev/null || echo "true")
          rm -f "$TURBO_STDERR"
          echo "cms=$CMS_AFFECTED" >> "$GITHUB_OUTPUT"

  deploy:
    permissions:
      id-token: write
      contents: write
    needs: affected
    if: always() && ((github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'stage')) || (github.event_name != 'workflow_dispatch' && needs.affected.outputs.cms == 'true'))
    environment: ${{ github.ref_name == 'main' && 'cms-prod' || 'cms-stage' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve environment and role
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            DEPLOY_ENV="prod"
          elif [ "${GITHUB_REF_NAME}" = "stage" ]; then
            DEPLOY_ENV="stage"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          echo "role_arn=${{ secrets.CMS_DEPLOY_ROLE_ARN }}" >> "$GITHUB_OUTPUT"
          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "ecr_repository=forge-cms-$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_REF_NAME}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "cluster_name=forge-cms-$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "service_name=forge-cms-$DEPLOY_ENV-service" >> "$GITHUB_OUTPUT"

      - name: Validate role ARN is configured
        if: steps.vars.outputs.role_arn == ''
        run: |
          echo "Missing CMS_DEPLOY_ROLE_ARN secret for ${GITHUB_JOB} environment on ${GITHUB_REF_NAME}" >&2
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.vars.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CMS image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.vars.outputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          IMAGE_LATEST="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          CACHE_REF="$ECR_REGISTRY/$ECR_REPOSITORY:buildcache"

          docker buildx build \
            --file apps/cms/Dockerfile \
            --tag "$IMAGE_URI" --tag "$IMAGE_LATEST" \
            --cache-from type=registry,ref="$CACHE_REF" \
            --cache-to type=registry,ref="$CACHE_REF",mode=max \
            --push \
            .

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Roll ECS service to new image
        id: deploy
        env:
          CLUSTER_NAME: ${{ steps.vars.outputs.cluster_name }}
          SERVICE_NAME: ${{ steps.vars.outputs.service_name }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          set -o pipefail

          print_service_snapshot() {
            local service_json="$1"
            echo "Service status:"
            echo "$service_json" | jq -r '
              .services[0] as $service
              | "service=\($service.serviceName) status=\($service.status) desired=\($service.desiredCount) running=\($service.runningCount) pending=\($service.pendingCount)"
            '
            echo "Deployments:"
            echo "$service_json" | jq -r '
              .services[0].deployments[]?
              | "- status=\(.status) rollout=\(.rolloutState // "n/a") reason=\(.rolloutStateReason // "n/a") desired=\(.desiredCount) running=\(.runningCount) pending=\(.pendingCount) taskDef=\(.taskDefinition)"
            '
          }

          print_recent_events() {
            local service_json="$1"
            echo "Recent ECS service events:"
            echo "$service_json" | jq -r '
              .services[0].events[:5][]?
              | "- [\(.createdAt)] \(.message)"
            '
          }

          echo "Describing ECS service: $SERVICE_NAME"
          SERVICE_JSON=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME")
          if [ "$(echo "$SERVICE_JSON" | jq -r '.failures | length')" -gt 0 ] || \
             [ "$(echo "$SERVICE_JSON" | jq -r '.services | length')" -eq 0 ]; then
            echo "ECS service not found or not describable: $SERVICE_NAME" >&2
            exit 1
          fi

          print_service_snapshot "$SERVICE_JSON"

          TASK_DEFINITION_ARN=$(echo "$SERVICE_JSON" | jq -r '.services[0].taskDefinition')
          if [ -z "$TASK_DEFINITION_ARN" ] || [ "$TASK_DEFINITION_ARN" = "null" ]; then
            echo "Missing task definition ARN for service: $SERVICE_NAME" >&2
            exit 1
          fi

          echo "Current ECS task definition ARN: $TASK_DEFINITION_ARN"
          echo "Current ECS task definition family: $(echo "$TASK_DEFINITION_ARN" | cut -d'/' -f2 | cut -d':' -f1)"
          echo "Current ECS task definition revision: $(echo "$TASK_DEFINITION_ARN" | awk -F: '{print $NF}')"

          BASE_TASK=$(aws ecs describe-task-definition --task-definition "$TASK_DEFINITION_ARN")
          CMS_CONTAINER_COUNT=$(echo "$BASE_TASK" | jq -r '[.taskDefinition.containerDefinitions[] | select(.name=="cms")] | length')
          if [ "$CMS_CONTAINER_COUNT" -eq 0 ]; then
            echo "Container named 'cms' not found in task definition: $TASK_DEFINITION_ARN" >&2
            exit 1
          fi

          NEW_TASK=$(echo "$BASE_TASK" | jq --arg IMAGE "$IMAGE_URI" '
            .taskDefinition
            | .containerDefinitions |= map(if .name == "cms" then .image = $IMAGE else . end)
            | {
                family,
                taskRoleArn,
                executionRoleArn,
                networkMode,
                containerDefinitions,
                volumes,
                placementConstraints,
                requiresCompatibilities,
                cpu,
                memory,
                tags,
                pidMode,
                ipcMode,
                proxyConfiguration,
                inferenceAccelerators,
                ephemeralStorage,
                runtimePlatform
              }
            | with_entries(select(.value != null))
          ')

          echo "Registering new task definition for image: $IMAGE_URI"
          NEW_TASK_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK" | jq -r '.taskDefinition.taskDefinitionArn')
          echo "Registered ECS task definition ARN: $NEW_TASK_ARN"

          echo "Updating ECS service to task definition: $NEW_TASK_ARN"
          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --task-definition "$NEW_TASK_ARN" \
            --force-new-deployment >/dev/null

          MAX_ATTEMPTS=60
          SLEEP_SECONDS=10

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Rollout poll $attempt/$MAX_ATTEMPTS"
            SERVICE_JSON=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME")
            print_service_snapshot "$SERVICE_JSON"

            ROLLOUT_STATE=$(echo "$SERVICE_JSON" | jq -r '.services[0].deployments[] | select(.status=="PRIMARY") | .rolloutState // empty')
            ROLLOUT_REASON=$(echo "$SERVICE_JSON" | jq -r '.services[0].deployments[] | select(.status=="PRIMARY") | .rolloutStateReason // empty')
            DESIRED_COUNT=$(echo "$SERVICE_JSON" | jq -r '.services[0].desiredCount')
            RUNNING_COUNT=$(echo "$SERVICE_JSON" | jq -r '.services[0].runningCount')
            PENDING_COUNT=$(echo "$SERVICE_JSON" | jq -r '.services[0].pendingCount')
            DEPLOYMENT_COUNT=$(echo "$SERVICE_JSON" | jq -r '.services[0].deployments | length')

            if [ "$ROLLOUT_STATE" = "COMPLETED" ] && \
               [ "$RUNNING_COUNT" = "$DESIRED_COUNT" ] && \
               [ "$PENDING_COUNT" = "0" ] && \
               [ "$DEPLOYMENT_COUNT" = "1" ]; then
              echo "ECS rollout completed successfully."
              break
            fi

            if [ "$ROLLOUT_STATE" = "FAILED" ]; then
              echo "Primary deployment rollout failed: ${ROLLOUT_REASON:-no reason provided}" >&2
              print_recent_events "$SERVICE_JSON"
              exit 1
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "Primary deployment rollout did not complete within $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds." >&2
              echo "Final rollout state: ${ROLLOUT_STATE:-unknown}" >&2
              if [ -n "$ROLLOUT_REASON" ]; then
                echo "Final rollout reason: $ROLLOUT_REASON" >&2
              fi
              print_recent_events "$SERVICE_JSON"
              exit 1
            fi

            print_recent_events "$SERVICE_JSON"
            sleep "$SLEEP_SECONDS"
          done

          echo "task_definition_arn=$NEW_TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Post deployment status comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          DEPLOY_ENV: ${{ steps.vars.outputs.deploy_env }}
          CLUSTER_NAME: ${{ steps.vars.outputs.cluster_name }}
          SERVICE_NAME: ${{ steps.vars.outputs.service_name }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          TASK_DEFINITION_ARN: ${{ steps.deploy.outputs.task_definition_arn }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const status = process.env.JOB_STATUS === "success" ? "SUCCESS" : "FAILED"
            const body = [
              `CMS deploy ${status}`,
              "",
              `- Environment: \`${process.env.DEPLOY_ENV || "unknown"}\``,
              `- Branch: \`${context.ref.replace("refs/heads/", "")}\``,
              `- Image: \`${process.env.IMAGE_URI || "n/a"}\``,
              `- ECS cluster: \`${process.env.CLUSTER_NAME || "n/a"}\``,
              `- ECS service: \`${process.env.SERVICE_NAME || "n/a"}\``,
              `- Task definition: \`${process.env.TASK_DEFINITION_ARN || "n/a"}\``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n")

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            })
