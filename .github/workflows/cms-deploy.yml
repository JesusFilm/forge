name: cms-deploy

permissions:
  contents: read

concurrency:
  group: cms-deploy-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - stage
      - main

jobs:
  affected:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      cms: ${{ steps.affected.outputs.cms }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: affected
        name: Detect affected CMS package
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi

          if [ -z "$BASE" ]; then
            echo "cms=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! TURBO_OUT=$(TURBO_SCM_BASE="$BASE" pnpm turbo run lint --filter=@forge/cms --affected --dry-run=json 2>&1); then
            echo "$TURBO_OUT" >&2
            echo "Affected detection failed; forcing deploy to avoid false negative." >&2
            echo "cms=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CMS_AFFECTED=$(echo "$TURBO_OUT" | jq -r 'try ([.tasks[]?.package] | any(. == "@forge/cms")) catch "true"')
          echo "cms=$CMS_AFFECTED" >> "$GITHUB_OUTPUT"

  deploy:
    permissions:
      id-token: write
      contents: write
    needs: affected
    if: needs.affected.outputs.cms == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      ECR_REPOSITORY: forge-cms
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve environment and role
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            DEPLOY_ENV="prod"
            echo "role_arn=${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD || secrets.AWS_DEPLOY_ROLE_ARN }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "stage" ]; then
            DEPLOY_ENV="stage"
            echo "role_arn=${{ secrets.AWS_DEPLOY_ROLE_ARN_STAGE || secrets.AWS_DEPLOY_ROLE_ARN }}" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_REF_NAME}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "cluster_name=forge-cms-$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "service_name=forge-cms-$DEPLOY_ENV-service" >> "$GITHUB_OUTPUT"

      - name: Validate role ARN is configured
        if: steps.vars.outputs.role_arn == ''
        run: |
          echo "Missing AWS deploy role secret for ${GITHUB_REF_NAME}" >&2
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.vars.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability MUTABLE >/dev/null

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push CMS image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          IMAGE_LATEST="$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.deploy_env }}-latest"

          docker build -f apps/cms/Dockerfile -t "$IMAGE_URI" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_URI"
          docker push "$IMAGE_LATEST"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Roll ECS service to new image
        id: deploy
        env:
          CLUSTER_NAME: ${{ steps.vars.outputs.cluster_name }}
          SERVICE_NAME: ${{ steps.vars.outputs.service_name }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          SERVICE_JSON=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME")
          if [ "$(echo "$SERVICE_JSON" | jq -r '.failures | length')" -gt 0 ] || \
             [ "$(echo "$SERVICE_JSON" | jq -r '.services | length')" -eq 0 ]; then
            echo "ECS service not found or not describable: $SERVICE_NAME" >&2
            exit 1
          fi

          TASK_DEFINITION_ARN=$(echo "$SERVICE_JSON" | jq -r '.services[0].taskDefinition')
          if [ -z "$TASK_DEFINITION_ARN" ] || [ "$TASK_DEFINITION_ARN" = "null" ]; then
            echo "Missing task definition ARN for service: $SERVICE_NAME" >&2
            exit 1
          fi

          BASE_TASK=$(aws ecs describe-task-definition --task-definition "$TASK_DEFINITION_ARN")
          CMS_CONTAINER_COUNT=$(echo "$BASE_TASK" | jq -r '[.taskDefinition.containerDefinitions[] | select(.name=="cms")] | length')
          if [ "$CMS_CONTAINER_COUNT" -eq 0 ]; then
            echo "Container named 'cms' not found in task definition: $TASK_DEFINITION_ARN" >&2
            exit 1
          fi

          NEW_TASK=$(echo "$BASE_TASK" | jq --arg IMAGE "$IMAGE_URI" '
            .taskDefinition
            | .containerDefinitions |= map(if .name == "cms" then .image = $IMAGE else . end)
            | {
                family,
                taskRoleArn,
                executionRoleArn,
                networkMode,
                containerDefinitions,
                volumes,
                placementConstraints,
                requiresCompatibilities,
                cpu,
                memory,
                tags,
                pidMode,
                ipcMode,
                proxyConfiguration,
                inferenceAccelerators,
                ephemeralStorage,
                runtimePlatform
              }
            | with_entries(select(.value != null))
          ')

          NEW_TASK_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK" | jq -r '.taskDefinition.taskDefinitionArn')

          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --task-definition "$NEW_TASK_ARN" \
            --force-new-deployment >/dev/null

          aws ecs wait services-stable --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME"

          ROLLOUT_STATE=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" | jq -r '.services[0].deployments[] | select(.status=="PRIMARY") | .rolloutState')
          if [ "$ROLLOUT_STATE" != "COMPLETED" ]; then
            echo "Primary deployment rollout did not complete: $ROLLOUT_STATE" >&2
            exit 1
          fi

          echo "task_definition_arn=$NEW_TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Post deployment status comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          DEPLOY_ENV: ${{ steps.vars.outputs.deploy_env }}
          CLUSTER_NAME: ${{ steps.vars.outputs.cluster_name }}
          SERVICE_NAME: ${{ steps.vars.outputs.service_name }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          TASK_DEFINITION_ARN: ${{ steps.deploy.outputs.task_definition_arn }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const status = process.env.JOB_STATUS === "success" ? "SUCCESS" : "FAILED"
            const body = [
              `CMS deploy ${status}`,
              "",
              `- Environment: \`${process.env.DEPLOY_ENV || "unknown"}\``,
              `- Branch: \`${context.ref.replace("refs/heads/", "")}\``,
              `- Image: \`${process.env.IMAGE_URI || "n/a"}\``,
              `- ECS cluster: \`${process.env.CLUSTER_NAME || "n/a"}\``,
              `- ECS service: \`${process.env.SERVICE_NAME || "n/a"}\``,
              `- Task definition: \`${process.env.TASK_DEFINITION_ARN || "n/a"}\``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n")

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            })
