name: cms-deploy

permissions:
  contents: read

concurrency:
  group: cms-deploy-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - stage
      - main
  workflow_dispatch:

jobs:
  affected:
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      cms: ${{ steps.affected.outputs.cms }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: affected
        name: Detect affected CMS package
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi

          if [ -z "$BASE" ]; then
            echo "cms=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TURBO_STDERR=$(mktemp)
          if ! TURBO_OUT=$(TURBO_SCM_BASE="$BASE" pnpm turbo run lint --affected --dry-run=json 2>"$TURBO_STDERR"); then
            cat "$TURBO_STDERR" >&2
            echo "$TURBO_OUT" >&2
            rm -f "$TURBO_STDERR"
            echo "Affected detection failed; forcing deploy to avoid false negative." >&2
            echo "cms=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CMS_AFFECTED=$(echo "$TURBO_OUT" | jq -r 'try ([.tasks[]?.package] | any(. == "@forge/cms")) catch "true"' 2>/dev/null || echo "true")
          rm -f "$TURBO_STDERR"
          echo "cms=$CMS_AFFECTED" >> "$GITHUB_OUTPUT"

  deploy:
    permissions:
      id-token: write
      contents: write
    needs: affected
    if: always() && ((github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'stage')) || (github.event_name != 'workflow_dispatch' && needs.affected.outputs.cms == 'true'))
    environment: ${{ github.ref_name == 'main' && 'cms-prod' || 'cms-stage' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve environment and role
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            DEPLOY_ENV="prod"
          elif [ "${GITHUB_REF_NAME}" = "stage" ]; then
            DEPLOY_ENV="stage"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          echo "role_arn=${{ secrets.CMS_DEPLOY_ROLE_ARN }}" >> "$GITHUB_OUTPUT"
          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "ecr_repository=forge-cms-$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_REF_NAME}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "cluster_name=forge-cms-$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "service_name=forge-cms-$DEPLOY_ENV-service" >> "$GITHUB_OUTPUT"

      - name: Validate role ARN is configured
        if: steps.vars.outputs.role_arn == ''
        run: |
          echo "Missing CMS_DEPLOY_ROLE_ARN secret for ${GITHUB_JOB} environment on ${GITHUB_REF_NAME}" >&2
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.vars.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CMS image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.vars.outputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          IMAGE_LATEST="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          CACHE_REF="$ECR_REGISTRY/$ECR_REPOSITORY:buildcache"

          docker buildx build \
            --file apps/cms/Dockerfile \
            --tag "$IMAGE_URI" --tag "$IMAGE_LATEST" \
            --cache-from type=registry,ref="$CACHE_REF" \
            --cache-to type=registry,ref="$CACHE_REF",mode=max \
            --push \
            .

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Roll ECS service to new image
        id: deploy
        env:
          CLUSTER_NAME: ${{ steps.vars.outputs.cluster_name }}
          SERVICE_NAME: ${{ steps.vars.outputs.service_name }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          DEPLOY_ENV: ${{ steps.vars.outputs.deploy_env }}
        run: |
          set -euo pipefail

          sanitize_logs() {
            perl -pe '
              s/(DATABASE_PASSWORD|APP_KEYS|ADMIN_JWT_SECRET|JWT_SECRET|API_TOKEN_SALT|TRANSFER_TOKEN_SALT|ENCRYPTION_KEY|STRAPI_INTERNAL_API_TOKEN|DATABASE_URL)\s*[=:"]+\s*\K[^\s,}"'"'"']+/***REDACTED***/gi;
              s{postgres(ql)?://[^@\s]+@}{postgres$1://***:***@}gi;
            '
          }

          fetch_stopped_task_logs() {
            local log_group="/ecs/forge-cms-${DEPLOY_ENV}"
            echo ""
            echo "=== STOPPED TASK LOGS (secrets redacted) ==="
            for task_arn in "${STOPPED_TASK_ARNS[@]}"; do
              local task_id="${task_arn##*/}"
              local log_stream="cms/cms/${task_id}"
              echo "--- task ${task_id} ---"
              aws logs get-log-events \
                --log-group-name "$log_group" \
                --log-stream-name "$log_stream" \
                --limit 200 \
                --no-paginate \
                --output json 2>/dev/null \
                | jq -r '.events[].message' \
                | sanitize_logs \
              || echo "(no logs available)"
              echo "--- end task ${task_id} ---"
            done
            echo "=== END STOPPED TASK LOGS ==="
          }

          SERVICE_JSON=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME")
          if [ "$(echo "$SERVICE_JSON" | jq -r '.failures | length')" -gt 0 ] || [ "$(echo "$SERVICE_JSON" | jq -r '.services | length')" -eq 0 ]; then
            echo "ECS service not found: $SERVICE_NAME" >&2
            exit 1
          fi

          TASK_DEF_ARN=$(echo "$SERVICE_JSON" | jq -r '.services[0].taskDefinition')
          if [ -z "$TASK_DEF_ARN" ] || [ "$TASK_DEF_ARN" = "null" ]; then
            echo "Service has no task definition: $SERVICE_NAME" >&2
            exit 1
          fi

          echo "Cluster=$CLUSTER_NAME Service=$SERVICE_NAME TaskDef=$TASK_DEF_ARN"
          echo "Forcing new deployment (task def uses :latest; new image already pushed)."
          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --force-new-deployment \
            --output text --query 'service.deployments[0].rolloutState' >/dev/null || true

          sleep 2
          SVC=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME")
          NEW_DEPLOY_ID=$(echo "$SVC" | jq -r '.services[0].deployments[] | select(.status=="PRIMARY") | .id')
          echo "Tracking deployment: $NEW_DEPLOY_ID"

          STOPPED_TASK_ARNS=()
          CRASH_THRESHOLD=3
          MAX_ATTEMPTS=60
          INTERVAL=10

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            SVC=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME")
            PRIMARY=$(echo "$SVC" | jq -r '.services[0].deployments[] | select(.status=="PRIMARY")')
            STATE=$(echo "$PRIMARY" | jq -r '.rolloutState // "IN_PROGRESS"')
            REASON=$(echo "$PRIMARY" | jq -r '.rolloutStateReason // ""')
            DESIRED=$(echo "$SVC" | jq -r '.services[0].desiredCount')
            RUNNING=$(echo "$SVC" | jq -r '.services[0].runningCount')
            PENDING=$(echo "$SVC" | jq -r '.services[0].pendingCount')
            NUM_DEPLOYS=$(echo "$SVC" | jq -r '.services[0].deployments | length')

            STOPPED_JSON=$(aws ecs list-tasks \
              --cluster "$CLUSTER_NAME" \
              --service-name "$SERVICE_NAME" \
              --desired-status STOPPED \
              --output json 2>/dev/null || echo '{"taskArns":[]}')
            NEW_STOPPED=$(echo "$STOPPED_JSON" | jq -r '.taskArns[]' 2>/dev/null || true)

            for task_arn in $NEW_STOPPED; do
              already_tracked=false
              for known in "${STOPPED_TASK_ARNS[@]+"${STOPPED_TASK_ARNS[@]}"}"; do
                if [ "$known" = "$task_arn" ]; then already_tracked=true; break; fi
              done
              if $already_tracked; then continue; fi

              TASK_DETAIL=$(aws ecs describe-tasks --cluster "$CLUSTER_NAME" --tasks "$task_arn" --output json 2>/dev/null || echo '{"tasks":[]}')
              TASK_STARTED_BY=$(echo "$TASK_DETAIL" | jq -r '.tasks[0].startedBy // ""')
              if [ "$TASK_STARTED_BY" != "$NEW_DEPLOY_ID" ]; then continue; fi

              STOPPED_TASK_ARNS+=("$task_arn")
              TASK_STOP_CODE=$(echo "$TASK_DETAIL" | jq -r '.tasks[0].stopCode // "unknown"')
              TASK_STOP_REASON=$(echo "$TASK_DETAIL" | jq -r '.tasks[0].stoppedReason // "unknown"')
              CONTAINER_EXIT=$(echo "$TASK_DETAIL" | jq -r '.tasks[0].containers[0].exitCode // "n/a"')
              task_id="${task_arn##*/}"
              echo "  STOPPED task $task_id  exit=$CONTAINER_EXIT  code=$TASK_STOP_CODE  reason=$TASK_STOP_REASON"
            done

            STOPPED_COUNT=${#STOPPED_TASK_ARNS[@]}
            echo "[$i/$MAX_ATTEMPTS] rollout=$STATE running=$RUNNING desired=$DESIRED pending=$PENDING deployments=$NUM_DEPLOYS stopped_new=$STOPPED_COUNT"

            if [ "$STATE" = "COMPLETED" ] && [ "$RUNNING" = "$DESIRED" ] && [ "$PENDING" = "0" ] && [ "$NUM_DEPLOYS" = "1" ]; then
              echo "Rollout completed."
              break
            fi

            if [ "$STATE" = "FAILED" ]; then
              echo "Rollout failed: $REASON" >&2
              echo "$SVC" | jq -r '.services[0].events[:5][] | "  \(.createdAt) \(.message)"' >&2
              if [ "$STOPPED_COUNT" -gt 0 ]; then fetch_stopped_task_logs >&2; fi
              exit 1
            fi

            if [ "$STOPPED_COUNT" -ge "$CRASH_THRESHOLD" ]; then
              echo "Crash loop detected: $STOPPED_COUNT tasks from new deployment have stopped." >&2
              echo "$SVC" | jq -r '.services[0].events[:10][] | "  \(.createdAt) \(.message)"' >&2
              fetch_stopped_task_logs >&2
              exit 1
            fi

            if [ "$i" = "$MAX_ATTEMPTS" ]; then
              echo "Rollout did not complete within $((MAX_ATTEMPTS * INTERVAL))s. State=$STATE" >&2
              if [ "$STOPPED_COUNT" -gt 0 ]; then fetch_stopped_task_logs >&2; fi
              exit 1
            fi

            sleep "$INTERVAL"
          done

          echo "task_definition_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Post deployment status comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          DEPLOY_ENV: ${{ steps.vars.outputs.deploy_env }}
          CLUSTER_NAME: ${{ steps.vars.outputs.cluster_name }}
          SERVICE_NAME: ${{ steps.vars.outputs.service_name }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          TASK_DEFINITION_ARN: ${{ steps.deploy.outputs.task_definition_arn }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const status = process.env.JOB_STATUS === "success" ? "SUCCESS" : "FAILED"
            const body = [
              `CMS deploy ${status}`,
              "",
              `- Environment: \`${process.env.DEPLOY_ENV || "unknown"}\``,
              `- Branch: \`${context.ref.replace("refs/heads/", "")}\``,
              `- Image: \`${process.env.IMAGE_URI || "n/a"}\``,
              `- ECS cluster: \`${process.env.CLUSTER_NAME || "n/a"}\``,
              `- ECS service: \`${process.env.SERVICE_NAME || "n/a"}\``,
              `- Task definition: \`${process.env.TASK_DEFINITION_ARN || "n/a"}\``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n")

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            })
