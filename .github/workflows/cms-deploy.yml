name: cms-deploy

permissions:
  contents: read

concurrency:
  group: cms-deploy-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - stage
      - main
  workflow_dispatch:

jobs:
  affected:
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      cms: ${{ steps.affected.outputs.cms }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: affected
        name: Detect affected CMS package
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi

          if [ -z "$BASE" ]; then
            echo "cms=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TURBO_STDERR=$(mktemp)
          if ! TURBO_OUT=$(TURBO_SCM_BASE="$BASE" pnpm turbo run lint --affected --dry-run=json 2>"$TURBO_STDERR"); then
            cat "$TURBO_STDERR" >&2
            echo "$TURBO_OUT" >&2
            rm -f "$TURBO_STDERR"
            echo "Affected detection failed; forcing deploy to avoid false negative." >&2
            echo "cms=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CMS_AFFECTED=$(echo "$TURBO_OUT" | jq -r 'try ([.tasks[]?.package] | any(. == "@forge/cms")) catch "true"' 2>/dev/null || echo "true")
          rm -f "$TURBO_STDERR"
          echo "cms=$CMS_AFFECTED" >> "$GITHUB_OUTPUT"

  deploy:
    permissions:
      contents: write
    needs: affected
    if: always() && ((github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'stage')) || (github.event_name != 'workflow_dispatch' && needs.affected.outputs.cms == 'true'))
    environment: ${{ github.ref_name == 'main' && 'cms-prod' || 'cms-stage' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Railway environment
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            DEPLOY_ENV="prod"
            RAILWAY_ENV="${{ vars.RAILWAY_ENV_PROD }}"
            RAILWAY_SERVICE="${{ vars.RAILWAY_CMS_SERVICE_PROD }}"
          elif [ "${GITHUB_REF_NAME}" = "stage" ]; then
            DEPLOY_ENV="stage"
            RAILWAY_ENV="${{ vars.RAILWAY_ENV_STAGE }}"
            RAILWAY_SERVICE="${{ vars.RAILWAY_CMS_SERVICE_STAGE }}"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          echo "railway_env=$RAILWAY_ENV" >> "$GITHUB_OUTPUT"
          echo "railway_service=$RAILWAY_SERVICE" >> "$GITHUB_OUTPUT"
          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
      - name: Validate Railway config
        if: steps.vars.outputs.railway_env == '' || steps.vars.outputs.railway_service == ''
        run: |
          echo "Missing Railway vars (RAILWAY_ENV_* / RAILWAY_CMS_SERVICE_*) for ${GITHUB_REF_NAME}" >&2
          exit 1

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy CMS to Railway
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_CMS_DEPLOY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ steps.vars.outputs.railway_env }}
          RAILWAY_SERVICE: ${{ steps.vars.outputs.railway_service }}
          DEPLOY_ENV: ${{ steps.vars.outputs.deploy_env }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Missing RAILWAY_CMS_DEPLOY_TOKEN secret" >&2
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "Missing RAILWAY_PROJECT_ID variable" >&2
            exit 1
          fi
          cd apps/cms
          railway up --ci --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT"

      - name: Post deployment status comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          DEPLOY_ENV: ${{ steps.vars.outputs.deploy_env }}
          RAILWAY_SERVICE: ${{ steps.vars.outputs.railway_service }}
          RAILWAY_ENVIRONMENT: ${{ steps.vars.outputs.railway_env }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const status = process.env.JOB_STATUS === "success" ? "SUCCESS" : "FAILED"
            const body = [
              `CMS deploy ${status}`,
              "",
              `- Environment: \`${process.env.DEPLOY_ENV || "unknown"}\``,
              `- Branch: \`${context.ref.replace("refs/heads/", "")}\``,
              `- Railway service: \`${process.env.RAILWAY_SERVICE || "n/a"}\``,
              `- Railway environment: \`${process.env.RAILWAY_ENVIRONMENT || "n/a"}\``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n")

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            })
