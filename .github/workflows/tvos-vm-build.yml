name: TV macOS VM Build
run-name: tvos-${{ inputs.request_id || github.event.pull_request.head.sha }}

"on":
  workflow_dispatch:
    inputs:
      commit:
        description: Exact pushed branch HEAD to build
        required: true
        type: string
      action:
        description: Build, or Jest tests followed by build (not native UI tests)
        required: true
        type: choice
        options: [build, test]
        default: test
      request_id:
        description: Unique ID generated by apps/tv/dev
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "apps/tv/**"
      - "packages/admin-graphql/**"
      - "packages/watch-url-policy/**"
      - "patches/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".nvmrc"
      - ".github/workflows/tvos-vm-build.yml"

permissions:
  contents: read

# Keep a running native build intact. The per-user VM lock also serializes
# dependency installation and Xcode against other repositories using this VM.
concurrency:
  group: tvos-vm-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tvos:
    if: >-
      github.repository == 'JesusFilm/forge' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'tv-vm-build')))
    runs-on: [self-hosted, macOS, ARM64, hybrid-ios]
    timeout-minutes: 90
    steps:
      - name: Validate request
        env:
          BUILD_COMMIT: ${{ inputs.commit || github.event.pull_request.head.sha }}
          BUILD_ACTION: ${{ inputs.action || 'test' }}
          REQUEST_ID: ${{ inputs.request_id }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          [[ "$BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$BUILD_ACTION" == build || "$BUILD_ACTION" == test ]] || exit 2
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$REQUEST_ID" =~ ^[0-9a-f]{32}$ ]] || exit 2
            [[ "$BUILD_COMMIT" == "$WORKFLOW_SHA" ]] || exit 2
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test build helpers
        run: python3 -m unittest discover -s apps/tv/scripts/cloud-vm -p 'test_*.py'
      - name: Build in macOS VM
        id: build
        env:
          HYBRID_BUILDER: local
          TV_BUILD_COMMIT: ${{ inputs.commit || github.event.pull_request.head.sha }}
          BUILD_ACTION: ${{ inputs.action || 'test' }}
          EXPO_TV: "1"
          REACT_NATIVE_OVERRIDE_NIGHTLY_BUILD_VERSION: "0.81.5"
          EXPO_PUBLIC_GRAPHQL_URL: ${{ vars.TV_GRAPHQL_URL || 'https://admin.jesusfilm.org/api/graphql' }}
        shell: bash
        run: ./apps/tv/dev "$BUILD_ACTION" tvos
      - name: Verify build evidence on VM
        id: verify
        env:
          BUILD_RESULTS: ${{ steps.build.outputs.results }}
          BUILD_COMMIT: ${{ inputs.commit || github.event.pull_request.head.sha }}
          BUILD_ACTION: ${{ inputs.action || 'test' }}
        run: python3 apps/tv/scripts/cloud-vm/evidence.py "$BUILD_RESULTS" --commit "$BUILD_COMMIT" --action "$BUILD_ACTION"
      - name: Upload build evidence
        if: always() && steps.build.outputs.results != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tvos-${{ inputs.request_id || github.run_id }}
          path: |
            ${{ steps.build.outputs.results }}/*.log
            ${{ steps.build.outputs.results }}/*.json
            ${{ steps.build.outputs.results }}/JesusFilmWatch-simulator.zip
            ${{ steps.build.outputs.results }}/Results.xcresult/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # The report must follow successful verification AND artifact upload.
      - name: "VM evidence: ${{ steps.verify.outputs.report }}"
        run: echo 'TV VM evidence is available through the GitHub Jobs API.'
