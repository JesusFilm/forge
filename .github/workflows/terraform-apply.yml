name: terraform-apply

permissions:
  contents: read

on:
  push:
    branches:
      - stage
      - main
    paths:
      - "infra/**"

jobs:
  affected-infra:
    runs-on: ubuntu-latest
    outputs:
      aws: ${{ steps.affected.outputs.aws }}
      vercel: ${{ steps.affected.outputs.vercel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - id: affected
        name: Detect infra affected
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi

          if [ -z "$BASE" ]; then
            echo "aws=true" >> "$GITHUB_OUTPUT"
            echo "vercel=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! TURBO_OUT=$(TURBO_SCM_BASE="$BASE" pnpm turbo run lint --filter=@forge/infra --affected --dry-run=json 2>&1); then
            echo "$TURBO_OUT" >&2
            echo "Affected detection failed; forcing apply to avoid false negative." >&2
            echo "aws=true" >> "$GITHUB_OUTPUT"
            echo "vercel=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INFRA_AFFECTED=$(echo "$TURBO_OUT" | jq -r 'try ([.tasks[]?.package] | any(. == "@forge/infra")) catch "true"')
          AWS_PATH_CHANGED=$(
            if git diff --name-only "$BASE"...HEAD | rg -q '^infra/aws/'; then
              echo "true"
            else
              echo "false"
            fi
          )
          VERCEL_PATH_CHANGED=$(
            if git diff --name-only "$BASE"...HEAD | rg -q '^infra/vercel/'; then
              echo "true"
            else
              echo "false"
            fi
          )

          if [ "$INFRA_AFFECTED" = "true" ] && [ "$AWS_PATH_CHANGED" = "true" ]; then
            echo "aws=true" >> "$GITHUB_OUTPUT"
          else
            echo "aws=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$INFRA_AFFECTED" = "true" ] && [ "$VERCEL_PATH_CHANGED" = "true" ]; then
            echo "vercel=true" >> "$GITHUB_OUTPUT"
          else
            echo "vercel=false" >> "$GITHUB_OUTPUT"
          fi

  apply-aws:
    if: needs.affected-infra.outputs.aws == 'true'
    needs: affected-infra
    environment: ${{ github.ref_name == 'main' && 'aws-prod' || 'aws-stage' }}
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Resolve environment and role
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            DEPLOY_ENV="prod"
            echo "backend=backend-config/prod.hcl" >> "$GITHUB_OUTPUT"
            echo "role_arn=arn:aws:iam::031374266475:role/forge-github-actions-terraform-apply-prod" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "stage" ]; then
            DEPLOY_ENV="stage"
            echo "backend=backend-config/stage.hcl" >> "$GITHUB_OUTPUT"
            echo "role_arn=arn:aws:iam::031374266475:role/forge-github-actions-terraform-apply-stage" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
      - name: Validate role ARN is configured
        if: steps.vars.outputs.role_arn == ''
        run: |
          echo "Missing AWS role secret for branch ${GITHUB_REF_NAME}" >&2
          exit 1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.vars.outputs.role_arn }}
          aws-region: us-east-2
      - name: Terraform init
        run: terraform init -backend-config=${{ steps.vars.outputs.backend }} -reconfigure -input=false
      - name: Terraform plan
        run: terraform plan -input=false -var="environment=${{ steps.vars.outputs.deploy_env }}"
      - name: Terraform apply
        id: apply_aws
        continue-on-error: true
        run: |
          set +e
          terraform apply -auto-approve -input=false -var="environment=${{ steps.vars.outputs.deploy_env }}" 2>&1 | tee "apply-aws.txt"
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment commit with AWS apply result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const exitCode = Number("${{ steps.apply_aws.outputs.exit_code || '1' }}");
            const status = exitCode === 0 ? "Applied" : "Apply failed";
            const icon = exitCode === 0 ? "✅" : "❌";
            const env = "${{ steps.vars.outputs.deploy_env }}";
            const runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            let applyOutput = "";
            try {
              applyOutput = fs.readFileSync("infra/aws/apply-aws.txt", "utf8");
            } catch (e) {
              applyOutput = `Unable to read apply output: ${e.message}`;
            }
            const summaryMatch = applyOutput.match(/Apply complete!\s+Resources:\s+(\d+)\s+added,\s+(\d+)\s+changed,\s+(\d+)\s+destroyed\./);
            const changeSummary = summaryMatch
              ? `+${summaryMatch[1]} ~${summaryMatch[2]} -${summaryMatch[3]}`
              : "n/a";
            const maxLen = 45000;
            if (applyOutput.length > maxLen) {
              applyOutput = `${applyOutput.slice(0, maxLen)}\n\n... (truncated)`;
            }
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `<!-- terraform-apply-aws:${env} -->\n## ${icon} Terraform apply (aws/${env}) — ${status}\n**Changes:** ${changeSummary}\n\nRun: ${runUrl}\n\n\`\`\`\n${applyOutput}\n\`\`\``,
            });
      - name: Fail job if apply failed
        if: ${{ steps.apply_aws.outputs.exit_code != '0' }}
        run: exit 1

  apply-vercel:
    if: needs.affected-infra.outputs.vercel == 'true'
    needs: affected-infra
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
    defaults:
      run:
        working-directory: infra/vercel
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Resolve environment
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            DEPLOY_ENV="production"
          elif [ "${GITHUB_REF_NAME}" = "stage" ]; then
            DEPLOY_ENV="preview"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
      - name: Validate Vercel token
        run: |
          if [ -z "$VERCEL_API_TOKEN" ]; then
            echo "Missing VERCEL_API_TOKEN secret" >&2
            exit 1
          fi
      - name: Terraform init
        run: terraform init -input=false
      - name: Terraform plan
        run: terraform plan -input=false -var="environment=${{ steps.vars.outputs.deploy_env }}" -var="vercel_api_token=${VERCEL_API_TOKEN}"
      - name: Terraform apply
        id: apply_vercel
        continue-on-error: true
        run: |
          set +e
          terraform apply -auto-approve -input=false -var="environment=${{ steps.vars.outputs.deploy_env }}" -var="vercel_api_token=${VERCEL_API_TOKEN}" 2>&1 | tee "apply-vercel.txt"
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment commit with Vercel apply result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const exitCode = Number("${{ steps.apply_vercel.outputs.exit_code || '1' }}");
            const status = exitCode === 0 ? "Applied" : "Apply failed";
            const icon = exitCode === 0 ? "✅" : "❌";
            const env = "${{ steps.vars.outputs.deploy_env }}";
            const runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            let applyOutput = "";
            try {
              applyOutput = fs.readFileSync("infra/vercel/apply-vercel.txt", "utf8");
            } catch (e) {
              applyOutput = `Unable to read apply output: ${e.message}`;
            }
            const summaryMatch = applyOutput.match(/Apply complete!\s+Resources:\s+(\d+)\s+added,\s+(\d+)\s+changed,\s+(\d+)\s+destroyed\./);
            const changeSummary = summaryMatch
              ? `+${summaryMatch[1]} ~${summaryMatch[2]} -${summaryMatch[3]}`
              : "n/a";
            const maxLen = 45000;
            if (applyOutput.length > maxLen) {
              applyOutput = `${applyOutput.slice(0, maxLen)}\n\n... (truncated)`;
            }
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `<!-- terraform-apply-vercel:${env} -->\n## ${icon} Terraform apply (vercel/${env}) — ${status}\n**Changes:** ${changeSummary}\n\nRun: ${runUrl}\n\n\`\`\`\n${applyOutput}\n\`\`\``,
            });
      - name: Fail job if apply failed
        if: ${{ steps.apply_vercel.outputs.exit_code != '0' }}
        run: exit 1
