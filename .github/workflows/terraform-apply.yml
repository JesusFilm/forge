name: terraform-apply

on:
  push:
    branches:
      - stage
      - main
    paths:
      - "infra/**"

jobs:
  affected-aws:
    runs-on: ubuntu-latest
    outputs:
      aws: ${{ steps.affected.outputs.aws }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - id: affected
        name: Detect infra/aws affected
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi

          if [ -z "$BASE" ]; then
            echo "aws=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! TURBO_OUT=$(TURBO_SCM_BASE="$BASE" pnpm turbo run lint --filter=@forge/infra --affected --dry-run=json 2>&1); then
            echo "$TURBO_OUT" >&2
            echo "Affected detection failed; forcing apply to avoid false negative." >&2
            echo "aws=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INFRA_AFFECTED=$(echo "$TURBO_OUT" | jq -r 'try ([.tasks[]?.package] | any(. == "@forge/infra")) catch "true"')
          AWS_PATH_CHANGED=$(
            if git diff --name-only "$BASE"...HEAD | rg -q '^infra/aws/'; then
              echo "true"
            else
              echo "false"
            fi
          )

          if [ "$INFRA_AFFECTED" = "true" ] && [ "$AWS_PATH_CHANGED" = "true" ]; then
            echo "aws=true" >> "$GITHUB_OUTPUT"
          else
            echo "aws=false" >> "$GITHUB_OUTPUT"
          fi

  apply-aws:
    if: needs.affected-aws.outputs.aws == 'true'
    needs: affected-aws
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Resolve environment and role
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            DEPLOY_ENV="prod"
            echo "backend=backend-config/prod.hcl" >> "$GITHUB_OUTPUT"
            echo "role_arn=arn:aws:iam::031374266475:role/forge-github-actions-cms-deploy-prod" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "stage" ]; then
            DEPLOY_ENV="stage"
            echo "backend=backend-config/stage.hcl" >> "$GITHUB_OUTPUT"
            echo "role_arn=arn:aws:iam::031374266475:role/forge-github-actions-cms-deploy-stage" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
      - name: Validate role ARN is configured
        if: steps.vars.outputs.role_arn == ''
        run: |
          echo "Missing AWS role secret for branch ${GITHUB_REF_NAME}" >&2
          exit 1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.vars.outputs.role_arn }}
          aws-region: us-east-2
      - name: Terraform init
        run: terraform init -backend-config=${{ steps.vars.outputs.backend }} -reconfigure -input=false
      - name: Terraform plan
        run: terraform plan -input=false -var="environment=${{ steps.vars.outputs.deploy_env }}"
      - name: Terraform apply
        run: terraform apply -auto-approve -input=false -var="environment=${{ steps.vars.outputs.deploy_env }}"
