name: terraform-apply

permissions:
  contents: read

on:
  push:
    branches:
      - stage
      - main
    paths:
      - "infra/**"

jobs:
  affected-infra:
    runs-on: ubuntu-latest
    outputs:
      aws: ${{ steps.filter.outputs.aws }}
      vercel: ${{ steps.filter.outputs.vercel }}
      github: ${{ steps.filter.outputs.github }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            aws:
              - 'infra/aws/**'
            vercel:
              - 'infra/vercel/**'
            github:
              - 'infra/github/**'

  apply-aws:
    if: needs.affected-infra.outputs.aws == 'true'
    needs: affected-infra
    environment: ${{ github.ref_name == 'main' && 'aws-prod' || 'aws-stage' }}
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Resolve environment and backend
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            DEPLOY_ENV="prod"
            echo "backend=backend-config/prod.hcl" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "stage" ]; then
            DEPLOY_ENV="stage"
            echo "backend=backend-config/stage.hcl" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
      - name: Validate role ARN is configured
        run: |
          if [ -z "${{ secrets.TERRAFORM_APPLY_ROLE_ARN }}" ]; then
            echo "Missing TERRAFORM_APPLY_ROLE_ARN for environment (branch ${GITHUB_REF_NAME}). Apply infra/github." >&2
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Terraform init
        run: terraform init -backend-config=../backend-config/shared.hcl -backend-config=${{ steps.vars.outputs.backend }} -reconfigure -input=false
      - name: Terraform apply
        id: apply_aws
        continue-on-error: true
        run: |
          set +e
          terraform apply -no-color -auto-approve -input=false -var="environment=${{ steps.vars.outputs.deploy_env }}" 2>&1 | tee "apply-aws.txt"
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment commit with apply result
        if: always()
        uses: ./.github/actions/terraform-apply-comment
        with:
          stack: aws
          exit_code: ${{ steps.apply_aws.outputs.exit_code || '1' }}
          env: ${{ steps.vars.outputs.deploy_env }}
          output_file: infra/aws/apply-aws.txt
      - name: Fail job if apply failed
        if: ${{ steps.apply_aws.outputs.exit_code != '0' }}
        run: exit 1

  apply-vercel:
    if: needs.affected-infra.outputs.vercel == 'true' && github.ref_name == 'main'
    needs: affected-infra
    environment: vercel-prod
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      AWS_REGION: us-east-2
    defaults:
      run:
        working-directory: infra/vercel
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Resolve environment
        id: vars
        run: echo "deploy_env=production" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials (state-only role)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.TERRAFORM_STATE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Validate Vercel token
        run: |
          if [ -z "$VERCEL_API_TOKEN" ]; then
            echo "Missing VERCEL_API_TOKEN secret" >&2
            exit 1
          fi
      - name: Terraform init
        run: terraform init -backend-config=../backend-config/shared.hcl -backend-config=backend-config.hcl -reconfigure -input=false
      - name: Terraform apply
        id: apply_vercel
        continue-on-error: true
        run: |
          set +e
          terraform apply -no-color -auto-approve -input=false -var="environment=${{ steps.vars.outputs.deploy_env }}" -var="vercel_api_token=${VERCEL_API_TOKEN}" 2>&1 | tee "apply-vercel.txt"
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment commit with apply result
        if: always()
        uses: ./.github/actions/terraform-apply-comment
        with:
          stack: vercel
          exit_code: ${{ steps.apply_vercel.outputs.exit_code || '1' }}
          env: ${{ steps.vars.outputs.deploy_env }}
          output_file: infra/vercel/apply-vercel.txt
      - name: Fail job if apply failed
        if: ${{ steps.apply_vercel.outputs.exit_code != '0' }}
        run: exit 1

  apply-github:
    if: needs.affected-infra.outputs.github == 'true' && github.ref_name == 'main'
    needs: affected-infra
    environment: github-prod
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/github
    env:
      AWS_REGION: us-east-2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure AWS credentials (state-only role)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.TERRAFORM_STATE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Terraform init
        run: terraform init -backend-config=../backend-config/shared.hcl -backend-config=backend-config.hcl -reconfigure -input=false
      - name: Terraform apply
        id: apply_github
        continue-on-error: true
        run: |
          set +e
          terraform apply -no-color -auto-approve -input=false 2>&1 | tee "apply-github.txt"
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment commit with apply result
        if: always()
        uses: ./.github/actions/terraform-apply-comment
        with:
          stack: github
          exit_code: ${{ steps.apply_github.outputs.exit_code || '1' }}
          env: prod
          output_file: infra/github/apply-github.txt
      - name: Fail job if apply failed
        if: ${{ steps.apply_github.outputs.exit_code != '0' }}
        run: exit 1
