name: forge-pages

on:
  pull_request:
    paths:
      - ".github/workflows/rag-pages.yml"
      - "docs/pages/**"
      - "apps/rag/dashboard/site/rag-status/**"
      - "apps/rag/scripts/assemble-pages.ts"
      - "apps/rag/tests/pages-assembly.test.ts"
      - "apps/rag/package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rag-pages.yml"
      - "docs/pages/**"
      - "apps/rag/dashboard/site/rag-status/**"
      - "apps/rag/scripts/assemble-pages.ts"
      - "apps/rag/tests/pages-assembly.test.ts"
      - "apps/rag/package.json"

permissions:
  contents: read

concurrency:
  group: forge-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.assemble.outputs.digest }}
    steps:
      - name: Checkout the reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify committed RAG dashboard
        run: pnpm --filter @forge/rag dashboard:verify
      - name: Test the Pages publication boundary
        run: pnpm --filter @forge/rag exec vitest run tests/pages-assembly.test.ts
      - name: Assemble the complete declared site
        id: assemble
        shell: bash
        run: |
          output="$(mktemp -d)/site"
          pnpm --filter @forge/rag pages:assemble -- "$output" | tee pages-assembly.txt
          digest="$(sed -n 's/.*(\(sha256:[0-9a-f]\{64\}\)).*/\1/p' pages-assembly.txt)"
          test -n "$digest"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ steps.assemble.outputs.path }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Record published provenance
        env:
          ARTIFACT_DIGEST: ${{ needs.verify.outputs.digest }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "### Forge Pages published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`${ARTIFACT_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
