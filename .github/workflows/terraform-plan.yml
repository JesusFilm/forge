name: terraform-plan

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  pull_request_review:
    types:
      - submitted

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra_changed: ${{ steps.detect.outputs.infra_changed }}
      approved: ${{ steps.detect.outputs.approved }}
      aws: ${{ steps.detect.outputs.aws }}
      vercel: ${{ steps.detect.outputs.vercel }}
      github: ${{ steps.detect.outputs.github }}
      shared_backend: ${{ steps.detect.outputs.shared_backend }}
    steps:
      - name: Detect infra changes and approval state
        id: detect
        uses: actions/github-script@v8
        with:
          script: |
            const pullNumber = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const infraChanged = files.some((f) => f.filename.startsWith("infra/"));
            const awsChanged = files.some((f) => f.filename.startsWith("infra/aws/"));
            const vercelChanged = files.some((f) => f.filename.startsWith("infra/vercel/"));
            const githubChanged = files.some((f) => f.filename.startsWith("infra/github/"));
            const sharedBackendChanged = files.some((f) => f.filename.startsWith("infra/backend-config/"));

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const latestReviewByUser = new Map();
            for (const review of reviews) {
              if (!review.user?.login) continue;
              latestReviewByUser.set(review.user.login, review.state);
            }
            const approvalBypassed =
              context.eventName === "pull_request" && context.actor === "tataihono";
            const approved =
              approvalBypassed ||
              [...latestReviewByUser.values()].some((state) => state === "APPROVED");

            core.setOutput("infra_changed", infraChanged ? "true" : "false");
            core.setOutput("approved", approved ? "true" : "false");
            core.setOutput("aws", awsChanged ? "true" : "false");
            core.setOutput("vercel", vercelChanged ? "true" : "false");
            core.setOutput("github", githubChanged ? "true" : "false");
            core.setOutput("shared_backend", sharedBackendChanged ? "true" : "false");

  plan-aws:
    if: ${{ needs.changes.outputs.infra_changed == 'true' && needs.changes.outputs.approved == 'true' && (needs.changes.outputs.aws == 'true' || needs.changes.outputs.shared_backend == 'true') }}
    needs: changes
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment == 'prod' && 'aws-plan-prod' || 'aws-plan-stage' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    strategy:
      matrix:
        environment: [stage, prod]
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Resolve backend
        id: vars
        run: |
          if [ "${{ matrix.environment }}" = "prod" ]; then
            echo "backend=backend-config/prod.hcl" >> "$GITHUB_OUTPUT"
          else
            echo "backend=backend-config/stage.hcl" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate role ARN is configured
        run: |
          if [ -z "${{ secrets.TERRAFORM_ROLE_ARN }}" ]; then
            echo "Missing TERRAFORM_ROLE_ARN for aws-plan-${{ matrix.environment }}. Apply infra/github." >&2
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
          aws-region: us-east-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.11.0
      - name: Prepare job log
        run: printf "" > job-log.txt
      - name: Format check
        run: |
          echo "=== Format check ===" >> job-log.txt
          terraform fmt -check -recursive 2>&1 | tee -a job-log.txt
          exit ${PIPESTATUS[0]}
      - name: Init
        run: |
          echo "=== Init ===" >> job-log.txt
          terraform init -backend-config=../backend-config/shared.hcl -backend-config=${{ steps.vars.outputs.backend }} -reconfigure -input=false 2>&1 | tee -a job-log.txt
          exit ${PIPESTATUS[0]}
      - name: Validate
        run: |
          echo "=== Validate ===" >> job-log.txt
          terraform validate 2>&1 | tee -a job-log.txt
          exit ${PIPESTATUS[0]}
      - name: Plan ${{ matrix.environment }}
        id: plan
        continue-on-error: true
        run: |
          set +e
          terraform plan -no-color -lock=false -input=false -detailed-exitcode -var="environment=${{ matrix.environment }}" 2>&1 | tee "plan-${{ matrix.environment }}.txt"
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment PR with plan ${{ matrix.environment }}
        if: always()
        continue-on-error: true
        uses: ./.github/actions/terraform-plan-comment
        with:
          stack: aws
          env: ${{ matrix.environment }}
          exit_code: ${{ steps.plan.outputs.exit_code || '1' }}
          output_file: infra/aws/plan-${{ matrix.environment }}.txt
          fallback_log: infra/aws/job-log.txt
      - name: Fail job if plan errored
        if: ${{ steps.plan.outputs.exit_code == '1' }}
        run: |
          echo "Terraform plan failed for ${{ matrix.environment }}." >&2
          exit 1

  plan-vercel:
    if: ${{ needs.changes.outputs.infra_changed == 'true' && needs.changes.outputs.approved == 'true' && (needs.changes.outputs.vercel == 'true' || needs.changes.outputs.shared_backend == 'true') }}
    needs: changes
    runs-on: ubuntu-latest
    environment: vercel-plan
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: infra/vercel
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate role ARN is configured
        run: |
          if [ -z "${{ secrets.TERRAFORM_ROLE_ARN }}" ]; then
            echo "Missing TERRAFORM_ROLE_ARN for vercel-plan. Apply infra/github." >&2
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
          aws-region: us-east-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.11.0
      - name: Prepare job log
        run: printf "" > job-log.txt
      - name: Format check
        run: |
          echo "=== Format check ===" >> job-log.txt
          terraform fmt -check -recursive 2>&1 | tee -a job-log.txt
          exit ${PIPESTATUS[0]}
      - name: Init
        run: |
          echo "=== Init ===" >> job-log.txt
          terraform init -backend-config=../backend-config/shared.hcl -backend-config=backend-config.hcl -reconfigure -input=false 2>&1 | tee -a job-log.txt
          exit ${PIPESTATUS[0]}
      - name: Validate
        run: |
          echo "=== Validate ===" >> job-log.txt
          terraform validate 2>&1 | tee -a job-log.txt
          exit ${PIPESTATUS[0]}
      - name: Plan
        id: plan_vercel
        continue-on-error: true
        run: |
          set +e
          terraform plan -no-color -lock=false -input=false -detailed-exitcode 2>&1 | tee "plan-vercel.txt"
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment PR with plan vercel
        if: always()
        continue-on-error: true
        uses: ./.github/actions/terraform-plan-comment
        with:
          stack: vercel
          env: ""
          exit_code: ${{ steps.plan_vercel.outputs.exit_code || '1' }}
          output_file: infra/vercel/plan-vercel.txt
          fallback_log: infra/vercel/job-log.txt
      - name: Fail job if plan errored
        if: ${{ steps.plan_vercel.outputs.exit_code == '1' }}
        run: |
          echo "Terraform plan failed for vercel." >&2
          exit 1

  plan-github:
    if: ${{ needs.changes.outputs.infra_changed == 'true' && needs.changes.outputs.approved == 'true' && (needs.changes.outputs.github == 'true' || needs.changes.outputs.shared_backend == 'true') }}
    needs: changes
    runs-on: ubuntu-latest
    environment: github-plan
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: infra/github
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate role ARN is configured
        run: |
          if [ -z "${{ secrets.TERRAFORM_ROLE_ARN }}" ]; then
            echo "Missing TERRAFORM_ROLE_ARN for github-plan. Apply infra/github." >&2
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
          aws-region: us-east-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.11.0
      - name: Prepare job log
        run: printf "" > job-log.txt
      - name: Format check
        run: |
          echo "=== Format check ===" >> job-log.txt
          terraform fmt -check -recursive 2>&1 | tee -a job-log.txt
          exit ${PIPESTATUS[0]}
      - name: Init
        run: |
          echo "=== Init ===" >> job-log.txt
          terraform init -backend-config=../backend-config/shared.hcl -backend-config=backend-config.hcl -reconfigure -input=false 2>&1 | tee -a job-log.txt
          exit ${PIPESTATUS[0]}
      - name: Validate
        run: |
          echo "=== Validate ===" >> job-log.txt
          terraform validate 2>&1 | tee -a job-log.txt
          exit ${PIPESTATUS[0]}
      - name: Plan
        id: plan_github
        continue-on-error: true
        run: |
          set +e
          terraform plan -no-color -lock=false -input=false -detailed-exitcode 2>&1 | tee "plan-github.txt"
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment PR with plan github
        if: always()
        continue-on-error: true
        uses: ./.github/actions/terraform-plan-comment
        with:
          stack: github
          env: prod
          exit_code: ${{ steps.plan_github.outputs.exit_code || '1' }}
          output_file: infra/github/plan-github.txt
          fallback_log: infra/github/job-log.txt
      - name: Fail job if plan errored
        if: ${{ steps.plan_github.outputs.exit_code == '1' }}
        run: |
          echo "Terraform plan failed for github." >&2
          exit 1
