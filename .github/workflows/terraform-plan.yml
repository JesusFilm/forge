name: terraform-plan

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  pull_request_review:
    types:
      - submitted

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra_changed: ${{ steps.detect.outputs.infra_changed }}
      approved: ${{ steps.detect.outputs.approved }}
      aws: ${{ steps.detect.outputs.aws }}
      vercel: ${{ steps.detect.outputs.vercel }}
      github: ${{ steps.detect.outputs.github }}
    steps:
      - name: Detect infra changes and approval state
        id: detect
        uses: actions/github-script@v8
        with:
          script: |
            const pullNumber = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const infraChanged = files.some((f) => f.filename.startsWith("infra/"));
            const awsChanged = files.some((f) => f.filename.startsWith("infra/aws/"));
            const vercelChanged = files.some((f) => f.filename.startsWith("infra/vercel/"));
            const githubChanged = files.some((f) => f.filename.startsWith("infra/github/"));

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const latestReviewByUser = new Map();
            for (const review of reviews) {
              if (!review.user?.login) continue;
              latestReviewByUser.set(review.user.login, review.state);
            }
            const approved = [...latestReviewByUser.values()].some((state) => state === "APPROVED");

            core.setOutput("infra_changed", infraChanged ? "true" : "false");
            core.setOutput("approved", approved ? "true" : "false");
            core.setOutput("aws", awsChanged ? "true" : "false");
            core.setOutput("vercel", vercelChanged ? "true" : "false");
            core.setOutput("github", githubChanged ? "true" : "false");

  plan-aws:
    if: ${{ needs.changes.outputs.infra_changed == 'true' && needs.changes.outputs.approved == 'true' && needs.changes.outputs.aws == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    strategy:
      matrix:
        environment: [stage, prod]
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init modules
        run: terraform init -backend=false -reconfigure -input=false
      - name: Validate
        run: terraform validate
      - name: Resolve backend and role
        id: vars
        env:
          ROLE_ARN: ${{ matrix.environment == 'prod' && secrets.PROD_TERRAFORM_PLAN_ROLE_ARN || secrets.STAGE_TERRAFORM_PLAN_ROLE_ARN }}
        run: |
          if [ "${{ matrix.environment }}" = "prod" ]; then
            echo "backend=backend-config/prod.hcl" >> "$GITHUB_OUTPUT"
          else
            echo "backend=backend-config/stage.hcl" >> "$GITHUB_OUTPUT"
          fi
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
      - name: Validate role ARN is configured
        run: |
          if [ -z "${{ steps.vars.outputs.role_arn }}" ]; then
            echo "Missing plan role ARN for environment ${{ matrix.environment }}. Apply infra/github." >&2
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.vars.outputs.role_arn }}
          aws-region: us-east-2
      - name: Plan ${{ matrix.environment }}
        id: plan
        continue-on-error: true
        run: |
          set +e
          terraform init -backend-config=../backend-config/shared.hcl -backend-config=${{ steps.vars.outputs.backend }} -reconfigure -input=false
          terraform plan -no-color -lock=false -input=false -detailed-exitcode -var="environment=${{ matrix.environment }}" > "plan-${{ matrix.environment }}.txt" 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment PR with plan ${{ matrix.environment }}
        if: always()
        continue-on-error: true
        uses: ./.github/actions/terraform-plan-comment
        with:
          stack: aws
          env: ${{ matrix.environment }}
          exit_code: ${{ steps.plan.outputs.exit_code || '1' }}
          output_file: infra/aws/plan-${{ matrix.environment }}.txt
      - name: Fail job if plan errored
        if: ${{ steps.plan.outputs.exit_code == '1' }}
        run: |
          echo "Terraform plan failed for ${{ matrix.environment }}." >&2
          exit 1

  plan-vercel:
    if: ${{ needs.changes.outputs.infra_changed == 'true' && needs.changes.outputs.approved == 'true' && needs.changes.outputs.vercel == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra/vercel
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init
        run: |
          attempts=0
          until [ "$attempts" -ge 3 ]
          do
            terraform init -backend=false -input=false && break
            attempts=$((attempts + 1))
            sleep $((attempts * 5))
          done
          if [ "$attempts" -ge 3 ]; then
            echo "terraform init failed after retries" >&2
            exit 1
          fi
      - name: Validate
        run: terraform validate
      - name: Plan
        id: plan_vercel
        continue-on-error: true
        run: |
          set +e
          terraform plan -no-color -lock=false -input=false -detailed-exitcode -var="environment=preview" -var="vercel_api_token=dummy" > "plan-vercel.txt" 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment PR with plan vercel
        if: always()
        continue-on-error: true
        uses: ./.github/actions/terraform-plan-comment
        with:
          stack: vercel
          env: ""
          exit_code: ${{ steps.plan_vercel.outputs.exit_code || '1' }}
          output_file: infra/vercel/plan-vercel.txt
      - name: Fail job if plan errored
        if: ${{ steps.plan_vercel.outputs.exit_code == '1' }}
        run: |
          echo "Terraform plan failed for vercel." >&2
          exit 1

  plan-github:
    if: ${{ needs.changes.outputs.infra_changed == 'true' && needs.changes.outputs.approved == 'true' && needs.changes.outputs.github == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    environment: github-prod
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: infra/github
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure AWS credentials (state read for init)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.TERRAFORM_STATE_ROLE_ARN }}
          aws-region: us-east-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init
        run: terraform init -backend-config=../backend-config/shared.hcl -backend-config=backend-config.hcl -reconfigure -input=false
      - name: Validate
        run: terraform validate
      - name: Plan
        id: plan_github
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          terraform plan -no-color -lock=false -input=false -detailed-exitcode \
            -var="github_token=$GITHUB_TOKEN" > "plan-github.txt" 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment PR with plan github
        if: always()
        continue-on-error: true
        uses: ./.github/actions/terraform-plan-comment
        with:
          stack: github
          env: prod
          exit_code: ${{ steps.plan_github.outputs.exit_code || '1' }}
          output_file: infra/github/plan-github.txt
      - name: Fail job if plan errored
        if: ${{ steps.plan_github.outputs.exit_code == '1' }}
        run: |
          echo "Terraform plan failed for github." >&2
          exit 1
