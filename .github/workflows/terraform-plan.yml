name: terraform-plan

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  pull_request:
    paths:
      - "infra/**"

jobs:
  plan-aws:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    strategy:
      matrix:
        environment: [stage, prod]
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Resolve environment and role
        id: vars
        run: |
          if [ "${{ matrix.environment }}" = "prod" ]; then
            echo "backend=backend-config/prod.hcl" >> "$GITHUB_OUTPUT"
            echo "role_arn=arn:aws:iam::031374266475:role/forge-github-actions-cms-deploy-prod" >> "$GITHUB_OUTPUT"
          else
            echo "backend=backend-config/stage.hcl" >> "$GITHUB_OUTPUT"
            echo "role_arn=arn:aws:iam::031374266475:role/forge-github-actions-cms-deploy-stage" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.vars.outputs.role_arn }}
          aws-region: us-east-2
      - name: Init
        run: terraform init -backend-config=${{ steps.vars.outputs.backend }} -reconfigure -input=false
      - name: Validate
        run: terraform validate
      - name: Plan ${{ matrix.environment }}
        id: plan
        continue-on-error: true
        run: |
          set +e
          terraform plan -no-color -lock=false -input=false -detailed-exitcode -var="environment=${{ matrix.environment }}" > "plan-${{ matrix.environment }}.txt" 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment PR with plan ${{ matrix.environment }}
        if: always()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            if (context.payload.pull_request?.head?.repo?.fork) {
              core.info("Skipping PR comment for forked repository context.");
              return;
            }
            const envName = "${{ matrix.environment }}";
            const marker = `<!-- terraform-plan-aws:${envName} -->`;
            const planPath = `infra/aws/plan-${envName}.txt`;
            const exitCode = Number("${{ steps.plan.outputs.exit_code || '1' }}");
            const status =
              exitCode === 0 ? "No changes" :
              exitCode === 2 ? "Changes detected" :
              "Plan failed";
            const icon =
              exitCode === 0 ? "✅" :
              exitCode === 2 ? "🟨" :
              "❌";

            let plan = "";
            try {
              plan = fs.readFileSync(planPath, "utf8");
            } catch (e) {
              plan = `Unable to read ${planPath}: ${e.message}`;
            }

            const maxLen = 45000;
            const truncated = plan.length > maxLen;
            if (truncated) {
              plan = `${plan.slice(0, maxLen)}\n\n... (truncated)`;
            }

            const body = `${marker}
            ## ${icon} Terraform plan (aws/${envName}) — ${status}

            \`\`\`
            ${plan}
            \`\`\`
            `;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });

              const existing = comments.find((c) =>
                c.user?.type === "Bot" && c.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (error) {
              if (error.status === 403) {
                core.warning("Skipping PR plan comment: token has no write access in this context.");
                return;
              }
              throw error;
            }
      - name: Fail job if plan errored
        if: ${{ steps.plan.outputs.exit_code == '1' }}
        run: |
          echo "Terraform plan failed for ${{ matrix.environment }}." >&2
          exit 1

  plan-vercel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/vercel
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate
      - name: Plan
        run: terraform plan -lock=false -input=false -var="environment=preview" -var="vercel_api_token=dummy" || true
