name: terraform-plan

on:
  pull_request:
    paths:
      - "infra/**"

jobs:
  plan-aws:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate
      - name: Plan
        run: terraform plan -lock=false -input=false -var="environment=preview" || true

  plan-vercel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/vercel
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate
      - name: Plan
        run: terraform plan -lock=false -input=false -var="environment=preview" -var="vercel_api_token=dummy" || true
