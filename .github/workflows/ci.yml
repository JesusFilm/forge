name: forge-ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  affected:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.affected.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - id: affected
        name: Detect affected services
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          TURBO_OUT=$(TURBO_SCM_BASE="$BASE" pnpm turbo ls --affected --output=json 2>/dev/null || echo "[]")
          SERVICES=$(echo "$TURBO_OUT" | jq -c '
            if type == "array" then
              [ .[] | if type == "object" then (.name // .package // empty) else . end ]
            elif type == "object" and (.packages? | type == "object") and (.packages.items? | type == "array") then
              [ .packages.items[] | .name // .package // empty ]
            elif type == "object" and (.packages? | type == "array") then
              [ .packages[] | if type == "object" then (.name // .package // empty) else . end ]
            elif type == "object" and (.tasks? | type == "array") then
              [ .tasks[] | if type == "object" then (.name // .package // empty) else . end ]
            else
              []
            end
            | map(select(type == "string" and startswith("@forge/")))
            | unique
          ' 2>/dev/null || echo "[]")
          echo "Affected services: $SERVICES"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  admin-graphql-generate:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.services != '[]' && contains(fromJson(needs.affected.outputs.services), '@forge/admin-graphql')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated code
        run: pnpm turbo run generate --filter=@forge/admin-graphql && git diff --exit-code packages/admin-graphql/src/admin-graphql-env.d.ts

  admin-schema-drift:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.services != '[]' && contains(fromJson(needs.affected.outputs.services), '@forge/admin')
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify schema artifact
        run: pnpm turbo run schema:print --filter=@forge/admin && git diff --exit-code apps/admin/schema.graphql
      - name: Apply Admin database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm --filter @forge/admin exec prisma migrate deploy
      - name: Exercise Watch database integration against PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          WATCH_SEARCH_DB_TEST: "1"
        run: pnpm --filter @forge/admin test -- src/services/typesense-watch-search-candidate-trigger-migration.db.test.ts src/services/search-watchability.db.test.ts

  auth-postgres-integration:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.services != '[]' && contains(fromJson(needs.affected.outputs.services), '@forge/auth')
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Auth database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm --filter @forge/auth exec prisma migrate deploy
      - name: Seed Auth first-party applications
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm --filter @forge/auth seed:first-party-apps
      - name: Exercise Auth integration against PostgreSQL
        env:
          AUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          BETTER_AUTH_SECRET: auth-integration-secret-not-for-production
        run: pnpm --filter @forge/auth test -- src/services/better-auth-upgrade.integration.test.ts src/services/device-grant.integration.test.ts src/services/changelog-oauth-grant.integration.test.ts --no-file-parallelism

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check format
        run: pnpm run format:check

  patched-deps-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Test the patched-deps guard logic
        run: node scripts/check-patched-deps.test.mjs
      # Dependency-free guard: fails fast when a pnpm.patchedDependencies key no
      # longer matches the installed version (pnpm only warns), so an orphaned
      # tvOS patch can't silently re-break the native build. No install needed.
      - name: Check pnpm patch keys match installed versions
        run: node scripts/check-patched-deps.mjs

  hidden-roadmap-lanes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify docs-only roadmap lanes stay hidden
        run: |
          pnpm exec tsx --test scripts/check-hidden-roadmap-lanes.test.ts
          pnpm exec tsx scripts/check-hidden-roadmap-lanes.ts

  experiment-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Always reports a status so it can be required without path-filtered
      # workflows leaving unrelated PRs pending. No install or paid eval runs.
      - name: Test experiment-ledger guard logic
        run: node scripts/check-seeker-experiment-ledger.test.mjs
      - name: Enforce append-only Seeker experiment history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-seeker-experiment-ledger.mjs --base="$BASE_SHA" --head="$HEAD_SHA"

  lint:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.affected.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Load CI env files
        run: |
          for f in $(find apps packages -name '.env.ci' 2>/dev/null); do
            cp "$f" "$(dirname "$f")/.env"
          done
      - name: Lint package
        run: pnpm --filter "${{ matrix.service }}" run --if-present lint --max-warnings=0
      - name: Typecheck
        run: pnpm --filter "${{ matrix.service }}" run --if-present typecheck

  test:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.affected.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Load CI env files
        run: |
          for f in $(find apps packages -name '.env.ci' 2>/dev/null); do
            cp "$f" "$(dirname "$f")/.env"
          done
      - name: Install PostgreSQL 18 client for Admin snapshot contracts
        if: matrix.service == '@forge/admin'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          source /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          pg_dump --version | grep -F 'PostgreSQL) 18.'
          pg_restore --version | grep -F 'PostgreSQL) 18.'
          psql --version | grep -F 'PostgreSQL) 18.'
      - name: Test package
        run: pnpm --filter "${{ matrix.service }}" run --if-present test

  expo-doctor:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.services != '[]' && contains(fromJson(needs.affected.outputs.services), '@forge/mobile')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Expo Doctor
        working-directory: apps/mobile
        run: npx expo-doctor@1.20.1

  build:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.affected.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Load CI env files
        run: |
          for f in $(find apps packages -name '.env.ci' 2>/dev/null); do
            cp "$f" "$(dirname "$f")/.env"
          done
          if [ "${{ matrix.service }}" = "@forge/admin" ]; then
            cat apps/admin/.env.ci >> "$GITHUB_ENV"
          fi
      - name: Build package
        run: pnpm --filter "${{ matrix.service }}" run --if-present build

  # One always-reporting job so `main` can require a single stable check name.
  #
  # A per-package matrix leg cannot be required directly: `affected` only
  # expands the packages a PR touches, so `test (@forge/mobile)` never reports
  # on an admin-only PR, and a required check that never reports blocks that PR
  # forever. This job always runs, always reports under one name, and fails if
  # any needed job failed or was cancelled.
  #
  # `skipped` is a PASS on purpose. Conditional jobs skip legitimately —
  # commit-lint on a push to main or a dependabot PR, and every `affected`-gated
  # job when its package is untouched.
  ci-gate:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - commit-lint
      - affected
      - admin-graphql-generate
      - admin-schema-drift
      - format
      - patched-deps-guard
      - hidden-roadmap-lanes
      - experiment-ledger
      - lint
      - test
      - expo-doctor
      - build
    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          bad=$(echo "$NEEDS" | jq -r \
            'to_entries
             | map(select(.value.result == "failure" or .value.result == "cancelled"))
             | map(.key) | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failed. Jobs not green: $bad"
            exit 1
          fi
          echo "CI gate passed."
