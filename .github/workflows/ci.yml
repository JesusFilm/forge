name: forge-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm contracts:validate

  generated-code:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm check:generated

  build-and-test:
    runs-on: ubuntu-latest
    needs: generated-code
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm lint -- --max-warnings=0
      - run: pnpm test
      - run: pnpm build

  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'mobile/ios/**'
            android:
              - 'mobile/android/**'
            terraform:
              - 'infra/**'

  lint-ios:
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        working-directory: mobile/ios
        run: swiftlint --strict

  lint-android:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run ktlint
        working-directory: mobile/android
        run: gradle ktlintCheck

  lint-terraform:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: terraform-linters/setup-tflint@v4
      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/
      - name: Init AWS module
        working-directory: infra/aws
        run: terraform init -backend=false
      - name: Validate AWS
        working-directory: infra/aws
        run: terraform validate
      - name: Init Vercel module
        working-directory: infra/vercel
        run: terraform init -backend=false
      - name: Validate Vercel
        working-directory: infra/vercel
        run: terraform validate
      - name: TFLint init
        working-directory: infra
        run: tflint --init --config=.tflint.hcl
      - name: TFLint AWS
        working-directory: infra/aws
        run: tflint --config=${{ github.workspace }}/infra/.tflint.hcl --recursive
      - name: TFLint Vercel
        working-directory: infra/vercel
        run: tflint --config=${{ github.workspace }}/infra/.tflint.hcl
