name: forge-ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  affected:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.affected.outputs.mobile }}
      web: ${{ steps.affected.outputs.web }}
      cms: ${{ steps.affected.outputs.cms }}
      graphql: ${{ steps.affected.outputs.graphql }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - id: affected
        name: Detect affected packages
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          TURBO_OUT=$(TURBO_SCM_BASE="$BASE" pnpm turbo run lint --affected --dry-run=json 2>&1) || true
          AFFECTED=$(echo "$TURBO_OUT" | jq -r '[.tasks[].package] | unique | .[]' 2>&1 || echo "")
          echo "mobile=$(echo "$AFFECTED" | grep -q "@forge/mobile" && echo "true" || echo "false")" >> $GITHUB_OUTPUT
          echo "web=$(echo "$AFFECTED" | grep -q "@forge/web" && echo "true" || echo "false")" >> $GITHUB_OUTPUT
          echo "cms=$(echo "$AFFECTED" | grep -q "@forge/cms" && echo "true" || echo "false")" >> $GITHUB_OUTPUT
          echo "graphql=$(echo "$AFFECTED" | grep -q "@forge/graphql" && echo "true" || echo "false")" >> $GITHUB_OUTPUT

  generated-code:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.cms == 'true' || needs.affected.outputs.graphql == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated code
        run: pnpm check:generated

  build-and-test:
    runs-on: ubuntu-latest
    needs: generated-code
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Load CI env files
        run: |
          for f in $(find apps packages -name '.env.ci' 2>/dev/null); do
            cp "$f" "$(dirname "$f")/.env"
          done
      - name: Check format
        run: pnpm run format:check
      - name: Lint JS/TS
        run: pnpm turbo run lint --filter='!@forge/mobile' -- --max-warnings=0
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  lint-mobile:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.mobile == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @forge/mobile run lint -- --max-warnings=0
      - name: Typecheck
        run: pnpm --filter @forge/mobile run typecheck
      - name: Build
        run: pnpm --filter @forge/mobile run build
