name: forge-ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  affected:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.affected.outputs.mobile }}
      web: ${{ steps.affected.outputs.web }}
      cms: ${{ steps.affected.outputs.cms }}
      graphql: ${{ steps.affected.outputs.graphql }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - id: affected
        name: Detect affected packages
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          TURBO_OUT=$(TURBO_SCM_BASE="$BASE" pnpm turbo run lint --affected --dry-run=json 2>&1) || true
          AFFECTED=$(echo "$TURBO_OUT" | jq -r '[.tasks[].package] | unique | .[]' 2>&1 || echo "")
          echo "mobile=$(echo "$AFFECTED" | grep -q "@forge/mobile" && echo "true" || echo "false")" >> $GITHUB_OUTPUT
          echo "web=$(echo "$AFFECTED" | grep -q "@forge/web" && echo "true" || echo "false")" >> $GITHUB_OUTPUT
          echo "cms=$(echo "$AFFECTED" | grep -q "@forge/cms" && echo "true" || echo "false")" >> $GITHUB_OUTPUT
          echo "graphql=$(echo "$AFFECTED" | grep -q "@forge/graphql" && echo "true" || echo "false")" >> $GITHUB_OUTPUT

  generated-code:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.cms == 'true' || needs.affected.outputs.graphql == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated code
        run: pnpm check:generated

  format:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.mobile == 'true' || needs.affected.outputs.web == 'true' || needs.affected.outputs.cms == 'true' || needs.affected.outputs.graphql == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check format
        run: pnpm run format:check

  lint-affected:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.mobile == 'true' || needs.affected.outputs.web == 'true' || needs.affected.outputs.cms == 'true' || needs.affected.outputs.graphql == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: mobile
            package: "@forge/mobile"
            run_typecheck: true
          - key: web
            package: "@forge/web"
            run_typecheck: false
          - key: cms
            package: "@forge/cms"
            run_typecheck: false
          - key: graphql
            package: "@forge/graphql"
            run_typecheck: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Load CI env files
        run: |
          for f in $(find apps packages -name '.env.ci' 2>/dev/null); do
            cp "$f" "$(dirname "$f")/.env"
          done
      - name: Lint package
        if: |
          (matrix.key == 'mobile' && needs.affected.outputs.mobile == 'true') ||
          (matrix.key == 'web' && needs.affected.outputs.web == 'true') ||
          (matrix.key == 'cms' && needs.affected.outputs.cms == 'true') ||
          (matrix.key == 'graphql' && needs.affected.outputs.graphql == 'true')
        run: pnpm --filter ${{ matrix.package }} run lint -- --max-warnings=0
      - name: Typecheck mobile
        if: matrix.run_typecheck && needs.affected.outputs.mobile == 'true'
        run: pnpm --filter ${{ matrix.package }} run typecheck

  test-affected:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.mobile == 'true' || needs.affected.outputs.web == 'true' || needs.affected.outputs.cms == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: mobile
            package: "@forge/mobile"
          - key: web
            package: "@forge/web"
          - key: cms
            package: "@forge/cms"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Load CI env files
        run: |
          for f in $(find apps packages -name '.env.ci' 2>/dev/null); do
            cp "$f" "$(dirname "$f")/.env"
          done
      - name: Test package
        if: |
          (matrix.key == 'mobile' && needs.affected.outputs.mobile == 'true') ||
          (matrix.key == 'web' && needs.affected.outputs.web == 'true') ||
          (matrix.key == 'cms' && needs.affected.outputs.cms == 'true')
        run: pnpm --filter ${{ matrix.package }} run test

  build-affected:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.mobile == 'true' || needs.affected.outputs.web == 'true' || needs.affected.outputs.cms == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: mobile
            package: "@forge/mobile"
          - key: web
            package: "@forge/web"
          - key: cms
            package: "@forge/cms"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Load CI env files
        run: |
          for f in $(find apps packages -name '.env.ci' 2>/dev/null); do
            cp "$f" "$(dirname "$f")/.env"
          done
      - name: Build package
        if: |
          (matrix.key == 'mobile' && needs.affected.outputs.mobile == 'true') ||
          (matrix.key == 'web' && needs.affected.outputs.web == 'true') ||
          (matrix.key == 'cms' && needs.affected.outputs.cms == 'true')
        run: pnpm --filter ${{ matrix.package }} run build
