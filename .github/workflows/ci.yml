name: forge-ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  affected:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.affected.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - id: affected
        name: Detect affected services
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          TURBO_OUT=$(TURBO_SCM_BASE="$BASE" pnpm turbo run lint --affected --dry-run=json 2>&1) || true
          AFFECTED=$(echo "$TURBO_OUT" | jq -r '[.tasks[].package] | unique | .[]' 2>/dev/null || echo "")
          services=()
          if echo "$AFFECTED" | grep -q "^@forge/mobile$"; then services+=("mobile"); fi
          if echo "$AFFECTED" | grep -q "^@forge/web$"; then services+=("web"); fi
          if echo "$AFFECTED" | grep -q "^@forge/cms$"; then services+=("cms"); fi
          if echo "$AFFECTED" | grep -q "^@forge/graphql$"; then services+=("graphql"); fi
          if [ ${#services[@]} -eq 0 ]; then
            echo "services=[]" >> "$GITHUB_OUTPUT"
          else
            echo "services=$(jq -cn '$ARGS.positional | unique' --args "${services[@]}")" >> "$GITHUB_OUTPUT"
          fi

  generated-code:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.services != '[]' && (contains(fromJson(needs.affected.outputs.services), 'cms') || contains(fromJson(needs.affected.outputs.services), 'graphql'))
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated code
        run: pnpm check:generated

  format:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.services != '[]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check format
        run: pnpm run format:check

  lint-affected:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.affected.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Load CI env files
        run: |
          for f in $(find apps packages -name '.env.ci' 2>/dev/null); do
            cp "$f" "$(dirname "$f")/.env"
          done
      - name: Lint package
        run: pnpm --filter @forge/${{ matrix.service }} run lint -- --max-warnings=0
      - name: Typecheck mobile
        if: matrix.service == 'mobile'
        run: pnpm --filter @forge/${{ matrix.service }} run typecheck

  test-affected:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.affected.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Load CI env files
        run: |
          for f in $(find apps packages -name '.env.ci' 2>/dev/null); do
            cp "$f" "$(dirname "$f")/.env"
          done
      - name: Test package
        if: matrix.service != 'graphql'
        run: pnpm --filter @forge/${{ matrix.service }} run test

  build-affected:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.affected.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Load CI env files
        run: |
          for f in $(find apps packages -name '.env.ci' 2>/dev/null); do
            cp "$f" "$(dirname "$f")/.env"
          done
      - name: Build package
        if: matrix.service != 'graphql'
        run: pnpm --filter @forge/${{ matrix.service }} run build
