name: forge-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:validate

  affected:
    runs-on: ubuntu-latest
    outputs:
      mobile_ios: ${{ steps.affected.outputs.mobile_ios }}
      mobile_android: ${{ steps.affected.outputs.mobile_android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: affected
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          AFFECTED=$(TURBO_SCM_BASE="$BASE" pnpm turbo run lint --affected --dry-run=json 2>/dev/null | jq -r '[.tasks[].package] | map(select(. == "@forge/mobile-ios" or . == "@forge/mobile-android")) | .[]' 2>/dev/null || echo "")
          echo "mobile_ios=$(echo "$AFFECTED" | grep -q "@forge/mobile-ios" && echo "true" || echo "false")" >> $GITHUB_OUTPUT
          echo "mobile_android=$(echo "$AFFECTED" | grep -q "@forge/mobile-android" && echo "true" || echo "false")" >> $GITHUB_OUTPUT

  generated-code:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:generated

  build-and-test:
    runs-on: ubuntu-latest
    needs: generated-code
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint --filter='!@forge/mobile-*' -- --max-warnings=0
      - run: pnpm test
      - run: pnpm build

  lint-ios:
    runs-on: macos-latest
    needs: affected
    if: needs.affected.outputs.mobile_ios == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: cd mobile/ios && swiftlint lint

  lint-android:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.mobile_android == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - run: cd mobile/android && ./gradlew ktlintCheck
