# Railway only reads this file if the dedicated @forge/admin worker service's
# Config-as-code Path is set to apps/admin/railway.worker.toml. The traffic-
# serving admin web service should keep using apps/admin/railway.toml.
#
# Set WORKFLOW_RUNNER_ENABLED=true on this worker service only. Leave it unset
# or false on admin web replicas so web scaling does not also scale background
# job runners.
# Keep WATCH_SEARCH_TRANSCRIPT_PUBLICATION_ENABLED=false until incremental
# publication is ready to roll out. TYPESENSE_OPERATOR_API_KEY belongs on this
# worker service only and must never be shared with admin web replicas.
# Railway project variables can still inject the reader credentials into every
# service. Remove them from every worker command before Admin loads its
# fail-closed reader/operator disjointness check. The operator credential is a
# runtime-only secret: dependency lifecycle scripts, the Next.js build, and
# migrations do not need collection mutation authority. Clear the publication
# flag with it outside the runtime command so build-time instrumentation stays
# on the disabled path.
#
# Do not set NODE_OPTIONS=--require dd-trace/init as a global Railway variable:
# service variables are present during Railpack/mise build setup, before
# dependencies are installed. Keep the Datadog preload scoped to startCommand.

[build]
builder = "RAILPACK"
buildCommand = "unset TYPESENSE_API_KEY TYPESENSE_SEARCH_API_KEY TYPESENSE_OPERATOR_API_KEY WATCH_SEARCH_TRANSCRIPT_PUBLICATION_ENABLED && export DD_VERSION=\"${DD_VERSION:-$RAILWAY_GIT_COMMIT_SHA}\" NEXT_PUBLIC_DATADOG_VERSION=\"${NEXT_PUBLIC_DATADOG_VERSION:-$RAILWAY_GIT_COMMIT_SHA}\" DATADOG_RELEASE_VERSION=\"${DATADOG_RELEASE_VERSION:-$RAILWAY_GIT_COMMIT_SHA}\" && pnpm install --frozen-lockfile && pnpm --filter @forge/admin build && pnpm --filter @forge/admin datadog:sourcemaps"
watchPatterns = [
  "/apps/admin/**",
  "/packages/experience-schema/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/turbo.json",
]

[deploy]
preDeployCommand = "unset TYPESENSE_API_KEY TYPESENSE_SEARCH_API_KEY TYPESENSE_OPERATOR_API_KEY WATCH_SEARCH_TRANSCRIPT_PUBLICATION_ENABLED && pnpm --filter @forge/admin db:migrate:deploy"
startCommand = "unset TYPESENSE_API_KEY TYPESENSE_SEARCH_API_KEY && cd apps/admin && export DD_VERSION=\"${DD_VERSION:-$RAILWAY_GIT_COMMIT_SHA}\" NEXT_PUBLIC_DATADOG_VERSION=\"${NEXT_PUBLIC_DATADOG_VERSION:-$RAILWAY_GIT_COMMIT_SHA}\" DATADOG_RELEASE_VERSION=\"${DATADOG_RELEASE_VERSION:-$RAILWAY_GIT_COMMIT_SHA}\" && HOSTNAME=0.0.0.0 NODE_OPTIONS='--enable-source-maps --require ./node_modules/dd-trace/init --max-old-space-size=5120' pnpm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
