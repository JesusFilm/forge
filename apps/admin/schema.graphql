  language: Language
  primary: Boolean
  srtSrc: String
  value: String
  video: Video
  vttSrc: String
}

"""
Per-(edition, language) transcript index. Artifact-level metadata (model, dimensions, chunking strategy) for the chunks that hang off this row.
"""
type VideoTranscript {
  createdAt: String
  dimensions: Int
  generatedAt: String
  id: ID
  language: String
  model: String
  totalChunks: Int
  totalTokens: Int
  updatedAt: String
  videoEditionId: ID
  videoId: ID
}

"""
A single chunk of a transcript. The underlying embedding vector is never exposed via GraphQL — read paths go through service-layer SQL in R4/R5.
"""
type VideoTranscriptChunk {
  chunkId: String
  chunkIndex: Int
  createdAt: String
  endSeconds: Float
  id: ID
  language: String
  startSeconds: Float
  text: String
  tokenCount: Int
  transcriptId: ID
  updatedAt: String
}
