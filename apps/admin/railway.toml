# Railway only reads this file if the @forge/admin service's Config-as-code Path
# is set to apps/admin/railway.toml. Without that service setting, this file is
# ignored and the Railway dashboard remains canonical.
#
# Do not set NODE_OPTIONS=--require dd-trace/init for the standalone server:
# Railpack's standalone runtime does not include a resolvable dd-trace preload
# module. Browser RUM sourcemaps are uploaded during build instead.

[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @forge/admin build && pnpm --filter @forge/admin datadog:sourcemaps && cp -r apps/admin/.next/static apps/admin/.next/standalone/apps/admin/.next/static"
watchPatterns = [
  "/apps/admin/**",
  "/packages/experience-schema/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/turbo.json",
]

[deploy]
preDeployCommand = "pnpm --filter @forge/admin db:migrate:deploy"
startCommand = "cd apps/admin/.next/standalone && HOSTNAME=0.0.0.0 NODE_OPTIONS='--max-old-space-size=5120' node apps/admin/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
