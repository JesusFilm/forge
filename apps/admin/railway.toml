#   - Five PRs (R2, R3, R4, R0, R4-extension) shipped migrations that
#     never applied to prod. Discovered 2026-04-29 when triggerSync
#     wrote 0 rows across all 5 phases.
#
# Recovery + permanent fix: see
#   docs/solutions/deployment/railway-dashboard-override-shadows-railway-toml-20260429.md
