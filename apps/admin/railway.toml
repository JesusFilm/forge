# Railway only reads this file if the @forge/admin service's Config-as-code Path
# is set to apps/admin/railway.toml. Without that service setting, this file is
# ignored and the Railway dashboard remains canonical.
#
# Do not set NODE_OPTIONS=--require dd-trace/init as a global Railway variable:
# service variables are present during Railpack/mise build setup, before
# dependencies are installed. Keep the Datadog preload scoped to startCommand.

[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @forge/admin build && if [ -n \"$DATADOG_API_KEY$DD_API_KEY\" ]; then pnpm --filter @forge/admin datadog:sourcemaps; else echo 'Skipping @forge/admin Datadog sourcemap upload: DATADOG_API_KEY/DD_API_KEY is not set'; fi && cp -r apps/admin/.next/static apps/admin/.next/standalone/apps/admin/.next/static"
watchPatterns = [
  "/apps/admin/**",
  "/packages/experience-schema/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/turbo.json",
]

[deploy]
preDeployCommand = "pnpm --filter @forge/admin db:migrate:deploy"
startCommand = "HOSTNAME=0.0.0.0 NODE_OPTIONS='--require dd-trace/init --max-old-space-size=5120' node apps/admin/.next/standalone/apps/admin/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
