[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @forge/subtitle-editor... build && cp -r apps/subtitle-editor/.next/static apps/subtitle-editor/.next/standalone/apps/subtitle-editor/.next/static && cp -r apps/subtitle-editor/public apps/subtitle-editor/.next/standalone/apps/subtitle-editor/public"

[deploy]
startCommand = "HOSTNAME=0.0.0.0 node apps/subtitle-editor/.next/standalone/apps/subtitle-editor/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
