# Services without this config path remain dashboard canonical.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/manager/Dockerfile"
watchPatterns = [
  "/apps/manager/**",
  "/packages/admin-graphql/**",
  "/packages/feature-flags/**",
  "/packages/shorts-compositions/**",
  "/packages/studio-contracts/**",
  "/packages/studio-server/**",
  "/packages/video-player/**",
  "/packages/watch-url-policy/**",
  "/docs/fixtures/manager-enrichment-steps.json",
  "/docs/fixtures/manager-enrichment-callbacks.json",
  "/scripts/update-security-ca.sh",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/patches/**",
]

[deploy]
startCommand = "node /app/apps/manager/.next/standalone/apps/manager/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
