# Railway only reads this file if the @forge/web service's Config-as-code Path
# is set to apps/web/railway.toml. Without that service setting, this file is
# ignored and the Railway dashboard remains canonical.
#
# Do not set NODE_OPTIONS=--require dd-trace/init as a global Railway variable:
# service variables are present during Railpack/mise build setup, before
# dependencies are installed. Keep the Datadog preload scoped to startCommand.
#
# DD_RUNTIME_METRICS_RUNTIME_ID_ENABLED tags runtime and custom metrics with
# the per-process runtime-id (dd-trace omits it by default). Without it, every
# process of one version writes the same series, so an old and a new process,
# or two replicas, cannot be told apart (feat-745). One series per process.

[build]
builder = "RAILPACK"
buildCommand = "export DD_VERSION=\"${DD_VERSION:-$RAILWAY_GIT_COMMIT_SHA}\" NEXT_PUBLIC_DATADOG_VERSION=\"${NEXT_PUBLIC_DATADOG_VERSION:-$RAILWAY_GIT_COMMIT_SHA}\" DATADOG_RELEASE_VERSION=\"${DATADOG_RELEASE_VERSION:-$RAILWAY_GIT_COMMIT_SHA}\" && pnpm install --frozen-lockfile && pnpm --filter @forge/web build && pnpm --filter @forge/web datadog:sourcemaps"
# Shared runtime trust inputs must trigger a Web release alongside app changes.
watchPatterns = [
  "/.nvmrc",
  "/railpack.json",
  "/scripts/update-security-ca.sh",
  "/apps/web/**",
  "/packages/admin-graphql/**",
  "/packages/feature-flags/**",
  "/packages/video-player/**",
  "/packages/watch-url-policy/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/turbo.json",
]

[deploy]
startCommand = "cd apps/web && export DD_VERSION=\"${DD_VERSION:-$RAILWAY_GIT_COMMIT_SHA}\" NEXT_PUBLIC_DATADOG_VERSION=\"${NEXT_PUBLIC_DATADOG_VERSION:-$RAILWAY_GIT_COMMIT_SHA}\" DATADOG_RELEASE_VERSION=\"${DATADOG_RELEASE_VERSION:-$RAILWAY_GIT_COMMIT_SHA}\" DD_RUNTIME_METRICS_RUNTIME_ID_ENABLED=\"${DD_RUNTIME_METRICS_RUNTIME_ID_ENABLED:-true}\" && HOSTNAME=0.0.0.0 NODE_OPTIONS='--enable-source-maps --require ./node_modules/dd-trace/init' pnpm start"
healthcheckPath = "/watch"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
