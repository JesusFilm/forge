[build]
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @forge/developer... build && cp -r apps/developer/.next/static apps/developer/.next/standalone/apps/developer/.next/static"

[deploy]
startCommand = "HOSTNAME=0.0.0.0 node apps/developer/.next/standalone/apps/developer/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
