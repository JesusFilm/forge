# Configure the Railway service Config-as-code Path to apps/tv-feedback/railway.toml.
[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @forge/tv-feedback build"
watchPatterns = ["/apps/tv-feedback/**", "/pnpm-lock.yaml", "/package.json"]

[deploy]
startCommand = "cd apps/tv-feedback && npx next start -p ${PORT:-3210}"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
