[build]
builder = "nixpacks"
buildCommand = "corepack prepare pnpm@9.12.3 --activate && pnpm install --frozen-lockfile && pnpm --filter roadmap build"
watchPatterns = ["apps/roadmap/**", "docs/roadmap/**"]

[deploy]
startCommand = "cp -r docs/roadmap apps/roadmap/.next/standalone/docs/roadmap && cp -r apps/roadmap/.next/static apps/roadmap/.next/standalone/apps/roadmap/.next/static && cd apps/roadmap/.next/standalone && node apps/roadmap/server.js"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.env]
PORT = "3100"
HOSTNAME = "0.0.0.0"
