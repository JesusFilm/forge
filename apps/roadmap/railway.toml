[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/roadmap/Dockerfile"
watchPatterns = ["/.nvmrc", "/package.json", "/pnpm-lock.yaml", "/pnpm-workspace.yaml", "/patches/**", "/.dockerignore", "apps/roadmap/**", "docs/roadmap/**"]

[deploy]
startCommand = "sh -c 'cd /app/apps/roadmap && exec node node_modules/next/dist/bin/next start -H 0.0.0.0 -p ${PORT:-3100}'"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.env]
HOSTNAME = "0.0.0.0"
ROADMAP_DIR = "/app/docs/roadmap"
