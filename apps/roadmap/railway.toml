[build]
builder = "railpack"
buildCommand = "corepack prepare pnpm@9.12.3 --activate && pnpm install --frozen-lockfile && pnpm --filter roadmap build"
watchPatterns = ["apps/roadmap/**", "docs/roadmap/**"]

[deploy]
startCommand = "echo CWD=$(pwd) && ls -la && echo '--- apps/roadmap ---' && ls -la apps/roadmap/ 2>/dev/null && echo '--- standalone ---' && ls -la apps/roadmap/.next/standalone/ 2>/dev/null && echo '--- docs ---' && ls -la docs/ 2>/dev/null && mkdir -p apps/roadmap/.next/standalone/docs && cp -r docs/roadmap apps/roadmap/.next/standalone/docs/roadmap && cp -r apps/roadmap/.next/static apps/roadmap/.next/standalone/apps/roadmap/.next/static && cp -r apps/roadmap/public apps/roadmap/.next/standalone/apps/roadmap/public && cd apps/roadmap/.next/standalone && echo '--- standalone docs ---' && ls -la docs/roadmap/ && node apps/roadmap/server.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.env]
HOSTNAME = "0.0.0.0"
