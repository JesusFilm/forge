name: Focus Restoration After Modal
platform: [tvos, androidtv]
steps:
  - launch: org.jesusfilm.forgetv
  - wait: 3000
  - dpad: down
  - wait: 300
  - screenshot: before-modal
  # Open something
  - dpad: select
  - wait: 1500
  # Go back
  - dpad: back
  - wait: 500
  - screenshot: focus-restored
