# Shrink the player to the mini player, change tabs, expand it, and close it
# (R19 starter journey). The test settings hide Explore, which would end the
# mini player, so the journey visits the other tabs.
appId: org.jesusfilm.forgewatch
name: mini-player
---
- launchApp:
    permissions:
      notifications: deny
    label: Launch the app
- extendedWaitUntil:
    visible:
      id: screen-tab-home
    timeout: 60000
    label: Home shows
- openLink:
    link: forgemobile://watch/the-birth-of-jesus
    label: Open the birth of Jesus video
# iOS can ask before it opens a forgemobile:// link.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Open
          optional: true
          label: Accept the iOS prompt to open the link
    label: Accept the iOS link prompt
- extendedWaitUntil:
    visible:
      id: screen-watch
    timeout: 30000
    label: The watch page shows
- extendedWaitUntil:
    visible:
      id: player-first-frame
    timeout: 60000
    label: The video plays
- tapOn:
    text: Go back
    label: Shrink the player
- extendedWaitUntil:
    visible:
      id: screen-tab-home
    timeout: 20000
    label: Home shows under the mini player
- extendedWaitUntil:
    visible:
      text: "Mini player, .+, playing"
    timeout: 10000
    label: The mini player plays on Home
- tapOn:
    text: Bible
    label: Open the Bible tab
- extendedWaitUntil:
    visible:
      id: screen-tab-bible
    timeout: 20000
    label: The Bible tab shows
- assertVisible:
    id: mini-player-window
    label: The mini player shows on the Bible tab
- tapOn:
    text: My Watch
    label: Open the My Watch tab
- extendedWaitUntil:
    visible:
      id: screen-tab-profile
    timeout: 20000
    label: My Watch shows
- assertVisible:
    id: mini-player-window
    label: The mini player shows on My Watch
- tapOn:
    text: Home
    label: Open the Home tab
- extendedWaitUntil:
    visible:
      id: screen-tab-home
    timeout: 20000
    label: Home shows with the mini player
- assertVisible:
    id: mini-player-window
    label: The mini player shows on Home
# On iOS 26 the Search tab replaces the tab bar with a button for the last
# tab, so the journey opens Search from Home and leaves by that button.
- tapOn:
    text: Search
    label: Open the Search tab
- extendedWaitUntil:
    visible:
      id: screen-tab-watch
    timeout: 20000
    label: Search shows
- assertVisible:
    id: mini-player-window
    label: The mini player shows on Search
- tapOn:
    text: Home
    label: Go back to Home
- extendedWaitUntil:
    visible:
      id: screen-tab-home
    timeout: 20000
    label: Home shows again
- tapOn:
    id: mini-player-expand
    label: Expand the mini player
- extendedWaitUntil:
    visible:
      id: screen-watch
    timeout: 20000
    label: The watch page shows again
- assertNotVisible:
    id: mini-player-window
    label: The full player replaces the mini player
- tapOn:
    text: Go back
    label: Shrink the player again
- extendedWaitUntil:
    visible:
      id: mini-player-window
    timeout: 10000
    label: The mini player shows again
# iOS can drop the window's buttons from the accessibility tree, so the
# journey taps the close button's place in the window's top corner.
- tapOn:
    id: mini-player-window
    point: 93%,12%
    label: Close the mini player
- extendedWaitUntil:
    notVisible:
      id: mini-player-window
    timeout: 10000
    label: The mini player closes
