# Open video A, go back, open video B, and check that video B shows (R19
# starter journey). Video A is named; video B is the first video card on Home.
appId: org.jesusfilm.forgewatch
name: open-video-a-then-b
---
- launchApp:
    permissions:
      notifications: deny
    label: Launch the app
- extendedWaitUntil:
    visible:
      id: screen-tab-home
    timeout: 60000
    label: Home shows
- openLink:
    link: forgemobile://watch/the-birth-of-jesus
    label: Open the birth of Jesus video
# iOS can ask before it opens a forgemobile:// link.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Open
          optional: true
          label: Accept the iOS prompt to open the link
    label: Accept the iOS link prompt
- extendedWaitUntil:
    visible:
      id: screen-watch
    timeout: 30000
    label: The watch page shows video A
- extendedWaitUntil:
    visible:
      id: player-first-frame
    timeout: 60000
    label: Video A plays
- assertVisible:
    text: The Birth of Jesus
    label: The page names video A
- tapOn:
    text: Go back
    label: Go back to Home
- extendedWaitUntil:
    visible:
      id: screen-tab-home
    timeout: 20000
    label: Home shows
- extendedWaitUntil:
    visible:
      text: "Mini player, The Birth of Jesus, playing"
    timeout: 20000
    label: The mini player plays video A
# The card is centered, so the mini player in the bottom corner cannot take
# the tap.
- scrollUntilVisible:
    element:
      id: home-card-video
    direction: DOWN
    centerElement: true
    timeout: 30000
    label: Scroll to a video card
- tapOn:
    id: home-card-video
    label: Open video B
- extendedWaitUntil:
    visible:
      id: screen-watch
    timeout: 20000
    label: The watch page shows video B
- assertNotVisible:
    text: The Birth of Jesus
    label: The page does not name video A
- extendedWaitUntil:
    visible:
      id: player-first-frame
    timeout: 60000
    label: Video B plays
# The mini player names the video that plays, so it proves that B replaced A.
- tapOn:
    text: Go back
    label: Shrink the player
- extendedWaitUntil:
    visible:
      text: "Mini player, .+, playing"
    timeout: 20000
    label: The mini player plays a video
- assertNotVisible:
    text: "Mini player, The Birth of Jesus, .+"
    label: The mini player does not play video A
# iOS can drop the window's buttons from the accessibility tree, so the
# journey taps the close button's place in the window's top corner.
- tapOn:
    id: mini-player-window
    point: 93%,12%
    label: Close the mini player
- extendedWaitUntil:
    notVisible:
      id: mini-player-window
    timeout: 10000
    label: The mini player closes
