appId: com.jesusfilm.forge
tags:
  - video
  - description
---
# Video Detail Description — Read more / Show less toggle
- launchApp
- waitForAnimationToEnd
- scroll:
    direction: DOWN
    duration: 1000
- tapOn:
    id: "video-card-0"
    optional: true
- waitForAnimationToEnd

# Scroll to description
- scroll:
    direction: DOWN
    duration: 500
- takeScreenshot: ../e2e/screenshots/${platform}/video-detail-description/collapsed

# Tap Read more
- tapOn:
    text: "Read more"
    optional: true
- takeScreenshot: ../e2e/screenshots/${platform}/video-detail-description/expanded

# Tap Show less
- tapOn:
    text: "Show less"
    optional: true
- takeScreenshot: ../e2e/screenshots/${platform}/video-detail-description/collapsed-again
