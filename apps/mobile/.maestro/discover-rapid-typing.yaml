appId: org.jesusfilm.forgewatch
tags:
  - discover
  - debounce
---
# Discover Rapid Typing — Only latest query fires (requestId)
- launchApp
- tapOn:
    id: "tab-discover"
- waitForAnimationToEnd

- tapOn:
    id: "search-input"
    optional: true
- inputText: "first"
- waitForAnimationToEnd
- eraseText
- inputText: "second"
- waitForAnimationToEnd
- eraseText
- inputText: "Jesus"
- waitForAnimationToEnd
- takeScreenshot: ../e2e/screenshots/${platform}/discover-rapid-typing/latest-result
