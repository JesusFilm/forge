appId: com.jesusfilm.forge
tags:
  - video
  - navigation
---
# Video Detail Back — Return to correct tab
- launchApp
- waitForAnimationToEnd
- scroll:
    direction: DOWN
    duration: 1000
- tapOn:
    id: "video-card-0"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ../e2e/screenshots/${platform}/video-detail-back/detail-screen

# Back button
- tapOn:
    id: "back-button"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ../e2e/screenshots/${platform}/video-detail-back/returned-home
