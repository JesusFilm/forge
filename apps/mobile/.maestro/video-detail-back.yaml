appId: org.jesusfilm.forgewatch
tags:
  - video
  - navigation
---
# Video Detail Back — Return to correct tab
- launchApp
- waitForAnimationToEnd
- scroll
- tapOn:
    id: "video-card-0"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ../e2e/screenshots/${platform}/video-detail-back/detail-screen

# Back button
- tapOn:
    id: "back-button"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ../e2e/screenshots/${platform}/video-detail-back/returned-home
