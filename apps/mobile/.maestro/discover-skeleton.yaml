appId: org.jesusfilm.forgewatch
tags:
  - discover
  - loading
---
# Discover Skeleton Loading — Shimmer cards after 500ms delay
- launchApp
- tapOn:
    id: "tab-discover"
- waitForAnimationToEnd

# Type to trigger search
- tapOn:
    id: "search-input"
    optional: true
- inputText: "Jesus"
- waitForAnimationToEnd
- takeScreenshot: ../e2e/screenshots/${platform}/discover-skeleton/shimmer-loading

# Wait for results to replace skeleton
- waitForAnimationToEnd
- takeScreenshot: ../e2e/screenshots/${platform}/discover-skeleton/results-loaded
