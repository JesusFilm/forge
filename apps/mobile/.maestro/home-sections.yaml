appId: com.jesusfilm.forge
tags:
  - home
  - sections
---
# Home Screen Sections — Verify sections render in order
- launchApp
- waitForAnimationToEnd

# Navigation carousel at top
- takeScreenshot: ../e2e/screenshots/${platform}/home-sections/top-sections

# Scroll to mid sections
- scroll:
    direction: DOWN
    duration: 2000
- takeScreenshot: ../e2e/screenshots/${platform}/home-sections/mid-sections

# Scroll further
- scroll:
    direction: DOWN
    duration: 2000
- takeScreenshot: ../e2e/screenshots/${platform}/home-sections/bottom-sections
