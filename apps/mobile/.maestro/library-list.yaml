appId: org.jesusfilm.forgewatch
tags:
  - library
---
# Library Screen — Experience list with FlashList
- launchApp
- tapOn:
    id: "tab-library"
- waitForAnimationToEnd
- takeScreenshot: ../e2e/screenshots/${platform}/library-list/loaded

# Scroll through experiences
- scroll:
    direction: DOWN
    duration: 1000
- takeScreenshot: ../e2e/screenshots/${platform}/library-list/scrolled
