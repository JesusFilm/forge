appId: com.jesusfilm.forge
tags:
  - video
  - share
---
# Video Detail Share — Native share sheet
- launchApp
- waitForAnimationToEnd
- scroll:
    direction: DOWN
    duration: 1000
- tapOn:
    id: "video-card-0"
    optional: true
- waitForAnimationToEnd

# Tap share button
- tapOn:
    id: "share-button"
    optional: true
- wait:
    milliseconds: 1000
- takeScreenshot: ../e2e/screenshots/${platform}/video-detail-share/share-sheet
