appId: org.jesusfilm.forgewatch
tags:
  - video
  - detail
---
# Video Detail Screen — Route, header, player, description
- launchApp
- waitForAnimationToEnd

# Navigate to a video via home content
- scroll:
    direction: DOWN
    duration: 1000
- tapOn:
    id: "video-card-0"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ../e2e/screenshots/${platform}/video-detail/loaded

# Header elements
- takeScreenshot: ../e2e/screenshots/${platform}/video-detail/header

# Tap thumbnail to play
- tapOn:
    id: "video-thumbnail"
    optional: true
- wait:
    milliseconds: 1000
- takeScreenshot: ../e2e/screenshots/${platform}/video-detail/playing
