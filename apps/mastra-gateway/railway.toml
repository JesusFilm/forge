# Railway only reads this file if the service's Config-as-code Path is set to
# apps/mastra-gateway/railway.toml. Otherwise configure the same commands in
# the Railway dashboard and treat that dashboard config as canonical.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/mastra-gateway/Dockerfile"
watchPatterns = [
  "/apps/mastra-gateway/**",
  "/apps/auth/**",
  "/scripts/update-security-ca.sh",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/patches/**",
]

[deploy]
startCommand = "sh /app/apps/mastra-gateway/start-production.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
