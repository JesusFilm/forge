# Railway only reads this file if the service's Config-as-code Path is set to
# apps/mastra-gateway/railway.toml. Otherwise configure the same commands in
# the Railway dashboard and treat that dashboard config as canonical.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/mastra-gateway/Dockerfile"

[deploy]
startCommand = "cd apps/mastra-gateway && pnpm exec prisma migrate deploy && HOSTNAME=0.0.0.0 node .next/standalone/apps/mastra-gateway/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
