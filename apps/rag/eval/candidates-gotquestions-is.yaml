  # /islenska/personulegur-Frelsari.html: What does it mean to receive Jesus as a personal Savior?
  - id: gq-is-newcomer-next-steps
    question:
      Ég er nýbyrjaður að trúa á Jesú. Hvað ætti ég að gera næst til að vaxa
      í trúnni?
    language: is
    evidence_tier: llm-translated
    relevant:
      gotquestions:
        - /islenska/hvao-naest.html
        - /islenska/Kristni.html
        - /islenska/merking-lifsins.html
  # EN: My life feels empty even though things are going well. How can I find lasting purpose according to Christianity?
  # EXPECTED /islenska/lif-eftir-daudann.html: Is there life after death? — The Bible affirms life after death, with eternal life for believers and eternal punishment for unbelievers. Jesus Christ's resurrection is the cornerstone of this belief, offering eternal life through faith in him.
  # EXPECTED /islenska/hjalprad.html: What is salvation? — Jesus is presented as the answer to life's emptiness, confusion, and search for purpose, offering himself as the bread of life, light, door, good shepherd, and resurrection. Salvation comes through faith in Jesus, who died for our sins and rose again.
  # EXPECTED /islenska/merking-lifsins.html: What is the meaning of life? — The meaning of life is found in restoring fellowship with God through Jesus Christ, which was lost due to sin. True fulfillment comes from following Christ as a disciple, not just believing in Him.
  # EXPECTED /islenska/rett-tru-fyrir-mig.html: What is the right religion for me? — Jesus is presented as the only way to salvation because He alone overcame death, unlike other religious founders. Believing in Jesus as Savior provides forgiveness, a meaningful relationship with God, and eternal life.
  # EXCLUDED after precedent review: /islenska/eilift-lif.html — It explains receiving eternal life, without developing how faith addresses present emptiness and purpose; its invitation does not fill that gap.
  # EXCLUDED after precedent review: /islenska/Jesus-einasti-vegurinn.html — Its focus is salvation’s exclusive route; it does not develop an answer about present meaning and fulfillment despite outward success.
  # EXCLUDED after precedent review: /islenska/pekktu-vilja-Guds.html — It discusses discerning permissible decisions and aligning desires with God’s will, rather than the question’s existential emptiness and lasting purpose.
  # RETRIEVED (English-translated titles):
  # /islenska/merking-lifsins.html: What is the meaning of life?
  # /islenska/hjalprad.html: What is salvation?
  # /islenska/ekki-fremja-sjalfsmord.html: Why should I not commit suicide?
  # /islenska/hvao-naest.html: I have recently come to believe in Jesus... what next?
  # /islenska/sigur-yfir-syndinni.html: How can I overcome sin in my Christian life?
  # /islenska/vita-vissu-sina-himininn.html: How can I know for sure that I will go to heaven when I die?
  # /islenska/endurfaedd-kristin-manneskja.html: What does it mean to be a born-again Christian?
  # /islenska/Kristni.html: What is the Christian faith and what do Christians believe?
  # /islenska/vegur-Romverjans-hjalpraedis.html: What is the Roman's Road to Salvation?
  # /islenska/lif-eftir-daudann.html: Is there life after death?
  - id: gq-is-seeker-purpose
    question: Líf mitt virðist tómt þótt mér gangi vel. Hvernig get ég fundið
      varanlegan tilgang samkvæmt kristinni trú?
    language: is
    evidence_tier: llm-translated
    relevant:
      gotquestions:
        - /islenska/lif-eftir-daudann.html
        - /islenska/hjalprad.html
        - /islenska/merking-lifsins.html
        - /islenska/rett-tru-fyrir-mig.html
