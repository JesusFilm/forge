# REVIEW SNAPSHOT: operator-approved and appended to qa-golden.yaml on 2026-09-08.
# Whole-corpus language:is retrieval, topK 10, minimum score 0.37.
cases:
  # EN: I am ashamed of what I have done. How can I receive God's forgiveness and start again?
  # EXPECTED /islenska/baen-syndara.html: What is the sinner's prayer? — The sinner's prayer is a prayer to God acknowledging one's sinfulness and need for a Savior. It is only effective if it reflects genuine belief in one's sin and the need for salvation through Jesus Christ's atoning death and resurrection.
  # EXPECTED /islenska/vita-vissu-sina-himininn.html: How can I know for sure that I will go to heaven when I die? — To be sure of eternal life, one must understand that sin separates us from God, but Jesus' death and resurrection provide forgiveness. Believing in Jesus Christ as Savior is the way to receive this gift of eternal life and assurance of heaven.
  # EXPECTED /islenska/thiggja-fyrirgefningu-Guds.html: How do I receive God's forgiveness? — God offers forgiveness for sins because He loves us and Jesus died on the cross to pay the penalty for our sins. Receiving this forgiveness is a gift accepted through faith in Jesus Christ, not earned by works.
  # EXPECTED /islenska/fjogur-andleg-logmal.html: What are the Four Spiritual Laws? — The Four Spiritual Laws outline a method for sharing the gospel of salvation through faith in Jesus Christ. They explain God's love and plan, humanity's sin and separation from God, Jesus Christ as God's provision for sin, and the necessity of receiving this gift through faith in Jesus.
  # EXPECTED /islenska/saettast-vid-Gud.html: How do I get right with God? — To be reconciled with God, one must acknowledge sin, repent, and believe in Jesus Christ's atoning death and resurrection. This involves confessing sins, turning from sinful living, and trusting in God's promise of salvation through faith in Jesus.
  # EXPECTED /islenska/vegur-Romverjans-hjalpraedis.html: What is the Roman's Road to Salvation? — The Romans Road develops the need for forgiveness, faith in Christ, repentance, and freedom from condemnation; forgiveness is its substance, not an appended invitation.
  # EXPECTED /islenska/ekki-fremja-sjalfsmord.html: Why should I not commit suicide? — A substantive body section addresses grave past wrongdoing, repentance, forgiveness, and becoming new; its suicide-prevention framing does not erase that direct answer.
  # EXPECTED /islenska/eilift-lif.html: Do you have eternal life? — The body develops sin, Christ’s sacrifice, repentance, and faith as the means of forgiveness; this is more than its concluding prayer.
  # EXPECTED /islenska/hjalprad.html: What is salvation? — The salvation explanation connects separation caused by sin to forgiveness and restored relationship through Christ; that developed answer meets the question.
  # EXPECTED /islenska/hvao-naest.html: I have recently come to believe in Jesus... what next? — Its substantial opening explanation of salvation and assurance explains how forgiveness is received, even though later sections address new believers.
  # EXCLUDED after precedent review: /islenska/lif-eftir-daudann.html — The article explains the afterlife; the closing invitation does not turn it into an answer about receiving forgiveness for past actions.
  # EXCLUDED after precedent review: /islenska/gerist-eftir-daudann.html — It explains post-death destinations and judgment, without explaining how to receive forgiveness and begin again now.
  # EXCLUDED after precedent review: /islenska/rett-tru-fyrir-mig.html — The article argues for choosing Christianity; its brief forgiveness offer and closing prayer are the gospel-tail pattern previously rejected in the multilingual campaign.
  # RETRIEVED (English-translated titles):
  # /islenska/saettast-vid-Gud.html: How do I get right with God?
  # /islenska/thiggja-fyrirgefningu-Guds.html: How do I receive God's forgiveness?
  # /islenska/endurfaedd-kristin-manneskja.html: What does it mean to be a born-again Christian?
  # /islenska/ekki-fremja-sjalfsmord.html: Why should I not commit suicide?
  # /islenska/vita-vissu-sina-himininn.html: How can I know for sure that I will go to heaven when I die?
  # /islenska/fjogur-andleg-logmal.html: What are the Four Spiritual Laws?
  # /islenska/sigur-yfir-syndinni.html: How can I overcome sin in my Christian life?
  # /islenska/vegur-Romverjans-hjalpraedis.html: What is the Roman's Road to Salvation?
  # /islenska/Jesus-einasti-vegurinn.html: Is Jesus the only way to heaven?
  # /islenska/hjalprad.html: What is salvation?
  - id: gq-is-seeker-forgiveness
    question: Ég skammast mín fyrir það sem ég hef gert. Hvernig get ég fengið
      fyrirgefningu Guðs og byrjað upp á nýtt?
    language: is
    evidence_tier: llm-translated
    relevant:
      gotquestions:
        - /islenska/baen-syndara.html
        - /islenska/vita-vissu-sina-himininn.html
        - /islenska/thiggja-fyrirgefningu-Guds.html
        - /islenska/fjogur-andleg-logmal.html
        - /islenska/saettast-vid-Gud.html
        - /islenska/vegur-Romverjans-hjalpraedis.html
        - /islenska/ekki-fremja-sjalfsmord.html
        - /islenska/eilift-lif.html
        - /islenska/hjalprad.html
        - /islenska/hvao-naest.html
  # EN: Was Jesus just a good teacher, or are there biblical reasons to believe he is God?
  # EXPECTED /islenska/er-Jesus-Gud.html: Is Jesus God? Did Jesus claim to be God? — The Bible presents Jesus as God, evidenced by His claims of unity with the Father, His acceptance of worship, and titles attributed to Him. His atoning death is sufficient for the sins of the world only if He is fully God.
  # EXPECTED /islenska/er-Gud-til.html: Does God exist? — The document asserts Jesus' divine nature, citing His claims and the reactions of others as evidence. It argues that Jesus is either God, a lunatic, or a liar, and that His divinity is crucial for salvation.
  # EXPECTED /islenska/personulegur-Frelsari.html: What does it mean to receive Jesus as a personal Savior? — Receiving Jesus as a personal Savior means understanding that Jesus is God incarnate, who died for our sins and rose again. It involves placing personal faith and trust in Him, not just in religious practices, to be saved.
  # EXPECTED /islenska/hver-Jesus-Kristur.html: Who is Jesus Christ? — Jesus Christ was a historical figure, but the Bible presents him as more than a teacher or prophet, asserting his divine nature. His claims to be one with the Father and his use of the divine name 'I Am' indicate he is God, which is crucial for salvation as only God could pay the penalty for sin.
  # EXPECTED /islenska/Guthdomur-Krists.html: Is Christ's Divinity Biblical? — The document argues that the Bible presents Jesus as divine, citing his own claims, his disciples' beliefs, and titles/actions attributed to him. It further supports this by detailing historical evidence for the resurrection, which is presented as the ultimate proof of his divinity.
  # EXPECTED /islenska/rett-tru-fyrir-mig.html: What is the right religion for me? — The body develops Jesus’ authority and resurrection evidence, giving reasons to consider him more than an ordinary teacher.
  # EXCLUDED after precedent review: /islenska/lif-eftir-daudann.html — It assumes Christ’s divine identity while explaining the afterlife; it does not develop the requested case against the merely-good-teacher view.
  # EXCLUDED after precedent review: /islenska/Jesus-einasti-vegurinn.html — It argues that Jesus is the route to salvation, while assuming rather than defending his divine identity against the question’s objection.
  # RETRIEVED (English-translated titles):
  # /islenska/hver-Jesus-Kristur.html: Who is Jesus Christ?
  # /islenska/er-Gud-til.html: Does God exist?
  # /islenska/er-Jesus-Gud.html: Is Jesus God? Did Jesus claim to be God?
  # /islenska/Guthdomur-Krists.html: Is Christ's divinity biblical?
  # /islenska/er-Gud-raunverulegur.html: Is God real? How can I know for sure that God is real?
  # /islenska/Biblian-Ord-Guds.html: Is the Bible really the Word of God?
  # /islenska/personulegur-Frelsari.html: What does it mean to receive Jesus as a personal Savior?
  # /islenska/ekki-fremja-sjalfsmord.html: Why should I not commit suicide?
  # /islenska/hjalprad.html: What is salvation?
  # /islenska/rett-tru-fyrir-mig.html: What is the right religion for me?
  - id: gq-is-skeptic-jesus-divinity
    question:
      Var Jesús bara góður kennari, eða eru ástæður í Biblíunni til að trúa
      því að hann sé Guð?
    language: is
    evidence_tier: llm-translated
    relevant:
      gotquestions:
        - /islenska/er-Jesus-Gud.html
        - /islenska/er-Gud-til.html
        - /islenska/personulegur-Frelsari.html
        - /islenska/hver-Jesus-Kristur.html
        - /islenska/Guthdomur-Krists.html
        - /islenska/rett-tru-fyrir-mig.html
  # EN: The Bible was written by people. Why should I trust that it is God's word?
  # EXPECTED /islenska/Biblian-Ord-Guds.html: Is the Bible really the Word of God? — The Bible claims to be the Word of God, supported by internal evidence like its unity, fulfilled prophecies, and transformative power, as well as external evidence such as its historical accuracy and the integrity of its authors. Its endurance through centuries of opposition further testifies to its divine origin.
  # EXCLUDED after precedent review: /islenska/Jesus-einasti-vegurinn.html — It uses biblical authority to explain salvation but does not defend that authority against the objection that human authors wrote the Bible.
  # RETRIEVED (English-translated titles):
  # /islenska/Biblian-Ord-Guds.html: Is the Bible really the Word of God?
  # /islenska/er-Gud-til.html: Does God exist?
  # /islenska/er-Gud-raunverulegur.html: Is God real? How can I know for sure that God is real?
  # /islenska/hver-Jesus-Kristur.html: Who is Jesus Christ?
  # /islenska/vita-vissu-sina-himininn.html: How can I know for sure that I will go to heaven when I die?
  # /islenska/hjonabond-folks-olikum-kynbattum.html: What does the Bible say about interracial marriage?
  # /islenska/eiginleikar-Guds.html: What are the attributes of God? How is God?
  # /islenska/Biblian-sjalfsmord.html: What is the Christian view of suicide? What does the Bible say about suicide?
  # /islenska/hvao-naest.html: I have recently come to believe in Jesus... what next?
  # /islenska/Heilog-brenning-Bibliunnar.html: What does the Bible teach about the Holy Trinity?
  - id: gq-is-skeptic-bible-trust
    question:
      Biblían var skrifuð af mönnum. Af hverju ætti ég að treysta því að hún
      sé orð Guðs?
    language: is
    evidence_tier: llm-translated
    relevant:
      gotquestions:
        - /islenska/Biblian-Ord-Guds.html
  # EN: I believe in Jesus but keep falling into the same sin. How can I resist it in daily life?
  # EXPECTED /islenska/sigur-yfir-syndinni.html: How can I overcome sin in my Christian life? — Overcoming sin involves relying on the Holy Spirit, engaging with God's Word (the Bible), consistent prayer, and the support of the church community. These resources empower believers to live a victorious Christian life by aligning their will with God's.
  # EXPECTED /islenska/Kristni.html: What is the Christian faith and what do Christians believe? — The body explicitly addresses believers’ continuing struggle with sin and directs them to read and apply Scripture and follow the Spirit in daily life.
  # EXCLUDED after precedent review: /islenska/eitt-sinn-holpinn.html — Assurance that salvation cannot be lost does not explain how to resist recurring sin in daily life.
  # RETRIEVED (English-translated titles):
  # /islenska/ekki-fremja-sjalfsmord.html: Why should I not commit suicide?
  # /islenska/lif-eftir-daudann.html: Is there life after death?
  # /islenska/sigur-yfir-syndinni.html: How can I overcome sin in my Christian life?
  # /islenska/vita-vissu-sina-himininn.html: How can I know for sure that I will go to heaven when I die?
  # /islenska/rett-tru-fyrir-mig.html: What is the right religion for me?
  # /islenska/saettast-vid-Gud.html: How do I get right with God?
  # /islenska/hjalprad.html: What is salvation?
  # /islenska/endurfaedd-kristin-manneskja.html: What does it mean to be a born-again Christian?
  # /islenska/fjogur-andleg-logmal.html: What are the Four Spiritual Laws?
  # /islenska/vegur-Romverjans-hjalpraedis.html: What is the Roman's Road to Salvation?
  - id: gq-is-believer-recurring-sin
    question:
      Ég trúi á Jesú en fell aftur og aftur í sömu syndina. Hvernig get ég
      barist gegn henni í daglegu lífi?
    language: is
    evidence_tier: llm-translated
    relevant:
      gotquestions:
        - /islenska/sigur-yfir-syndinni.html
        - /islenska/Kristni.html
  # EN: I have just begun believing in Jesus. What should I do next to grow in faith?
  # EXPECTED /islenska/hvao-naest.html: I have recently come to believe in Jesus... what next? — After accepting Jesus, it's important to understand salvation, find a Bible-believing church for community and teaching, establish daily spiritual disciplines like prayer and Bible reading, cultivate relationships with spiritually supportive people, and get baptized as a public declaration of faith.
  # EXPECTED /islenska/Kristni.html: What is the Christian faith and what do Christians believe? — It moves beyond conversion to practical post-conversion guidance: apply Scripture, follow the Spirit, and live in fellowship and obedience.
  # EXPECTED /islenska/merking-lifsins.html: What is the meaning of life? — The discipleship section explicitly recommends learning about Jesus, Bible reading, prayer, and obedience beyond initial belief.
  # EXCLUDED after precedent review: /islenska/endurfaedd-kristin-manneskja.html — It explains becoming born again; the question is what someone who already believes should do to grow.
  # EXCLUDED after precedent review: /islenska/vita-vissu-sina-himininn.html — It explains obtaining and being assured of salvation, without practical guidance for growth after conversion.
  # EXCLUDED after precedent review: /islenska/personulegur-Frelsari.html — It explains receiving Jesus as Savior and ends with a conversion invitation, rather than giving subsequent discipleship steps.
  # RETRIEVED (English-translated titles):
  # /islenska/hvao-naest.html: I have recently come to believe in Jesus... what next?
  # /islenska/vita-vissu-sina-himininn.html: How can I know for sure that I will go to heaven when I die?
  # /islenska/rett-tru-fyrir-mig.html: What is the right religion for me?
  # /islenska/ekki-fremja-sjalfsmord.html: Why should I not commit suicide?
  # /islenska/hjalprad.html: What is salvation?
  # /islenska/fjogur-andleg-logmal.html: What are the Four Spiritual Laws?
