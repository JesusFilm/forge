# Hand-authored QA pairs for the corpus. Each case is a SOURCE-AGNOSTIC question
# plus a `relevant` map of {sourceKey: [doc pathnames]} — every document, across
# sources, that legitimately answers it. A top-k hit is judged correct if its
# source key and doc pathname match a pair in the relevant set. This identity
# survives re-indexing without allowing one source's shared path to credit another.
#
# Schema (consumed by scripts/eval.ts):
#
#   cases:
#     - id: short-stable-id            # required, unique
#       question: "natural-language question"   # required
#       language: "de"                 # optional; pin when derivation is ambiguous
#       evidence_tier: llm-translated  # optional; see below
#       relevant:                      # required; >=1 source, each with >=1 path
#         starting-with-god:
#           - "/path/one.html"
#         cru:
#           - "/us/en/.../lesson.html"
#
# `evidence_tier` records how well the OPERATOR could see what they approved —
# NOT how good the case is. Nothing is discounted or excluded by it; `pnpm eval`
# simply reports the buckets separately so a machine-translated language's
# number is never averaged into one a reviewer could check.
#
#   human-verified  approved on content a reviewer could read, or on a
#                   translation they could sanity-check
#   llm-translated  approved on a machine translation nobody available can
#                   verify (the #111 campaign's low-resource languages)
#   (absent)        authored before the tier existed — reported as "(untagged)".
#                   Do NOT backfill these to human-verified: nobody now can say
#                   which of them the reviewer could read unaided.
#
# Every non-English case still needs its `# EN:` question translation and a
# `# RETRIEVED` block of English-translated results (docs/eval-approach.md) —
# the tier records how checkable that translation was, it does not replace it.
#
# `pnpm eval` reports recall@3 / recall@10 / COVERAGE (fraction of the relevant
# set returned) + per-source coverage; P@1/MRR are secondary (ranking is the
# consumer's job — docs/eval-approach.md). `pnpm eval --source <key>` runs the
# cases whose relevant set includes that source (still whole-corpus retrieval).
#
# The relevant set is LIVING: when a new source is ingested, RE-REVIEW these
# questions and extend their relevant sets with any newly-relevant docs — don't
# only add new questions. ids keep historical swg-/cru- prefixes but questions
# are source-agnostic. Off-topic NEGATIVES live in the slice files (eval.ts would
# miscount them as misses), not here.

