  # ---------------------------------------------------------------------------
  # everystudent-ar (slice #9, 2026-07-25) — the corpus's FIRST Arabic cases.
  #
  # Every case pins `language: "ar"`. everystudent-ar declares ["ar"] alone, so
  # caseLanguage() derives "ar" TODAY — but the moment a second source is
  # credited on one of these questions the declared-language intersection empties
  # and the case silently goes unscoped. Since qwen3 retrieves cross-lingually
  # (an Arabic question legitimately returns zh/fr/en docs — slice #9 Stage 3),
  # an unscoped Arabic case would be scored against a corpus that answers it in
  # another language. The pin is what stops that.
  #
  # Credits were set by a 3-lens judge panel (theologian / pastor / mature
  # Christian; 52 pairs x 3 = 156 judgements, full coverage, max spread 0.35 so
  # ZERO escalations — the convergence caveat from slice #7 still stands).
  # Entry is gated on RELEVANCE >= 0.75 only. Soundness was scored on every pair
  # and deliberately NOT used to exclude: everystudent-ar is the only Arabic
  # source and these cases are ar-scoped, so a soundness veto deletes the answer
  # key rather than filtering it (9 of 14 cases would have been left with zero
  # credits), and it would mark the engine wrong for returning the genuinely
  # best-matching document. Mean soundness across the 52 pairs was 0.703 —
  # systematically below every prior source; those findings are filed as a
  # content issue instead. `rel=` on each path is the 3-lens mean.
  #
  # The 2 null-language docs (/v/gods-help.html, /v/personally.html) are
  # excluded by standing policy and appear nowhere below.
