<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG · Consumers</title>
    <link
      rel="preload"
      href="/portal/assets/apercu-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/portal/assets/portal.css" />
    <script src="/portal/assets/portal.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/portal"
        >Forge <span class="separator">/</span>
        <span class="brand-rag">RAG</span></a
      >
      <div id="account"></div>
    </header>
    <main>
      <div class="heading">
        <h1>Consumers</h1>
        <div class="toolbar">
          <button class="quiet" id="refresh" hidden>Refresh</button>
          <button id="create" hidden>
            <span class="create-icon" aria-hidden="true">+</span>Create consumer
          </button>
        </div>
      </div>
      <p id="notice" role="status" aria-live="polite"></p>
      <div id="signed-out" hidden>
        <a class="button" href="/portal/login">Continue with GitHub</a>
      </div>
      <section id="directory" aria-label="Consumers" hidden>
        <div
          class="table-scroll"
          tabindex="0"
          role="region"
          aria-label="Consumer list"
        >
          <table>
            <thead>
              <tr>
                <th scope="col">Name</th>
                <th scope="col">Status</th>
                <th scope="col"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <dialog id="workflow" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <noscript><p>Enable JavaScript to manage consumers.</p></noscript>
  </body>
</html>
