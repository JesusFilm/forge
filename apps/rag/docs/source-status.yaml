          discover.ts does not unwrap it, so acquire dies ERR_INVALID_URL — a
          repo defect, deliberately not fixed on the campaign branch. (2)
          igod.co.il is not a Cru property: the footer reads '© המכללה למקרא'
          (HaMichlala LaMikra) and no Cru or EveryStudent marker appears
          anywhere on the site, so the standard rights line and the 'cru' tag
          may misattribute it. (3) It holds 1,020 articles, not the ~5 the
          2026-07-24 recon recorded — the recon counted a <sitemapindex>'s five
          children as if they were pages. Acquiring it would more than double
          this campaign's corpus. Awaiting the operator on all three."
