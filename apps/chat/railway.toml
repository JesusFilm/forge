# Railway only reads this file if the service's "Config-as-code Path" is
# set to apps/chat/railway.toml in the service settings. Without that,
# this file is silently ignored — see apps/admin/railway.toml for the
# cautionary example and README.md "Railway service setup" for the
# wiring checklist (including verifying the deployment record's
# configFile field).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/chat/Dockerfile"
watchPatterns = [
  "/.nvmrc",
  "/railpack.json",
  "/scripts/update-security-ca.sh",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/patches/**",
  "/packages/video-player/**",
  "/packages/watch-url-policy/**",
  "apps/chat/**"]

[deploy]
startCommand = "sh /app/apps/chat/start-production.sh"
# Gates promotion on the new deployment actually serving HTTP (feat-305) —
# restartPolicyType only covers a process that EXITS, not one that boots and
# then fails every request. 60s matches admin/auth/manager/mastra/web.
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# [deploy.env] has been observed to be unreliable on Railway — set
# HOSTNAME=0.0.0.0 as a service variable in the dashboard instead
# (README checklist step). Kept here as documentation of the intent.
[deploy.env]
HOSTNAME = "0.0.0.0"
