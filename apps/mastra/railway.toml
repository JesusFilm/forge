# Railway only reads this file if the service's Config-as-code Path is set to
# apps/mastra/railway.toml. Otherwise configure the same commands in the
# Railway dashboard and treat that dashboard config as canonical.

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @forge/mastra build"

[deploy]
startCommand = "cd apps/mastra && MASTRA_STUDIO_PATH=.mastra/output/studio node .mastra/output/index.mjs"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
