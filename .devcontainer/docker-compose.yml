services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-UTC}
        GIT_DELTA_VERSION: "0.18.2"
        ZSH_IN_DOCKER_VERSION: "1.2.1"
    volumes:
      - ..:/workspace:cached
      - claude-code-bashhistory:/commandhistory
      - claude-code-config:/home/vscode/.claude
      - codex-config:/home/vscode/.codex
      - claude-code-gh:/home/vscode/.config/gh
      - ${HOME}/.gitconfig:/home/vscode/.gitconfig:ro
      - .:/workspace/.devcontainer:ro
    ports:
      - "127.0.0.1:3000:3000"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Keep the container alive for VS Code to attach
    command: sleep infinity

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  claude-code-bashhistory:
  claude-code-config:
  codex-config:
  claude-code-gh:
