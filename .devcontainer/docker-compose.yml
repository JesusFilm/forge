services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-UTC}
        GIT_DELTA_VERSION: "0.18.2"
        ZSH_IN_DOCKER_VERSION: "1.2.1"
        T3_VERSION: "0.0.33"
    volumes:
      - ..:/workspace:cached
      - claude-code-bashhistory:/commandhistory
      - claude-code-config:/home/vscode/.claude
      - codex-config:/home/vscode/.codex
      - claude-code-gh:/home/vscode/.config/gh
      - devcontainer-ssh:/home/vscode/.ssh
      - devcontainer-ssh-host-keys:/etc/ssh/host_keys
      - ${HOME}/.gitconfig:/home/vscode/.gitconfig:ro
      - .:/workspace/.devcontainer:ro
    environment:
      HOST: "0.0.0.0"
      MASTRA_HOST: "0.0.0.0"
      MASTRA_AUTO_DETECT_URL: "true"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3002:3002"
      - "127.0.0.1:3003:3003"
      - "127.0.0.1:3004:3004"
      - "127.0.0.1:3005:3005"
      - "127.0.0.1:3010:3010"
      - "127.0.0.1:3011:3011"
      - "127.0.0.1:3012:3012"
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4111:4111"
      - "127.0.0.1:2222:22"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Keep the container alive for VS Code to attach
    command: >
      bash -lc "sudo install -d -m 0700 /etc/ssh/host_keys &&
      (sudo test -f /etc/ssh/host_keys/ssh_host_ed25519_key ||
      sudo ssh-keygen -q -t ed25519 -N '' -f /etc/ssh/host_keys/ssh_host_ed25519_key) &&
      sudo install -d -m 0755 /run/sshd &&
      sudo install -d -o vscode -g vscode -m 0700 /home/vscode/.ssh &&
      sync-github-authorized-keys &&
      sudo /usr/sbin/sshd &&
      sleep infinity"

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    volumes:
      - pgdata18:/var/lib/postgresql
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata18:
  redisdata:
  claude-code-bashhistory:
  claude-code-config:
  codex-config:
  claude-code-gh:
  devcontainer-ssh:
  devcontainer-ssh-host-keys:
